<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>

    <!-- ============================================ -->
    <!-- STEP 1: CSS FIRST                            -->
    <!-- ============================================ -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        /* Fullscreen real video */
        .video-bg {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
            filter: brightness(0.85) saturate(1.1);
        }

        /* Dark gradient overlay for text readability */
        .overlay-dark {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at center,
                    rgba(0, 0, 0, 0.15) 0%,
                    rgba(0, 0, 0, 0.45) 60%,
                    rgba(0, 0, 0, 0.75) 100%);
            z-index: 1;
        }

        /* Center content */
        .overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
        }

        .loading-text {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 5px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ffdd88, #ff8844, #88ddff, #aaffaa, #ffdd88);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShift 4s linear infinite;
            text-shadow: 0 0 30px rgba(255, 200, 100, 0.5);
        }

        @keyframes textShift {
            0%   { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        .dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
            100% { content: ''; }
        }

        .progress {
            margin-top: 24px;
            width: 340px;
            height: 6px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.15);
            overflow: hidden;
            box-shadow: 0 0 25px rgba(255, 200, 100, 0.3);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            background: linear-gradient(90deg, #ffdd88, #ff8844, #88ddff, #aaffaa);
            background-size: 300% 100%;
            animation: fill 5s ease-in-out forwards, textShift 2s linear infinite;
        }

        @keyframes fill {
            from { width: 0%; }
            to   { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- ============================================ -->
    <!-- STEP 2: REAL VIDEO — REPLACE src WITH YOURS  -->
    <!-- ============================================ -->

    <!-- OPTION A-1: Self-hosted MP4 video file -->
    <video class="video-bg" autoplay muted loop playsinline
           poster="">
        <source src="https://cdn.pixabay.com/video/2023/10/22/186115-878060982_large.mp4"
                type="video/mp4">
    </video>

    <!-- OPTION A-2: If you prefer YouTube embed instead, delete the <video> above
         and uncomment this iframe:

    <iframe class="video-bg"
            src="https://www.youtube.com/embed/VIDEO_ID?autoplay=1&mute=1&loop=1&playlist=VIDEO_ID&controls=0&showinfo=0"
            frameborder="0"
            allow="autoplay; encrypted-media"
            allowfullscreen></iframe>
    -->

    <div class="overlay-dark"></div>

    <div class="overlay">
        <div class="loading-text">Redirecting<span class="dots"></span></div>
        <div class="progress">
            <div class="progress-bar"></div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- STEP 3: ACTUAL WORK — REDIRECT (runs last)    -->
    <!-- ============================================ -->
    <script>
        // Wait 5 seconds so the solar system video is visible, then redirect.
        setTimeout(function () {
            window.location.replace("https://www.example.com");
        }, 5000);
    </script>

    <noscript>
        <meta http-equiv="refresh" content="5; url=https://www.example.com">
    </noscript>

</body>
</html>
