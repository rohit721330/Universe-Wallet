<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>

    <!-- ============================================ -->
    <!-- STEP 1: CSS FIRST                            -->
    <!-- ============================================ -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000005;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        /* ============================================ -->
        /* MILKY WAY GALAXY SCENE                       */
        /* ============================================ */

        /* Deep space base */
        .space {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 50% 50%, #1a0a2e 0%, #0a0415 40%, #000005 100%);
            z-index: 0;
        }

        /* Milky Way diagonal band (dusty galaxy strip) */
        .milky-way {
            position: absolute;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            background:
                radial-gradient(ellipse 800px 200px at 50% 50%,
                    rgba(200, 180, 255, 0.18) 0%,
                    rgba(150, 120, 220, 0.12) 25%,
                    rgba(80, 60, 150, 0.06) 50%,
                    transparent 75%);
            transform: rotate(-35deg);
            filter: blur(15px);
            animation: galaxyDrift 20s ease-in-out infinite alternate;
            z-index: 1;
        }

        @keyframes galaxyDrift {
            0%   { transform: rotate(-35deg) translate(0, 0); }
            100% { transform: rotate(-33deg) translate(20px, -15px); }
        }

        /* Galactic core — bright glowing center */
        .galactic-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background:
                radial-gradient(circle,
                    rgba(255, 250, 230, 0.95) 0%,
                    rgba(255, 220, 180, 0.7) 15%,
                    rgba(255, 150, 100, 0.4) 30%,
                    rgba(180, 100, 200, 0.2) 50%,
                    transparent 75%);
            filter: blur(8px);
            animation: corePulse 4s ease-in-out infinite;
            z-index: 3;
        }

        @keyframes corePulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.9; }
            50%      { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
        }

        /* Inner glow ring around core */
        .core-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background:
                radial-gradient(circle,
                    transparent 30%,
                    rgba(150, 100, 220, 0.15) 45%,
                    rgba(80, 50, 150, 0.08) 60%,
                    transparent 75%);
            filter: blur(20px);
            animation: ringPulse 6s ease-in-out infinite;
            z-index: 2;
        }

        @keyframes ringPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50%      { transform: translate(-50%, -50%) scale(1.1); }
        }

        /* Star field — 3 layers for parallax depth */
        .stars-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .stars-small {
            z-index: 4;
            background-image:
                radial-gradient(1px 1px at 10% 15%, #fff, transparent),
                radial-gradient(1px 1px at 25% 40%, #fff, transparent),
                radial-gradient(1px 1px at 40% 75%, #cfd8ff, transparent),
                radial-gradient(1px 1px at 55% 20%, #fff, transparent),
                radial-gradient(1px 1px at 70% 65%, #fff, transparent),
                radial-gradient(1px 1px at 85% 35%, #ffe8cc, transparent),
                radial-gradient(1px 1px at 95% 80%, #fff, transparent),
                radial-gradient(1px 1px at 15% 85%, #cce0ff, transparent),
                radial-gradient(1px 1px at 65% 5%, #fff, transparent),
                radial-gradient(1px 1px at 45% 50%, #fff, transparent);
            background-size: 100% 100%;
            animation: twinkleSmall 3s ease-in-out infinite alternate;
            opacity: 0.9;
        }

        @keyframes twinkleSmall {
            0%   { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .stars-medium {
            z-index: 4;
            background-image:
                radial-gradient(2px 2px at 20% 25%, #fff, transparent),
                radial-gradient(2px 2px at 60% 50%, #ffddaa, transparent),
                radial-gradient(2px 2px at 80% 15%, #fff, transparent),
                radial-gradient(2px 2px at 35% 70%, #aaddff, transparent),
                radial-gradient(2px 2px at 90% 60%, #fff, transparent);
            background-size: 100% 100%;
            animation: twinkleMedium 4s ease-in-out infinite alternate;
        }

        @keyframes twinkleMedium {
            0%   { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .stars-large {
            z-index: 4;
            background-image:
                radial-gradient(3px 3px at 30% 35%, #fff, transparent),
                radial-gradient(3px 3px at 75% 55%, #ffccaa, transparent),
                radial-gradient(3px 3px at 50% 80%, #ccddff, transparent);
            background-size: 100% 100%;
            animation: twinkleLarge 5s ease-in-out infinite alternate;
            filter: blur(0.5px);
        }

        @keyframes twinkleLarge {
            0%   { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Colored nebula clouds */
        .nebula {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            pointer-events: none;
            z-index: 2;
        }

        .nebula-1 {
            width: 350px;
            height: 250px;
            top: 10%;
            left: 10%;
            background: radial-gradient(circle, rgba(120, 40, 200, 0.35), transparent 70%);
            animation: nebulaFloat1 15s ease-in-out infinite alternate;
        }

        .nebula-2 {
            width: 400px;
            height: 300px;
            bottom: 5%;
            right: 8%;
            background: radial-gradient(circle, rgba(200, 60, 140, 0.3), transparent 70%);
            animation: nebulaFloat2 18s ease-in-out infinite alternate;
        }

        .nebula-3 {
            width: 300px;
            height: 280px;
            top: 40%;
            right: 15%;
            background: radial-gradient(circle, rgba(40, 140, 220, 0.28), transparent 70%);
            animation: nebulaFloat3 20s ease-in-out infinite alternate;
        }

        .nebula-4 {
            width: 280px;
            height: 220px;
            bottom: 20%;
            left: 5%;
            background: radial-gradient(circle, rgba(80, 200, 140, 0.22), transparent 70%);
            animation: nebulaFloat1 16s ease-in-out infinite alternate reverse;
        }

        @keyframes nebulaFloat1 {
            0%   { transform: translate(0, 0) scale(1); opacity: 0.7; }
            100% { transform: translate(40px, -30px) scale(1.15); opacity: 1; }
        }
        @keyframes nebulaFloat2 {
            0%   { transform: translate(0, 0) scale(1.1); opacity: 0.8; }
            100% { transform: translate(-50px, 20px) scale(0.95); opacity: 1; }
        }
        @keyframes nebulaFloat3 {
            0%   { transform: translate(0, 0) scale(0.9); opacity: 0.6; }
            100% { transform: translate(30px, 40px) scale(1.1); opacity: 1; }
        }

        /* ============================================ -->
        /* PLANETS                                      */
        /* ============================================ */

        /* Planet 1 — big blue gas giant (top right) */
        .planet-1 {
            position: absolute;
            top: 12%;
            right: 8%;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 35%,
                    #aaddff 0%,
                    #5b9bd5 30%,
                    #2b5a99 65%,
                    #0d2b5c 100%);
            box-shadow:
                inset -12px -12px 25px rgba(0, 0, 0, 0.6),
                inset 5px 5px 15px rgba(180, 220, 255, 0.4),
                0 0 30px rgba(90, 150, 220, 0.5);
            animation: planetFloat1 8s ease-in-out infinite;
            z-index: 5;
        }

        /* Planet 1 ring */
        .planet-1::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 160px;
            height: 30px;
            border: 2px solid rgba(200, 220, 255, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%) rotate(-20deg);
            box-shadow: 0 0 10px rgba(150, 200, 255, 0.4);
        }

        @keyframes planetFloat1 {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50%      { transform: translateY(-15px) rotate(5deg); }
        }

        /* Planet 2 — red/orange Mars-like (bottom left) */
        .planet-2 {
            position: absolute;
            bottom: 15%;
            left: 10%;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 35%,
                    #ff9966 0%,
                    #e05533 40%,
                    #a02810 80%,
                    #4a0d00 100%);
            box-shadow:
                inset -8px -8px 18px rgba(0, 0, 0, 0.7),
                inset 4px 4px 10px rgba(255, 200, 150, 0.3),
                0 0 25px rgba(220, 80, 50, 0.45);
            animation: planetFloat2 10s ease-in-out infinite;
            z-index: 5;
        }

        @keyframes planetFloat2 {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50%      { transform: translateY(12px) rotate(-4deg); }
        }

        /* Planet 3 — small purple planet (left mid) */
        .planet-3 {
            position: absolute;
            top: 55%;
            left: 6%;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 30% 30%,
                    #ddaaff 0%,
                    #9944cc 45%,
                    #551188 85%,
                    #1a0033 100%);
            box-shadow:
                inset -6px -6px 12px rgba(0, 0, 0, 0.7),
                0 0 20px rgba(170, 90, 220, 0.5);
            animation: planetFloat3 7s ease-in-out infinite;
            z-index: 5;
        }

        @keyframes planetFloat3 {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-10px); }
        }

        /* Planet 4 — teal planet (bottom right) */
        .planet-4 {
            position: absolute;
            bottom: 25%;
            right: 12%;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 30%,
                    #88ffdd 0%,
                    #22aa99 40%,
                    #0a5544 85%,
                    #001a15 100%);
            box-shadow:
                inset -5px -5px 10px rgba(0, 0, 0, 0.7),
                0 0 18px rgba(80, 220, 180, 0.5);
            animation: planetFloat2 9s ease-in-out infinite reverse;
            z-index: 5;
        }

        /* Moon orbiting planet 2 */
        .moon {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #eee, #888);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
            z-index: 6;
            animation: orbit 6s linear infinite;
        }

        @keyframes orbit {
            0% {
                top: calc(15% - 6px);
                left: calc(10% + 60px + 50px - 6px);
            }
            25% {
                top: calc(15% + 60px / 2 - 6px);
                left: calc(10% + 60px + 100px - 6px);
            }
            50% {
                top: calc(15% + 60px + 50px - 6px);
                left: calc(10% + 60px + 50px - 6px);
            }
            75% {
                top: calc(15% + 60px / 2 - 6px);
                left: calc(10% + 60px - 6px);
            }
            100% {
                top: calc(15% - 6px);
                left: calc(10% + 60px + 50px - 6px);
            }
        }

        /* ============================================ -->
        /* SHOOTING STARS                               */
        /* ============================================ -->

        .shooting-star {
            position: absolute;
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.8) 50%,
                #fff 100%);
            border-radius: 2px;
            transform-origin: right center;
            opacity: 0;
            filter: drop-shadow(0 0 4px #fff);
            z-index: 7;
        }

        .shooting-star::after {
            content: '';
            position: absolute;
            right: -3px;
            top: 50%;
            transform: translateY(-50%);
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 8px #fff, 0 0 16px #aaddff;
        }

        .shoot-1 {
            top: 20%;
            left: -130px;
            animation: shoot 6s linear infinite;
            animation-delay: 1s;
        }

        .shoot-2 {
            top: 60%;
            left: -130px;
            animation: shoot 8s linear infinite;
            animation-delay: 4s;
        }

        .shoot-3 {
            top: 35%;
            left: -130px;
            animation: shoot 10s linear infinite;
            animation-delay: 7s;
        }

        @keyframes shoot {
            0%   { transform: translateX(0) translateY(0) rotate(20deg); opacity: 0; }
            5%   { opacity: 1; }
            60%  { transform: translateX(calc(100vw + 130px)) translateY(30vh) rotate(20deg); opacity: 1; }
            65%  { opacity: 0; }
            100% { transform: translateX(calc(100vw + 130px)) translateY(30vh) rotate(20deg); opacity: 0; }
        }

        /* ============================================ -->
        /* OVERLAY TEXT                                 */
        /* ============================================ -->

        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            pointer-events: none;
        }

        .loading-text {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 5px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ffdd88, #aa88ff, #88ddff, #ffaadd, #ffdd88);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShift 4s linear infinite;
            text-shadow: 0 0 30px rgba(150, 180, 255, 0.5);
        }

        @keyframes textShift {
            0%   { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        .dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
            100% { content: ''; }
        }

        .progress {
            margin-top: 22px;
            width: 320px;
            height: 6px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
            box-shadow: 0 0 20px rgba(150, 180, 255, 0.25);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            background: linear-gradient(90deg, #ffdd88, #aa88ff, #88ddff, #ffaadd);
            background-size: 300% 100%;
            animation: fill 4s ease-in-out forwards, textShift 2s linear infinite;
        }

        @keyframes fill {
            from { width: 0%; }
            to   { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- ============================================ -->
    <!-- STEP 2: HTML STRUCTURE — MILKY WAY SCENE     -->
    <!-- ============================================ -->

    <div class="space"></div>

    <!-- Nebula clouds -->
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>
    <div class="nebula nebula-4"></div>

    <!-- Milky Way band + glowing core -->
    <div class="milky-way"></div>
    <div class="core-ring"></div>
    <div class="galactic-core"></div>

    <!-- Star layers -->
    <div class="stars-layer stars-small"></div>
    <div class="stars-layer stars-medium"></div>
    <div class="stars-layer stars-large"></div>

    <!-- Planets -->
    <div class="planet-1"></div>
    <div class="planet-2"></div>
    <div class="planet-3"></div>
    <div class="planet-4"></div>
    <div class="moon"></div>

    <!-- Shooting stars -->
    <div class="shooting-star shoot-1"></div>
    <div class="shooting-star shoot-2"></div>
    <div class="shooting-star shoot-3"></div>

    <!-- Overlay text -->
    <div class="overlay">
        <div class="loading-text">Redirecting<span class="dots"></span></div>
        <div class="progress">
            <div class="progress-bar"></div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- STEP 3: ACTUAL WORK — REDIRECT (runs last)    -->
    <!-- ============================================ -->
    <script>
        // Wait 4 seconds so the galaxy is visible, then redirect.
        setTimeout(function () {
            window.location.replace("https://www.example.com");
        }, 4000);
    </script>

    <noscript>
        <meta http-equiv="refresh" content="4; url=https://www.example.com">
    </noscript>

</body>
</html>
