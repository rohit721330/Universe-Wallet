<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>W𝙸ᴛʜᴅʀᴀᴡᴀʟ Mɢᴍᴛ • Aᴅᴍ𝙸ɴ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #11162e;
            --bg-card: #1a1f3a;
            --text-primary: #ffffff;
            --text-secondary: #8a8fad;
            --text-muted: #6b6f8d;
            --border-color: rgba(0, 240, 255, 0.12);
            --border-soft: rgba(0, 240, 255, 0.06);
            --accent: #00f0ff;
            --accent-gradient: linear-gradient(135deg, #00f0ff, #0088ff);
            --accent-glow: rgba(0, 240, 255, 0.3);
            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.3);
            --nav-bg: rgba(8, 12, 28, 0.95);
            --input-bg: #0a0e27;
            --grid-color: rgba(0, 240, 255, 0.06);
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --anodized-glow: 0 0 30px rgba(0, 240, 255, 0.15);
            --anodized-border: 1px solid rgba(0, 240, 255, 0.2);
        }
        
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 1rem;
            padding-bottom: 2rem;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
            animation: gridMove 8s linear infinite;
        }
        @keyframes gridMove { 0% { transform: translate(0,0); } 100% { transform: translate(50px,50px); } }
        
        .electron-particle {
            position: fixed;
            bottom: -20px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: riseElectron linear infinite;
            opacity: 0;
            box-shadow: 0 0 20px rgba(0,240,255,0.4), 0 0 60px rgba(0,240,255,0.1);
        }
        .electron-particle.big { box-shadow: 0 0 30px rgba(0,240,255,0.6), 0 0 80px rgba(0,240,255,0.15); background: radial-gradient(circle, #00f0ff, #0088ff); }
        .electron-particle.small { box-shadow: 0 0 15px rgba(0,240,255,0.3); background: radial-gradient(circle, #00f0ff, transparent); }
        @keyframes riseElectron { 0% { transform: translateY(0) scale(1); opacity: 0; } 5% { opacity: 0.8; } 95% { opacity: 0.8; } 100% { transform: translateY(-100vh) scale(0.3); opacity: 0; } }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0 1.5rem 0;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .back-btn {
            background: var(--bg-secondary);
            border: var(--anodized-border);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: var(--text-primary);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 0 20px rgba(0,240,255,0.05);
        }
        .back-btn:active { transform: scale(0.95); }
        .back-btn:hover { border-color: var(--accent); }
        
        .header-logo {
            font-size: 1.3rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(0,240,255,0.2);
        }
        .header-right {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        .admin-badge {
            background: rgba(0,240,255,0.15);
            color: var(--accent);
            padding: 0.25rem 0.75rem;
            border-radius: 2rem;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: var(--anodized-border);
            box-shadow: 0 0 20px rgba(0,240,255,0.1);
        }
        .admin-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0,240,255,0.3);
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ===== SETTINGS CARD ===== */
        .settings-card { 
            background: var(--bg-secondary); 
            border: var(--anodized-border); 
            border-radius: 1.5rem; 
            padding: 1.5rem; 
            margin-bottom: 1.5rem; 
            box-shadow: var(--anodized-glow);
        }
        .settings-card:hover { border-color: rgba(0,240,255,0.3); }
        .settings-card .section-title { 
            font-size: 0.85rem; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            color: var(--text-secondary); 
            margin-bottom: 1rem; 
            display: flex; 
            align-items: center; 
            gap: 0.5rem; 
        }
        .settings-card .section-title i { color: var(--accent); text-shadow: 0 0 20px rgba(0,240,255,0.3); }

        /* Settings Labels (Before Toggle) */
        .settings-label-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border-soft);
        }
        .settings-label-item:last-child {
            border-bottom: none;
        }
        .settings-label-item .label-text {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .settings-label-item .label-text i {
            margin-right: 0.5rem;
            color: var(--accent);
            opacity: 0.7;
            width: 18px;
        }
        .settings-label-item .label-value {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-primary);
            background: var(--bg-card);
            padding: 0.15rem 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-soft);
        }
        .settings-label-item .label-value.empty {
            color: var(--text-muted);
            font-weight: 400;
            opacity: 0.5;
        }

        /* Enable Withdrawal Row */
        .settings-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0.6rem 0; 
            border-top: 1px solid var(--border-soft);
            margin-top: 0.5rem;
            padding-top: 0.8rem;
        }
        .settings-row .label { 
            font-size: 0.8rem; 
            font-weight: 500; 
            color: var(--text-secondary); 
        }
        .settings-row .label i { 
            margin-right: 0.5rem; 
            color: var(--accent); 
            opacity: 0.7; 
        }

        .toggle-switch { position: relative; width: 48px; height: 26px; flex-shrink: 0; cursor: pointer; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 2rem; transition: all 0.3s; }
        .toggle-slider::before { content: ""; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px; background: var(--text-muted); border-radius: 50%; transition: all 0.3s; }
        .toggle-switch input:checked + .toggle-slider { background: rgba(0, 240, 255, 0.2); border-color: var(--accent); }
        .toggle-switch input:checked + .toggle-slider::before { transform: translateX(22px); background: var(--accent); box-shadow: 0 0 20px rgba(0, 240, 255, 0.3); }

        /* Settings Inputs Grid (Edit Mode) */
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-top: 0.75rem;
        }
        .settings-grid .input-group label { 
            display: block; 
            font-size: 0.6rem; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            letter-spacing: 0.3px; 
            margin-bottom: 0.25rem; 
        }
        .settings-grid .input-group input { 
            width: 100%; 
            padding: 0.5rem 0.75rem; 
            background: var(--input-bg); 
            border: var(--anodized-border); 
            border-radius: 0.5rem; 
            color: var(--text-primary); 
            font-size: 0.85rem; 
            font-weight: 600; 
            outline: none; 
            transition: all 0.3s; 
        }
        .settings-grid .input-group input:focus { 
            border-color: var(--accent); 
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1); 
        }
        .settings-grid .input-group input::placeholder {
            color: var(--text-muted);
            opacity: 0.5;
            font-weight: 400;
            font-family: 'Inter', sans-serif;
        }

        .settings-full { grid-column: 1 / -1; }

        /* Fee Input - Full Width */
        .fee-input {
            grid-column: 1 / -1;
        }

        /* Withdrawal Limit Section */
        .limit-section {
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border-soft);
        }
        .limit-section .limit-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .limit-section .limit-label i {
            color: var(--accent);
        }

        .btn-save-settings { 
            width: 100%; 
            padding: 0.7rem; 
            background: var(--accent-gradient); 
            border: none; 
            border-radius: 0.75rem; 
            color: #fff; 
            font-weight: 700; 
            font-size: 0.85rem; 
            cursor: pointer; 
            transition: all 0.2s; 
            font-family: 'Inter', sans-serif; 
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.2); 
            margin-top: 0.75rem; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-save-settings:active { transform: scale(0.97); }
        .btn-save-settings:disabled { opacity: 0.5; cursor: not-allowed; }

        .status-badge { 
            display: inline-flex; 
            align-items: center; 
            gap: 0.3rem; 
            padding: 0.15rem 0.6rem; 
            border-radius: 2rem; 
            font-size: 0.55rem; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.3px; 
            margin-top: 0.5rem;
        }
        .status-badge.enabled { background: rgba(34,197,94,0.15); color: var(--success); }
        .status-badge.disabled { background: rgba(239,68,68,0.15); color: var(--danger); }

        /* ===== STATS ===== */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-bottom: 1rem; }
        .stat-card { background: var(--bg-card); border: var(--anodized-border); border-radius: 0.75rem; padding: 0.5rem; text-align: center; box-shadow: var(--anodized-glow); }
        .stat-card .stat-number { font-size: 0.9rem; font-weight: 800; }
        .stat-card .stat-number.total { color: var(--accent); text-shadow: 0 0 30px rgba(0,240,255,0.2); }
        .stat-card .stat-number.pending { color: var(--warning); }
        .stat-card .stat-number.completed { color: var(--success); }
        .stat-card .stat-number.failed { color: var(--danger); }
        .stat-card .stat-label { font-size: 0.45rem; text-transform: uppercase; letter-spacing: 0.3px; color: var(--text-secondary); margin-top: 2px; }

        /* ===== FILTERS ===== */
        .filter-section { background: var(--bg-card); border: var(--anodized-border); border-radius: 1rem; padding: 0.75rem; margin-bottom: 1rem; box-shadow: var(--anodized-glow); }
        .filter-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
        .filter-row:last-child { margin-bottom: 0; }
        .filter-row select, .filter-row input { flex: 1; padding: 0.3rem 0.6rem; background: var(--bg-primary); border: var(--anodized-border); border-radius: 0.5rem; color: var(--text-primary); font-size: 0.7rem; font-family: 'Inter', sans-serif; min-width: 60px; }
        .filter-row select option { background: var(--bg-secondary); }
        .filter-btn { padding: 0.3rem 0.8rem; background: var(--bg-primary); border: var(--anodized-border); border-radius: 2rem; color: var(--text-secondary); font-size: 0.6rem; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s; }
        .filter-btn:active { transform: scale(0.95); }

        /* ===== WITHDRAWAL ITEMS ===== */
        .withdraw-item { background: var(--bg-card); border: var(--anodized-border); border-radius: 0.75rem; padding: 0.75rem; margin-bottom: 0.5rem; transition: all 0.2s; box-shadow: var(--anodized-glow); }
        .withdraw-item:hover { border-color: rgba(0,240,255,0.3); }
        .withdraw-item .withdraw-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .withdraw-item .withdraw-user { font-weight: 700; font-size: 0.85rem; color: var(--text-primary); }
        .withdraw-item .withdraw-method { font-size: 0.6rem; padding: 0.1rem 0.5rem; border-radius: 2rem; font-weight: 600; }
        .withdraw-item .withdraw-method.upi { background: rgba(59,130,246,0.15); color: #3b82f6; }
        .withdraw-item .withdraw-method.bank { background: rgba(16,185,129,0.15); color: #10b981; }
        .withdraw-item .withdraw-details { display: flex; flex-wrap: wrap; gap: 0.3rem 0.8rem; margin-top: 0.2rem; }
        .withdraw-item .withdraw-details span { font-size: 0.55rem; color: var(--text-secondary); }
        .withdraw-item .withdraw-details i { margin-right: 0.2rem; color: var(--accent); opacity: 0.6; width: 12px; }
        .withdraw-item .withdraw-amount { font-weight: 700; font-size: 0.9rem; color: var(--accent); }
        .withdraw-item .withdraw-status { padding: 0.1rem 0.5rem; border-radius: 2rem; font-size: 0.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
        .withdraw-item .withdraw-status.pending { background: rgba(245,158,11,0.15); color: var(--warning); }
        .withdraw-item .withdraw-status.processing { background: rgba(59,130,246,0.15); color: #3b82f6; }
        .withdraw-item .withdraw-status.completed { background: rgba(34,197,94,0.15); color: var(--success); }
        .withdraw-item .withdraw-status.failed { background: rgba(239,68,68,0.15); color: var(--danger); }
        .withdraw-item .withdraw-status.cancelled { background: rgba(107,114,128,0.15); color: #6b7280; }
        .withdraw-item .withdraw-actions { display: flex; gap: 0.3rem; margin-top: 0.4rem; flex-wrap: wrap; }
        .withdraw-item .withdraw-actions button { padding: 0.2rem 0.6rem; border-radius: 0.5rem; font-size: 0.55rem; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif; }
        .withdraw-item .withdraw-actions button:active { transform: scale(0.95); }
        .withdraw-item .withdraw-actions .btn-approve { background: rgba(34,197,94,0.15); color: var(--success); }
        .withdraw-item .withdraw-actions .btn-reject { background: rgba(239,68,68,0.15); color: var(--danger); }
        .withdraw-item .withdraw-actions .btn-view { background: rgba(0,240,255,0.1); color: var(--accent); }
        .withdraw-item .withdraw-admin-note { margin-top: 0.3rem; font-size: 0.55rem; color: var(--text-muted); padding: 0.3rem; background: rgba(0,0,0,0.2); border-radius: 0.3rem; }
        .withdraw-item .withdraw-admin-note i { margin-right: 0.3rem; color: var(--warning); }

        /* ===== PAGINATION ===== */
        .pagination { display: flex; justify-content: center; align-items: center; gap: 0.5rem; margin-top: 1rem; padding: 0.5rem 0; }
        .pagination button { background: var(--bg-card); border: var(--anodized-border); color: var(--text-secondary); padding: 0.3rem 0.6rem; border-radius: 0.5rem; cursor: pointer; transition: all 0.2s; font-size: 0.7rem; font-family: 'Inter', sans-serif; }
        .pagination button:disabled { opacity: 0.3; cursor: not-allowed; }
        .pagination .page-info { font-size: 0.65rem; color: var(--text-muted); padding: 0 0.5rem; }

        /* ===== TOAST ===== */
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 10px 18px; border-radius: 2rem; font-size: 0.75rem; font-weight: 600; z-index: 3000; opacity: 0; transition: all 0.3s; pointer-events: none; white-space: nowrap; max-width: 90%; border: var(--anodized-border); }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(10px); }
        .toast.success { background: var(--success); color: #fff; }
        .toast.error { background: var(--danger); color: #fff; }
        .toast.warning { background: var(--warning); color: #fff; }
        .toast.info { background: var(--bg-card); color: var(--accent); border-color: var(--accent); box-shadow: 0 0 40px rgba(0,240,255,0.2); }

        /* ===== LOADING & EMPTY ===== */
        .loading-state { text-align: center; padding: 2rem; color: var(--text-secondary); }
        .loading-state i { font-size: 2rem; margin-bottom: 0.5rem; display: block; animation: spin 1s linear infinite; color: var(--accent); }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 2rem; color: var(--text-secondary); }
        .empty-state i { font-size: 2.5rem; display: block; margin-bottom: 0.5rem; opacity: 0.3; }

        /* ===== MODAL ===== */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 2000; display: none; justify-content: center; align-items: center; padding: 1rem; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--bg-secondary); border: var(--anodized-border); border-radius: 1.5rem; padding: 1.5rem; max-width: 450px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.5), var(--anodized-glow); animation: modalIn 0.3s ease; }
        @keyframes modalIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: var(--anodized-border); }
        .modal-header h3 { font-size: 1rem; font-weight: 700; color: var(--text-primary); }
        .modal-header h3 i { color: var(--accent); margin-right: 0.5rem; }
        .modal-close { background: var(--bg-card); border: var(--anodized-border); color: var(--text-secondary); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
        .modal-close:active { transform: scale(0.9); }
        .modal-body .detail-row { display: flex; justify-content: space-between; padding: 0.4rem 0; border-bottom: 1px solid var(--border-soft); }
        .modal-body .detail-row:last-child { border-bottom: none; }
        .modal-body .detail-row .label { color: var(--text-secondary); font-size: 0.7rem; }
        .modal-body .detail-row .value { color: var(--text-primary); font-weight: 600; font-size: 0.8rem; text-align: right; max-width: 60%; word-break: break-all; }
        .modal-body .detail-row .value.balance { color: var(--accent); }
        .modal-body .detail-row .value .status-badge { padding: 0.1rem 0.5rem; border-radius: 2rem; font-size: 0.6rem; font-weight: 700; }
        .modal-footer { display: flex; gap: 0.5rem; margin-top: 1rem; padding-top: 0.75rem; border-top: var(--anodized-border); justify-content: flex-end; }
        .modal-footer button { padding: 0.4rem 1rem; border-radius: 0.75rem; border: none; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif; font-size: 0.75rem; }
        .modal-footer button:active { transform: scale(0.95); }
        .modal-footer .btn-cancel { background: var(--bg-card); color: var(--text-secondary); border: var(--anodized-border); }
        .modal-footer .btn-confirm { background: var(--accent-gradient); color: #fff; box-shadow: 0 4px 20px rgba(0,240,255,0.3); }
        .modal-footer .btn-danger { background: var(--danger); color: #fff; box-shadow: 0 4px 20px rgba(239,68,68,0.3); }

        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .settings-grid { grid-template-columns: 1fr; }
            .settings-grid .fee-input { grid-column: 1; }
            .filter-row { flex-direction: column; }
            .filter-row select, .filter-row input { width: 100%; }
            .withdraw-item .withdraw-header { flex-direction: column; }
            .withdraw-item .withdraw-right { width: 100%; display: flex; justify-content: space-between; margin-top: 0.3rem; }
            .header-logo { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div id="particles"></div>

    <div class="content-wrapper">
        <header class="header">
            <div class="header-left">
                <a href="/rohit" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <span class="header-logo">W𝙸ᴛʜᴅʀᴀᴡᴀʟ Mɢᴍᴛ</span>
            </div>
            <div class="header-right">
                <span class="admin-badge"><i class="fas fa-bolt"></i> Aᴅᴍ𝙸ɴ</span>
                <div class="admin-avatar"><i class="fas fa-user"></i></div>
            </div>
        </header>

        <div class="container">
            
            <!-- ===== SETTINGS SECTION ===== -->
            <div class="settings-card">
                <div class="section-title"><i class="fas fa-sliders-h"></i> W𝙸ᴛʜᴅʀᴀᴡᴀʟ Sᴇᴛᴛ𝙸ɴɢꜱ</div>
                
                <!-- ===== SETTINGS LABELS (Before Toggle) ===== -->
                <div class="settings-label-item">
                    <span class="label-text"><i class="fas fa-arrow-down"></i> Mɪɴ Aᴍᴏᴜɴᴛ Fᴏʀ Wɪᴛʜᴅʀᴀᴡᴀʟ</span>
                    <span class="label-value" id="displayMinAmount">—</span>
                </div>
                
                <div class="settings-label-item">
                    <span class="label-text"><i class="fas fa-arrow-up"></i> Mᴀx Aᴍᴏᴜɴᴛ Fᴏʀ Wɪᴛʜᴅʀᴀᴡᴀʟ</span>
                    <span class="label-value" id="displayMaxAmount">—</span>
                </div>
                
                <div class="settings-label-item">
                    <span class="label-text"><i class="fas fa-percent"></i> Fᴇᴇ</span>
                    <span class="label-value" id="displayFee">—</span>
                </div>
                
                <div class="settings-label-item">
                    <span class="label-text"><i class="fas fa-clock"></i> Dᴀɪʟʏ Wɪᴛʜᴅʀᴀᴡᴀʟ Lɪᴍɪᴛ</span>
                    <span class="label-value" id="displayDailyLimit">—</span>
                </div>
                
                <div class="settings-label-item">
                    <span class="label-text"><i class="fas fa-calendar-alt"></i> Mᴏɴᴛʜʟʏ Wɪᴛʜᴅʀᴀᴡᴀʟ Lɪᴍɪᴛ</span>
                    <span class="label-value" id="displayMonthlyLimit">—</span>
                </div>

                <!-- ===== ENABLE WITHDRAWAL (With Toggle) ===== -->
                <div class="settings-row">
                    <span class="label"><i class="fas fa-power-off"></i> Eɴᴀʙʟᴇ Wɪᴛʜᴅʀᴀᴡᴀʟ</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="withdrawEnabled" onchange="updateSettingsStatus()">
                        <span class="toggle-slider"></span>
                    </label>
                </div>

                <!-- ===== EDIT FIELDS (Hidden by default, shown on edit) ===== -->
                <div id="editFields" style="display: none; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-soft);">
                    <div class="settings-grid">
                        <div class="input-group">
                            <label>Mɪɴ Aᴍᴏᴜɴᴛ (₹)</label>
                            <input type="number" id="minWithdraw" placeholder="Eɴᴛᴇʀ Mɪɴ Aᴍᴏᴜɴᴛ" min="1">
                        </div>
                        <div class="input-group">
                            <label>Mᴀx Aᴍᴏᴜɴᴛ (₹)</label>
                            <input type="number" id="maxWithdraw" placeholder="Eɴᴛᴇʀ Mᴀx Aᴍᴏᴜɴᴛ" min="1">
                        </div>
                    </div>

                    <div class="settings-grid">
                        <div class="input-group fee-input">
                            <label>Fᴇᴇ (%)</label>
                            <input type="number" id="withdrawFee" placeholder="Eɴᴛᴇʀ Fᴇᴇ Nᴜᴍʙᴇʀ" min="0" step="0.5">
                        </div>
                    </div>

                    <div class="limit-section">
                        <div class="limit-label"><i class="fas fa-clock"></i> Wɪᴛʜᴅʀᴀᴡᴀʟ Lɪᴍɪᴛ</div>
                        <div class="settings-grid">
                            <div class="input-group">
                                <label>Mᴀx Dᴀɪʟʏ Wɪᴛʜᴅʀᴀᴡᴀʟꜱ</label>
                                <input type="number" id="maxDailyWithdrawals" placeholder="Eɴᴛᴇʀ Dᴀɪʟʏ Lɪᴍɪᴛ" min="0">
                            </div>
                            <div class="input-group">
                                <label>Mᴀx Mᴏɴᴛʜʟʏ Wɪᴛʜᴅʀᴀᴡᴀʟꜱ</label>
                                <input type="number" id="maxMonthlyWithdrawals" placeholder="Eɴᴛᴇʀ Mᴏɴᴛʜʟʏ Lɪᴍɪᴛ" min="0">
                            </div>
                        </div>
                    </div>

                    <button class="btn-save-settings" onclick="saveSettings()">
                        <i class="fas fa-save"></i> Sᴀᴠᴇ Sᴇᴛᴛɪɴɢꜱ
                    </button>
                    <button class="btn-save-settings" onclick="toggleEditMode()" style="margin-top:0.5rem;background:var(--bg-card);box-shadow:none;border:var(--anodized-border);">
                        <i class="fas fa-times"></i> Cᴀɴᴄᴇʟ
                    </button>
                </div>

                <!-- ===== EDIT BUTTON ===== -->
                <button class="btn-save-settings" id="editBtn" onclick="toggleEditMode()" style="margin-top:0.75rem;background:var(--bg-card);box-shadow:none;border:var(--anodized-border);">
                    <i class="fas fa-pen"></i> Eᴅɪᴛ Sᴇᴛᴛɪɴɢꜱ
                </button>

                <div style="text-align:center;">
                    <span id="settingsStatus" class="status-badge enabled"><i class="fas fa-circle"></i> Lᴏᴀᴅɪɴɢ...</span>
                </div>
            </div>

            <!-- ===== STATS SECTION ===== -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="stat-number total" id="totalWithdrawals">0</div>
                    <div class="stat-label">Tᴏᴛᴀʟ</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number pending" id="pendingWithdrawals">0</div>
                    <div class="stat-label">Pᴇɴᴅɪɴɢ</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number completed" id="completedWithdrawals">0</div>
                    <div class="stat-label">Cᴏᴍᴘʟᴇᴛᴇᴅ</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number failed" id="failedWithdrawals">0</div>
                    <div class="stat-label">Fᴀɪʟᴇᴅ</div>
                </div>
            </div>

            <!-- ===== FILTER SECTION ===== -->
            <div class="filter-section">
                <div class="filter-row">
                    <select id="statusFilter" onchange="applyFilters()">
                        <option value="all">Aʟʟ Sᴛᴀᴛᴜꜱ</option>
                        <option value="pending">Pᴇɴᴅɪɴɢ</option>
                        <option value="processing">Pʀᴏᴄᴇꜱꜱɪɴɢ</option>
                        <option value="completed">Cᴏᴍᴘʟᴇᴛᴇᴅ</option>
                        <option value="failed">Fᴀɪʟᴇᴅ</option>
                        <option value="cancelled">Cᴀɴᴄᴇʟʟᴇᴅ</option>
                    </select>
                    <select id="methodFilter" onchange="applyFilters()">
                        <option value="all">Aʟʟ Mᴇᴛʜᴏᴅꜱ</option>
                        <option value="upi">Uᴘɪ</option>
                        <option value="bank">Bᴀɴᴋ</option>
                    </select>
                    <input type="text" id="searchInput" placeholder="Sᴇᴀʀᴄʜ..." onkeyup="applyFilters()">
                </div>
                <div class="filter-row">
                    <button class="filter-btn" onclick="refreshData()"><i class="fas fa-sync"></i> Rᴇꜰʀᴇꜱʜ</button>
                    <button class="filter-btn" onclick="exportCSV()"><i class="fas fa-file-export"></i> Exᴘᴏʀᴛ</button>
                </div>
            </div>

            <!-- ===== WITHDRAWAL LIST ===== -->
            <div id="withdrawList">
                <div class="loading-state">
                    <i class="fas fa-bolt"></i>
                    <p>Lᴏᴀᴅɪɴɢ...</p>
                </div>
            </div>

            <div class="pagination" id="pagination">
                <button onclick="changePage('prev')" id="prevPage" disabled>
                    <i class="fas fa-chevron-left"></i>
                </button>
                <span class="page-info" id="pageInfo">Pᴀɢᴇ 1 ᴏꜰ 1</span>
                <button onclick="changePage('next')" id="nextPage" disabled>
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="userModal">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="fas fa-arrow-up"></i> <span id="modalTitle">Dᴇᴛᴀɪʟꜱ</span></h3>
                <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeModal()">Cʟᴏꜱᴇ</button>
                <button class="btn-confirm" id="modalActionBtn" style="display:none;">Aᴄᴛɪᴏɴ</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================
        // PARTICLES
        // ============================================
        function createElectronParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.className = 'electron-particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (8 + Math.random() * 15) + 's';
                p.style.animationDelay = Math.random() * 15 + 's';
                const size = 2 + Math.random() * 8;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.classList.add(size > 5 ? 'big' : 'small');
                container.appendChild(p);
            }
        }

        // ============================================
        // STATE
        // ============================================
        let state = {
            withdrawals: [],
            currentPage: 1,
            limit: 20,
            totalPages: 1,
            total: 0,
            status: 'all',
            method: 'all',
            search: '',
            settings: {
                enabled: true,
                minAmount: '',
                maxAmount: '',
                fee: '',
                maxDailyWithdrawals: '',
                maxMonthlyWithdrawals: ''
            },
            editMode: false
        };

        // ============================================
        // AUTH
        // ============================================
        function getToken() { 
            return localStorage.getItem('adminToken') || localStorage.getItem('token');
        }

        function checkAuth() {
            const token = getToken();
            if (!token) { 
                showToast('Pʟᴇᴀꜱᴇ Lᴏɢɪɴ Tᴏ Aᴄᴄᴇꜱꜱ.', 'error');
                setTimeout(() => window.location.href = '/admin', 1500);
                return false;
            }
            return true;
        }

        // ============================================
        // API CALL
        // ============================================
        async function apiCall(endpoint, options = {}) {
            const token = getToken();
            if (!token) throw new Error('Nᴏᴛ ᴀᴜᴛʜᴇɴᴛɪᴄᴀᴛᴇᴅ');

            const defaultOptions = {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            };

            const response = await fetch(endpoint, { ...defaultOptions, ...options });
            
            const contentType = response.headers.get('content-type');
            if (!contentType || !contentType.includes('application/json')) {
                const text = await response.text();
                throw new Error('Sᴇʀᴠᴇʀ Rᴇᴛᴜʀɴᴇᴅ Iɴᴠᴀʟɪᴅ Rᴇꜱᴘᴏɴꜱᴇ');
            }

            const data = await response.json();
            
            if (!response.ok) {
                if (response.status === 401) {
                    localStorage.removeItem('adminToken');
                    localStorage.removeItem('token');
                    showToast('Sᴇꜱꜱɪᴏɴ Exᴘɪʀᴇᴅ.', 'error');
                    setTimeout(() => window.location.href = '/admin', 1500);
                    throw new Error('Sᴇꜱꜱɪᴏɴ ᴇxᴘɪʀᴇᴅ');
                }
                throw new Error(data.message || `Eʀʀᴏʀ ${response.status}`);
            }
            
            return data;
        }

        // ============================================
        // TOAST
        // ============================================
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.className = 'toast', 3000);
        }

        // ============================================
        // SETTINGS
        // ============================================
        async function loadSettings() {
            try {
                const data = await apiCall('/api/withdraw-settings');
                
                if (data.success && data.settings) {
                    state.settings = data.settings;
                    
                    document.getElementById('withdrawEnabled').checked = state.settings.enabled !== false;
                    
                    // Update display values
                    updateDisplayValues();
                    
                    // Set input values
                    document.getElementById('minWithdraw').value = state.settings.minAmount || '';
                    document.getElementById('maxWithdraw').value = state.settings.maxAmount || '';
                    document.getElementById('withdrawFee').value = state.settings.fee || '';
                    document.getElementById('maxDailyWithdrawals').value = state.settings.maxDailyWithdrawals || '';
                    document.getElementById('maxMonthlyWithdrawals').value = state.settings.maxMonthlyWithdrawals || '';
                    
                    updateSettingsStatus();
                }
            } catch (error) {
                console.error('Lᴏᴀᴅ Sᴇᴛᴛɪɴɢꜱ Eʀʀᴏʀ:', error);
            }
        }

        function updateDisplayValues() {
            const s = state.settings;
            
            const minVal = s.minAmount ? `₹${s.minAmount}` : '—';
            const maxVal = s.maxAmount ? `₹${s.maxAmount}` : '—';
            const feeVal = s.fee ? `${s.fee}%` : '—';
            const dailyVal = s.maxDailyWithdrawals || '—';
            const monthlyVal = s.maxMonthlyWithdrawals || '—';
            
            document.getElementById('displayMinAmount').textContent = minVal;
            document.getElementById('displayMaxAmount').textContent = maxVal;
            document.getElementById('displayFee').textContent = feeVal;
            document.getElementById('displayDailyLimit').textContent = dailyVal;
            document.getElementById('displayMonthlyLimit').textContent = monthlyVal;
        }

        function updateSettingsStatus() {
            const enabled = document.getElementById('withdrawEnabled').checked;
            const statusEl = document.getElementById('settingsStatus');
            if (enabled) {
                statusEl.className = 'status-badge enabled';
                statusEl.innerHTML = '<i class="fas fa-circle"></i> Eɴᴀʙʟᴇᴅ';
            } else {
                statusEl.className = 'status-badge disabled';
                statusEl.innerHTML = '<i class="fas fa-circle"></i> Dɪꜱᴀʙʟᴇᴅ';
            }
        }

        function toggleEditMode() {
            state.editMode = !state.editMode;
            const editFields = document.getElementById('editFields');
            const editBtn = document.getElementById('editBtn');
            
            if (state.editMode) {
                editFields.style.display = 'block';
                editBtn.style.display = 'none';
            } else {
                editFields.style.display = 'none';
                editBtn.style.display = 'block';
                // Reset input values to current settings
                document.getElementById('minWithdraw').value = state.settings.minAmount || '';
                document.getElementById('maxWithdraw').value = state.settings.maxAmount || '';
                document.getElementById('withdrawFee').value = state.settings.fee || '';
                document.getElementById('maxDailyWithdrawals').value = state.settings.maxDailyWithdrawals || '';
                document.getElementById('maxMonthlyWithdrawals').value = state.settings.maxMonthlyWithdrawals || '';
            }
        }

        async function saveSettings() {
            const btn = document.querySelector('.btn-save-settings');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sᴀᴠɪɴɢ...';

            try {
                const minVal = document.getElementById('minWithdraw').value;
                const maxVal = document.getElementById('maxWithdraw').value;
                const feeVal = document.getElementById('withdrawFee').value;
                const dailyVal = document.getElementById('maxDailyWithdrawals').value;
                const monthlyVal = document.getElementById('maxMonthlyWithdrawals').value;

                const settingsData = {
                    enabled: document.getElementById('withdrawEnabled').checked,
                    minAmount: minVal !== '' ? parseFloat(minVal) : 0,
                    maxAmount: maxVal !== '' ? parseFloat(maxVal) : 0,
                    fee: feeVal !== '' ? parseFloat(feeVal) : 0,
                    maxDailyWithdrawals: dailyVal !== '' ? parseInt(dailyVal) : 0,
                    maxMonthlyWithdrawals: monthlyVal !== '' ? parseInt(monthlyVal) : 0
                };

                if (settingsData.minAmount > settingsData.maxAmount && settingsData.maxAmount > 0) {
                    showToast('Mɪɴ Cᴀɴɴᴏᴛ Bᴇ Gʀᴇᴀᴛᴇʀ Tʜᴀɴ Mᴀx.', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-save"></i> Sᴀᴠᴇ Sᴇᴛᴛɪɴɢꜱ';
                    return;
                }

                const data = await apiCall('/api/withdraw-settings', {
                    method: 'PUT',
                    body: JSON.stringify(settingsData)
                });

                if (data.success) {
                    state.settings = data.settings;
                    updateDisplayValues();
                    showToast('Sᴇᴛᴛɪɴɢꜱ Sᴀᴠᴇᴅ!', 'success');
                    updateSettingsStatus();
                    
                    // Exit edit mode
                    state.editMode = false;
                    document.getElementById('editFields').style.display = 'none';
                    document.getElementById('editBtn').style.display = 'block';
                }
            } catch (error) {
                showToast(error.message || 'Sᴀᴠᴇ Fᴀɪʟᴇᴅ', 'error');
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-save"></i> Sᴀᴠᴇ Sᴇᴛᴛɪɴɢꜱ';
        }

        // ============================================
        // FETCH WITHDRAWALS
        // ============================================
        async function fetchWithdrawals() {
            if (!checkAuth()) return;

            const listEl = document.getElementById('withdrawList');
            listEl.innerHTML = `<div class="loading-state"><i class="fas fa-bolt"></i><p>Lᴏᴀᴅɪɴɢ...</p></div>`;

            try {
                let url = `/api/withdraw-settings/withdrawals?page=${state.currentPage}&limit=${state.limit}`;
                if (state.status !== 'all') url += `&status=${state.status}`;
                if (state.method !== 'all') url += `&method=${state.method}`;
                if (state.search) url += `&search=${encodeURIComponent(state.search)}`;

                const data = await apiCall(url);
                
                state.withdrawals = data.withdrawals || [];
                state.total = data.pagination?.total || 0;
                state.totalPages = data.pagination?.totalPages || 1;

                renderWithdrawals();
                renderPagination();
                fetchStats();

            } catch (error) {
                console.error('Fᴇᴛᴄʜ Eʀʀᴏʀ:', error);
                listEl.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Fᴀɪʟᴇᴅ Tᴏ Lᴏᴀᴅ</p>
                        <button onclick="fetchWithdrawals()" style="margin-top:0.5rem;padding:0.3rem 1rem;background:var(--bg-card);border:var(--anodized-border);border-radius:0.5rem;color:var(--accent);cursor:pointer;font-family:'Inter',sans-serif;font-size:0.7rem;">
                            Rᴇᴛʀʏ
                        </button>
                    </div>
                `;
            }
        }

        async function fetchStats() {
            try {
                const data = await apiCall('/api/withdraw-settings/stats');
                const stats = data.stats || {};
                document.getElementById('totalWithdrawals').textContent = stats.total || 0;
                document.getElementById('pendingWithdrawals').textContent = stats.pending || 0;
                document.getElementById('completedWithdrawals').textContent = stats.completed || 0;
                document.getElementById('failedWithdrawals').textContent = stats.failed || 0;
            } catch (error) {
                console.error('Sᴛᴀᴛꜱ Eʀʀᴏʀ:', error);
            }
        }

        // ============================================
        // RENDER WITHDRAWALS
        // ============================================
        function renderWithdrawals() {
            const listEl = document.getElementById('withdrawList');

            if (!state.withdrawals || state.withdrawals.length === 0) {
                listEl.innerHTML = `<div class="empty-state"><i class="fas fa-arrow-up"></i><p>Nᴏ Wɪᴛʜᴅʀᴀᴡᴀʟꜱ Fᴏᴜɴᴅ</p></div>`;
                return;
            }

            let html = '';
            state.withdrawals.forEach(w => {
                const status = w.status || 'pending';
                const method = w.method || 'upi';
                const userName = w.userId?.fullName || 'Unknown User';
                const userMobile = w.userId?.mobile || 'N/A';
                const isPending = status === 'pending' || status === 'processing';
                const time = new Date(w.createdAt).toLocaleString('en-IN', {
                    day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
                });

                const methodLabel = method === 'upi' ? 'UPI' : 'Bank';
                const methodIcon = method === 'upi' ? 'fa-mobile-screen-button' : 'fa-building-columns';
                const methodClass = method === 'upi' ? 'upi' : 'bank';

                let detailsHtml = '';
                if (method === 'upi') {
                    detailsHtml = `<span><i class="fas fa-mobile-screen-button"></i> ${w.upiId || 'N/A'}</span>`;
                } else {
                    detailsHtml = `
                        <span><i class="fas fa-building"></i> ${w.bankName || 'N/A'}</span>
                        <span><i class="fas fa-credit-card"></i> ${w.accountNumber || 'N/A'}</span>
                    `;
                }

                html += `
                    <div class="withdraw-item">
                        <div class="withdraw-header">
                            <div>
                                <div class="withdraw-user">${userName}</div>
                                <div class="withdraw-details">
                                    <span><i class="fas fa-phone"></i> ${userMobile}</span>
                                    <span><i class="fas fa-hashtag"></i> ${w.transactionId || w._id?.slice(-6) || 'N/A'}</span>
                                    <span><i class="fas ${methodIcon}"></i> <span class="withdraw-method ${methodClass}">${methodLabel}</span></span>
                                </div>
                            </div>
                            <div class="withdraw-right">
                                <div class="withdraw-amount">₹${(w.amount || 0).toFixed(2)}</div>
                                <div style="display:flex;align-items:center;gap:0.3rem;justify-content:flex-end;flex-wrap:wrap;">
                                    <span class="withdraw-status ${status}">${status}</span>
                                    <span style="font-size:0.5rem;color:var(--text-muted);">${time}</span>
                                </div>
                            </div>
                        </div>
                        <div class="withdraw-details" style="margin-top:0.2rem;">
                            ${detailsHtml}
                            ${w.ifscCode ? `<span><i class="fas fa-code"></i> ${w.ifscCode}</span>` : ''}
                        </div>
                        ${isPending ? `
                            <div class="withdraw-actions">
                                <button class="btn-approve" onclick="approveWithdraw('${w._id}')">
                                    <i class="fas fa-check"></i> Aᴘᴘʀᴏᴠᴇ
                                </button>
                                <button class="btn-reject" onclick="rejectWithdraw('${w._id}')">
                                    <i class="fas fa-times"></i> Rᴇᴊᴇᴄᴛ
                                </button>
                                <button class="btn-view" onclick="viewWithdraw('${w._id}')">
                                    <i class="fas fa-eye"></i> Vɪᴇᴡ
                                </button>
                            </div>
                        ` : `
                            <div class="withdraw-actions">
                                <button class="btn-view" onclick="viewWithdraw('${w._id}')">
                                    <i class="fas fa-eye"></i> Vɪᴇᴡ
                                </button>
                            </div>
                        `}
                        ${w.adminNote ? `
                            <div class="withdraw-admin-note">
                                <i class="fas fa-sticky-note"></i> ${w.adminNote}
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            listEl.innerHTML = html;
        }

        // ============================================
        // PAGINATION
        // ============================================
        function renderPagination() {
            document.getElementById('pageInfo').textContent = `Pᴀɢᴇ ${state.currentPage} ᴏꜰ ${state.totalPages || 1}`;
            document.getElementById('prevPage').disabled = state.currentPage <= 1;
            document.getElementById('nextPage').disabled = state.currentPage >= state.totalPages;
        }

        function changePage(direction) {
            if (direction === 'prev' && state.currentPage > 1) state.currentPage--;
            else if (direction === 'next' && state.currentPage < state.totalPages) state.currentPage++;
            else return;
            fetchWithdrawals();
        }

        // ============================================
        // FILTERS
        // ============================================
        function applyFilters() {
            state.status = document.getElementById('statusFilter').value;
            state.method = document.getElementById('methodFilter').value;
            state.search = document.getElementById('searchInput').value;
            state.currentPage = 1;
            fetchWithdrawals();
        }

        function refreshData() {
            fetchWithdrawals();
            showToast('Rᴇꜰʀᴇꜱʜᴇᴅ!', 'success');
        }

        // ============================================
        // APPROVE WITHDRAWAL
        // ============================================
        async function approveWithdraw(withdrawalId) {
            if (!confirm('Cᴏɴꜰɪʀᴍ Aᴘᴘʀᴏᴠᴇ?')) return;
            const note = prompt('Eɴᴛᴇʀ Nᴏᴛᴇ (Oᴘᴛɪᴏɴᴀʟ):');

            try {
                const data = await apiCall('/api/withdraw-settings/withdrawal/approve', {
                    method: 'POST',
                    body: JSON.stringify({
                        withdrawalId: withdrawalId,
                        adminNote: note || 'Aᴘᴘʀᴏᴠᴇᴅ Bʏ Aᴅᴍɪɴ'
                    })
                });

                showToast('Aᴘᴘʀᴏᴠᴇᴅ!', 'success');
                fetchWithdrawals();
            } catch (error) {
                showToast(error.message || 'Fᴀɪʟᴇᴅ', 'error');
            }
        }

        // ============================================
        // REJECT WITHDRAWAL
        // ============================================
        async function rejectWithdraw(withdrawalId) {
            if (!confirm('Cᴏɴꜰɪʀᴍ Rᴇᴊᴇᴄᴛ? Aᴍᴏᴜɴᴛ Wɪʟʟ Bᴇ Rᴇꜰᴜɴᴅᴇᴅ.')) return;
            const note = prompt('Eɴᴛᴇʀ Rᴇᴀꜱᴏɴ (Oᴘᴛɪᴏɴᴀʟ):');

            try {
                const data = await apiCall('/api/withdraw-settings/withdrawal/reject', {
                    method: 'POST',
                    body: JSON.stringify({
                        withdrawalId: withdrawalId,
                        adminNote: note || 'Rᴇᴊᴇᴄᴛᴇᴅ Bʏ Aᴅᴍɪɴ'
                    })
                });

                showToast('Rᴇᴊᴇᴄᴛᴇᴅ!', 'success');
                fetchWithdrawals();
            } catch (error) {
                showToast(error.message || 'Fᴀɪʟᴇᴅ', 'error');
            }
        }

        // ============================================
        // VIEW WITHDRAWAL
        // ============================================
        async function viewWithdraw(withdrawalId) {
            try {
                const data = await apiCall(`/api/withdraw-settings/withdrawal/${withdrawalId}`);
                const w = data.withdrawal;

                if (!w) {
                    showToast('Nᴏᴛ Fᴏᴜɴᴅ', 'error');
                    return;
                }

                const modalBody = document.getElementById('modalBody');
                document.getElementById('modalTitle').textContent = `Wɪᴛʜᴅʀᴀᴡᴀʟ #${w.transactionId || w._id.slice(-6)}`;
                document.getElementById('modalActionBtn').style.display = 'none';

                const methodText = w.method === 'upi' ? 'UPI' : 'Bank';
                const detailsHtml = w.method === 'upi' 
                    ? `<div class="detail-row"><span class="label">Uᴘɪ Iᴅ</span><span class="value">${w.upiId || 'N/A'}</span></div>`
                    : `
                        <div class="detail-row"><span class="label">Bᴀɴᴋ</span><span class="value">${w.bankName || 'N/A'}</span></div>
                        <div class="detail-row"><span class="label">Hᴏʟᴅᴇʀ</span><span class="value">${w.accountHolderName || 'N/A'}</span></div>
                        <div class="detail-row"><span class="label">Aᴄᴄᴏᴜɴᴛ</span><span class="value">${w.accountNumber || 'N/A'}</span></div>
                        <div class="detail-row"><span class="label">IFSC</span><span class="value">${w.ifscCode || 'N/A'}</span></div>
                    `;

                modalBody.innerHTML = `
                    <div class="detail-row"><span class="label">Uꜱᴇʀ</span><span class="value">${w.userId?.fullName || 'Unknown'}</span></div>
                    <div class="detail-row"><span class="label">Mᴏʙɪʟᴇ</span><span class="value">${w.userId?.mobile || 'N/A'}</span></div>
                    <div class="detail-row"><span class="label">Aᴍᴏᴜɴᴛ</span><span class="value balance">₹${(w.amount || 0).toFixed(2)}</span></div>
                    <div class="detail-row"><span class="label">Mᴇᴛʜᴏᴅ</span><span class="value">${methodText}</span></div>
                    ${detailsHtml}
                    <div class="detail-row"><span class="label">Sᴛᴀᴛᴜꜱ</span><span class="value"><span class="status-badge ${w.status}">${w.status}</span></span></div>
                    <div class="detail-row"><span class="label">Tʀᴀɴꜱᴀᴄᴛɪᴏɴ</span><span class="value" style="font-size:0.65rem;">${w.transactionId || 'N/A'}</span></div>
                    ${w.adminNote ? `<div class="detail-row"><span class="label">Aᴅᴍɪɴ Nᴏᴛᴇ</span><span class="value" style="font-size:0.65rem;">${w.adminNote}</span></div>` : ''}
                    ${w.userNote ? `<div class="detail-row"><span class="label">Uꜱᴇʀ Nᴏᴛᴇ</span><span class="value" style="font-size:0.65rem;">${w.userNote}</span></div>` : ''}
                    ${w.processedAt ? `<div class="detail-row"><span class="label">Pʀᴏᴄᴇꜱꜱᴇᴅ</span><span class="value">${new Date(w.processedAt).toLocaleString()}</span></div>` : ''}
                    <div class="detail-row"><span class="label">Cʀᴇᴀᴛᴇᴅ</span><span class="value">${new Date(w.createdAt).toLocaleString()}</span></div>
                `;

                document.getElementById('userModal').classList.add('active');

            } catch (error) {
                showToast(error.message || 'Fᴀɪʟᴇᴅ', 'error');
            }
        }

        function closeModal() {
            document.getElementById('userModal').classList.remove('active');
            document.getElementById('modalActionBtn').style.display = 'none';
        }

        document.getElementById('userModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ============================================
        // EXPORT CSV
        // ============================================
        async function exportCSV() {
            try {
                let url = '/api/withdraw-settings/withdrawals/export';
                if (state.status !== 'all') url += `?status=${state.status}`;
                
                const token = getToken();
                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) throw new Error('Exᴘᴏʀᴛ Fᴀɪʟᴇᴅ');
                
                const blob = await response.blob();
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `withdrawals_${Date.now()}.csv`;
                link.click();
                URL.revokeObjectURL(link.href);
                
                showToast('Exᴘᴏʀᴛᴇᴅ!', 'success');
            } catch (error) {
                showToast(error.message || 'Fᴀɪʟᴇᴅ', 'error');
            }
        }

        // ============================================
        // INIT
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('⚡ Aᴅᴍɪɴ Wɪᴛʜᴅʀᴀᴡ Pᴀɢᴇ Lᴏᴀᴅᴇᴅ');
            createElectronParticles();
            
            if (!checkAuth()) return;
            
            Promise.all([
                loadSettings(),
                fetchWithdrawals()
            ]).then(() => {
                console.log('✅ Aʟʟ Dᴀᴛᴀ Lᴏᴀᴅᴇᴅ');
            }).catch((error) => {
                console.error('❌ Eʀʀᴏʀ:', error);
            });
        });
    </script>
</body>
</html>
