<!DOCTYPE html>
<html lang="en">
<head>

<title>Gift Code • Universal Wallet</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Inter', sans-serif; min-height: 100vh; background: linear-gradient(135deg, #ffffff 0%, #e8f0fe 50%, #d4e4f7 100%); color: #1a2a4a; padding-bottom: 85px; position: relative; overflow-x: hidden; }
body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(26, 86, 219, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(26, 86, 219, 0.03) 1px, transparent 1px); background-size: 50px 50px; pointer-events: none; z-index: 0; }
.app-header { backdrop-filter: blur(16px); padding: 12px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 50; background: rgba(255, 255, 255, 0.92); border-bottom: 1px solid #c5d9f0; box-shadow: 0 2px 12px rgba(0, 50, 100, 0.08); max-width: 500px; margin: 0 auto; }
.nav-back { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; background: #f0f7ff; color: #1a56db; border: 2px solid #c5d9f0; }
.nav-back:hover { background: #e2eaf3; }
.nav-back:active { transform: scale(0.95); }
.nav-back i { font-size: 15px; }
.app-header h1 { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px; color: #1a2a4a; text-transform: uppercase; }
.app-header h1 i { color: #d97706; }
.gift-container { max-width: 500px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }
.wallet-card { border-radius: 20px; padding: 16px 22px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: linear-gradient(135deg, #1a56db, #0088ff); box-shadow: 0 8px 25px rgba(26, 86, 219, 0.3); }
.wallet-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 6px; color: rgba(255, 255, 255, 0.9); }
.wallet-label i { font-size: 12px; }
.wallet-amount { font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 4px; color: #ffffff; }
.wallet-amount i { font-size: 16px; }
.form-card { border-radius: 24px; padding: 22px; background: #ffffff; border: 1px solid #c5d9f0; box-shadow: 0 4px 15px rgba(0, 50, 100, 0.08); }
.tabs-container { margin-bottom: 22px; }
.tabs { display: flex; background: #eef3fa; border-radius: 14px; padding: 5px; gap: 5px; border: 1px solid #c5d9f0; }
.tab-btn { flex: 1; padding: 12px 8px; border: none; border-radius: 10px; font-size: 13px; font-weight: 800; cursor: pointer; transition: all 0.3s; background: transparent; color: #5a7a9a; display: flex; align-items: center; justify-content: center; gap: 6px; text-transform: uppercase; letter-spacing: 0.5px; font-family: inherit; }
.tab-btn.active { background: linear-gradient(135deg, #1a56db, #0088ff); color: #ffffff; box-shadow: 0 4px 12px rgba(26, 86, 219, 0.3); }
.tab-btn i { font-size: 14px; }
.tab-btn:active { transform: scale(0.97); }
.tab-panel { display: none; animation: fadeIn 0.3s; }
.tab-panel.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.input-field { margin-bottom: 18px; }
.field-label { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; margin-left: 4px; color: #5a7a9a; }
.field-label i { width: 16px; font-size: 12px; color: #1a56db; }
.input-wrapper input { width: 100%; padding: 14px 18px; border-radius: 14px; font-size: 14px; font-weight: 600; outline: none; transition: all 0.3s; font-family: inherit; background: #fafcff; border: 2px solid #c5d9f0; color: #1a2a4a; }
.input-wrapper input:focus { border-color: #1a56db; background: #ffffff; box-shadow: 0 0 0 4px rgba(26, 86, 219, 0.1); }
.input-wrapper input::placeholder { color: #8a9ab0; font-weight: 500; font-size: 13px; }
#giftCodeInput, #redeemCodeInput { text-transform: none; }
.action-btn { width: 100%; padding: 16px; border: none; border-radius: 16px; font-size: 14px; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: all 0.2s; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; background: linear-gradient(135deg, #1a56db, #0088ff); color: #ffffff; box-shadow: 0 4px 15px rgba(26, 86, 219, 0.3); letter-spacing: 0.5px; }
.action-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.action-btn:active:not(:disabled) { transform: scale(0.98); }

.bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around; padding: 10px 0 16px; z-index: 50; background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(20px); border-top: 1px solid #c5d9f0; max-width: 500px; margin: 0 auto; box-shadow: 0 -4px 20px rgba(0, 50, 100, 0.08); }
.nav-link { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 9px; font-weight: 800; text-transform: uppercase; text-decoration: none; flex: 1; background: none; border: none; cursor: pointer; transition: color 0.3s; color: #8a9ab0; letter-spacing: 0.05em; }

.nav-link i { font-size: 18px; }
.nav-link:active { transform: scale(0.95); }
.nav-link .gift-icon { display: flex; align-items: center; gap: 4px; background: linear-gradient(135deg, #1a56db, #0088ff); color: #ffffff; padding: 3px 12px; border-radius: 40px; font-size: 10px; box-shadow: 0 2px 8px rgba(26, 86, 219, 0.3); }

.spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top-color: #ffffff; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast-notify { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px); padding: 14px 20px; border-radius: 14px; font-size: 12px; font-weight: 800; text-align: center; z-index: 10000; opacity: 0; transition: all 0.3s; pointer-events: none; max-width: 90%; width: max-content; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15); }
.toast-notify.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast-notify.error { background: #fee2e2; color: #dc2626; border-left: 4px solid #dc2626; }
.toast-notify.success { background: #dcfce7; color: #16a34a; border-left: 4px solid #16a34a; }
.toast-notify.info { background: #dbeafe; color: #1a56db; border-left: 4px solid #1a56db; }

.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px); z-index: 999; display: none; align-items: center; justify-content: center; animation: fadeIn 0.3s; }
.modal-overlay.show { display: flex; }
.modal-box { background: #ffffff; border-radius: 24px; padding: 32px 24px; max-width: 400px; width: 90%; text-align: center; position: relative; box-shadow: 0 30px 60px rgba(0, 50, 100, 0.25); border: 1px solid #c5d9f0; animation: slideUp 0.4s; }
@keyframes slideUp { from { opacity: 0; transform: translateY(40px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
.modal-icon { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 36px; }
.modal-icon.success { background: #dcfce7; color: #16a34a; }
.modal-icon.claim { background: #dbeafe; color: #1a56db; }
.modal-title { font-size: 20px; font-weight: 800; margin-bottom: 8px; color: #1a2a4a; text-transform: uppercase; letter-spacing: 0.5px; }
.modal-desc { font-size: 13px; color: #5a7a9a; margin-bottom: 20px; line-height: 1.5; font-weight: 600; }
.modal-code { background: #f0f7ff; padding: 14px; border-radius: 14px; font-size: 18px; font-weight: 800; letter-spacing: 2px; margin-bottom: 8px; color: #1a56db; word-break: break-all; border: 2px dashed #c5d9f0; font-family: monospace; }
.modal-amount { font-size: 24px; font-weight: 800; color: #16a34a; margin: 8px 0 16px; display: flex; align-items: center; justify-content: center; gap: 4px; }
.modal-amount i { font-size: 18px; }
.modal-btn { width: 100%; padding: 14px; border: none; border-radius: 16px; font-size: 13px; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: all 0.2s; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(135deg, #1a56db, #0088ff); color: #ffffff; box-shadow: 0 4px 15px rgba(26, 86, 219, 0.3); }
.modal-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(26, 86, 219, 0.4); }
.modal-btn:active { transform: scale(0.97); }
.modal-emoji { font-size: 40px; margin: 12px 0; }
.modal-divider { width: 60px; height: 3px; border-radius: 99px; margin: 12px auto; background: linear-gradient(90deg, #1a56db, #0088ff); }

/* ============================================
   BLOCKED / DELETED / DEACTIVATED OVERLAY
   ============================================ */
.blocked-overlay { position: fixed; inset: 0; z-index: 99999; background: linear-gradient(135deg, #ffffff 0%, #e8f0fe 50%, #d4e4f7 100%); display: none; align-items: center; justify-content: center; padding: 20px; }
.blocked-overlay.active { display: flex; }
.blocked-card { background: #ffffff; border-radius: 24px; padding: 40px 30px; max-width: 420px; width: 100%; text-align: center; border: 1px solid #c5d9f0; box-shadow: 0 20px 60px rgba(0, 50, 100, 0.2); animation: blockedIn 0.4s ease-out; }
@keyframes blockedIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
.blocked-icon { width: 90px; height: 90px; border-radius: 24px; background: #fee2e2; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 42px; color: #dc2626; border: 2px solid #fca5a5; }
.blocked-title { font-size: 24px; font-weight: 900; color: #1a3a6b; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
.blocked-sub { font-size: 14px; color: #5a7a9a; line-height: 1.6; margin-bottom: 24px; font-weight: 500; }
.blocked-btn { width: 100%; padding: 15px; border-radius: 16px; font-size: 14px; font-weight: 800; border: none; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; font-family: 'Inter', sans-serif; transition: all 0.2s; background: #1a56db; color: #ffffff; box-shadow: 0 4px 15px rgba(26, 86, 219, 0.3); display: flex; align-items: center; justify-content: center; gap: 8px; }
.blocked-btn:hover { background: #1a4ac0; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(26, 86, 219, 0.4); }
.blocked-btn:active { transform: scale(0.98); }

@media (max-width: 480px) {
    .gift-container { padding: 14px; }
    .form-card { padding: 18px; }
    .tab-btn { padding: 10px 6px; font-size: 11px; }
    .wallet-amount { font-size: 18px; }
    .app-header h1 { font-size: 15px; }
}
</style>
</head>
<body>

<!-- ============================================
     BLOCKED OVERLAY
     ============================================ -->
<div class="blocked-overlay" id="blockedOverlay">
    <div class="blocked-card">
        <div class="blocked-icon"><i class="fas fa-user-slash"></i></div>
        <div class="blocked-title" id="blockedTitle">Access Denied</div>
        <div class="blocked-sub" id="blockedSub">Your account has been blocked or deleted. Please contact support.</div>
        <button class="blocked-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Back To Login</button>
    </div>
</div>

<!-- HEADER -->
<header class="app-header">
    <button class="nav-back" onclick="goBackToDashboard()">
        <i class="fa-solid fa-arrow-left"></i>
    </button>
    <h1><i class="fa-solid fa-gift"></i> Gift Code</h1>
</header>

<div class="gift-container">
    <!-- WALLET CARD -->
    <div class="wallet-card">
        <span class="wallet-label">
            <i class="fa-solid fa-coins"></i> Your Balance
        </span>
        <span class="wallet-amount">
            <i class="fa-solid fa-indian-rupee-sign"></i><span id="userBalance">0.00</span>
        </span>
    </div>

    <!-- FORM CARD -->
    <div class="form-card">
        <!-- TABS -->
        <div class="tabs-container">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('create')">
                    <i class="fa-solid fa-plus-circle"></i> Create
                </button>
                <button class="tab-btn" onclick="switchTab('claim')">
                    <i class="fa-solid fa-gift"></i> Claim

        <!-- TAB: CREATE -->
        <div id="tabCreate" class="tab-panel active">
            <div class="input-field">
                <label class="field-label"><i class="fa-solid fa-tag"></i> Gift Code</label>
                <div class="input-wrapper">
                    <input type="text" id="giftCodeInput" placeholder="Enter Custom Code (1-50 Characters)" maxlength="50">
                </div>
            </div>
            <div class="input-field">
                <label class="field-label"><i class="fa-solid fa-users"></i> Number Of Users</label>
                <div class="input-wrapper">
                    <input type="number" id="numberOfUsers" placeholder="Enter Number Of Users" min="1">
                </div>
            </div>
            <div class="input-field">
                <label class="field-label"><i class="fa-solid fa-indian-rupee-sign"></i> Amount Per User</label>
                <div class="input-wrapper">
                    <input type="number" id="amountPerUser" placeholder="Enter Amount Per User" min="0.01" step="0.01">
                </div>

            <div class="input-field">

                <div class="input-wrapper">
                    <input type="text" id="commentInput" placeholder="Add A Note (Optional)">
                </div>
            </div>

                <i class="fa-solid fa-qrcode"></i> Generate Code
            </button>
        </div>

        <!-- TAB: CLAIM -->
        <div id="tabClaim" class="tab-panel">
            <div class="input-field">
                <label class="field-label"><i class="fa-solid fa-gift"></i> Redeem Gift Code</label>
                <div class="input-wrapper">
                    <input type="text" id="redeemCodeInput" placeholder="Enter Gift Code (1-50 Characters)" maxlength="50">
                </div>
            </div>
            <button class="action-btn redeem-btn" id="redeemBtn" onclick="redeemGiftCode()">
                <i class="fa-solid fa-check-circle"></i> Redeem Code
            </button>
        </div>
    </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-bar">
    <a href="/dashboard" class="nav-link"><i class="fa-solid fa-house"></i><span>Home</span></a>
    <a href="/transfer" class="nav-link"><i class="fa-solid fa-paper-plane"></i><span>Send</span></a>
    <a href="/qr" class="nav-link"><i class="fa-solid fa-qrcode"></i><span>QR</span></a>
    <a href="/deposit" class="nav-link"><i class="fa-solid fa-plus-circle"></i><span>Add</span></a>
    <a href="/gift" class="nav-link active">
        <div class="gift-icon"><i class="fa-solid fa-gift"></i> Gift</div>
        <span>Gift</span>
    </a>
</div>

<!-- SUCCESS MODAL -->
<div class="modal-overlay" id="successModal">
    <div class="modal-box">
        <div class="modal-icon" id="modalIcon"><i class="fa-solid fa-circle-check"></i></div>
        <div class="modal-title" id="modalTitle">Gift Code Created Successfully!</div>
        <div class="modal-desc" id="modalDesc">Your Gift Code Has Been Created Successfully And Is Ready To Use.</div>
        <div class="modal-code" id="modalCode">UNIVERSALGIFT25</div>
        <div class="modal-amount" id="modalAmount"><i class="fa-solid fa-indian-rupee-sign"></i>100.00</div>
        <div class="modal-divider"></div>
        <div class="modal-emoji"><i class="fa-solid fa-face-smile"></i></div>
        <button class="modal-btn" onclick="closeModal()"><i class="fa-solid fa-check"></i> Awesome!</button>
    </div>
</div>

<script>
// ============================================
// GIFT CODE - UNIVERSAL WALLET
// ============================================

const API_BASE_URL = '/api/gift';
const AUTH_TOKEN = localStorage.getItem('token');

if (!AUTH_TOKEN) {
    window.location.href = '/';
}

// ============================================
// ACCOUNT STATE PROTECTION
// ============================================
let isAccountBlocked = false;

function showBlockedOverlay(title, message) {
    if (isAccountBlocked) return;
    isAccountBlocked = true;
    if (title) document.getElementById('blockedTitle').textContent = title;
    if (message) document.getElementById('blockedSub').textContent = message;
    document.getElementById('blockedOverlay').classList.add('active');
}

function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    localStorage.removeItem('pin_set');
    localStorage.removeItem('pin_verified');
    window.location.href = '/';
}

// ============================================
// SAFE FETCH — Handles blocked/deleted/deactivated
// ============================================
async function safeFetch(url, options = {}) {
    try {
        const response = await fetch(url, options);
        let data = {};
        try { data = await response.json(); } catch (e) { data = {}; }

        // 401 — Token invalid/expired
        if (response.status === 401) {
            logout();
            throw new Error('Session expired');
        }

        // 403 — Account blocked/deactivated
        if (response.status === 403) {
            showBlockedOverlay(
                'Access Denied',
                data.message || 'Your account has been blocked. Please contact support.'
            );
            throw new Error('Account blocked');
        }

        // 404 — User deleted
        if (response.status === 404 && data.userNotFound) {
            showBlockedOverlay(
                'Account Not Found',
                'Your account has been deleted. Please contact support.'
            );
            throw new Error('Account deleted');
        }

        return { response, data };
    } catch (error) {
        if (!isAccountBlocked) throw error;
        return { response: null, data: {} };
    }
}

// ============================================
// VERIFY USER STATE
// ============================================
async function verifyUserState() {
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = '/';
        return false;
    }

    try {
        const res = await fetch('/api/auth/me', {
            headers: {
                'Authorization': 'Bearer ' + token,
                'Content-Type': 'application/json'
            }
        });

        let data = {};
        try { data = await res.json(); } catch (e) { data = {}; }

        // 401 — Token invalid
        if (res.status === 401) {
            logout();
            return false;
        }

        // 403 — Blocked
        if (res.status === 403) {
            showBlockedOverlay(
                'Account Blocked',
                data.message || 'Your account has been blocked by administrator. Please contact support.'
            );
            return false;
        }

        // 404 — User deleted
        if (res.status === 404) {
            showBlockedOverlay(
                'Account Not Found',
                'Your account has been deleted. Please contact support.'
            );
            return false;
        }

        // Check user data
        const user = data.user || data.data || data;

        if (!user || (!user.id && !user._id)) {
            showBlockedOverlay(
                'Invalid Account',
                'Your account data could not be found. Please login again or contact support.'
            );
            return false;
        }

        // isBlocked check
        if (user.isBlocked === true) {
            showBlockedOverlay(
                'Account Blocked',
                'Your account has been blocked by administrator. Please contact support.'
            );
            return false;
        }

        // isDeleted check
        if (user.isDeleted === true || user.deletedAt) {
            showBlockedOverlay(
                'Account Deleted',
                'Your account has been deleted. Please contact support.'
            );
            return false;
        }

        // isActive check
        if (user.isActive === false) {
            showBlockedOverlay(
                'Account Deactivated',
                'Your account has been deactivated. Please contact support.'
            );
            return false;
        }

        return true;
    } catch (error) {
        console.error('User state check error:', error);
        return true;
    }
}

// ============================================
// TOAST NOTIFICATION
// ============================================
function showToast(message, type = 'info') {
    let toast = document.getElementById('globalToast');
    if (!toast) {
        toast = document.createElement('div');
        toast.id = 'globalToast';
        toast.className = 'toast-notify';
        document.body.appendChild(toast);
    }
    const icon = type === 'success' ? '<i class="fa-solid fa-circle-check"></i> ' :
        type === 'error' ? '<i class="fa-solid fa-circle-xmark"></i> ' :
        '<i class="fa-solid fa-circle-info"></i> ';
    toast.innerHTML = icon + message;
    toast.className = 'toast-notify ' + type + ' show';
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove('show'), 4000);
}

// ============================================
// MODAL
// ============================================
function showModal(type, code, amount) {
    const m = document.getElementById('successModal');
    const ic = document.getElementById('modalIcon');
    const t = document.getElementById('modalTitle');
    const d = document.getElementById('modalDesc');
    const c = document.getElementById('modalCode');
    const a = document.getElementById('modalAmount');
    const e = document.querySelector('.modal-emoji');
    const b = document.querySelector('.modal-btn');

    if (type === 'create') {
        ic.className = 'modal-icon success';
        ic.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
        t.textContent = 'Gift Code Created Successfully!';
        d.textContent = 'Your Gift Code Has Been Created Successfully And Is Ready To Use.';
        e.innerHTML = '<i class="fa-solid fa-face-smile"></i>';
        b.innerHTML = '<i class="fa-solid fa-check"></i> Awesome!';
    } else {
        ic.className = 'modal-icon claim';
        ic.innerHTML = '<i class="fa-solid fa-gift"></i>';
        t.textContent = 'Gift Code Claimed Successfully!';
        d.textContent = 'You Have Successfully Claimed The Gift Code And The Amount Has Been Added To Your Wallet.';
        e.innerHTML = '<i class="fa-solid fa-face-grin-stars"></i>';
        b.innerHTML = '<i class="fa-solid fa-check"></i> Great!';
    }
    c.textContent = code || 'UNIVERSALGIFT25';
    a.innerHTML = '<i class="fa-solid fa-indian-rupee-sign"></i>' + parseFloat(amount || 0).toFixed(2);
    m.classList.add('show');
    document.body.style.overflow = 'hidden';
}

function closeModal() {
    document.getElementById('successModal').classList.remove('show');
    document.body.style.overflow = 'auto';
}

document.getElementById('successModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

// ============================================
// TAB SWITCHING
// ============================================
function switchTab(tab) {
    const tc = document.getElementById('tabCreate');
    const tl = document.getElementById('tabClaim');
    const bc = document.querySelector('.tab-btn:first-child');
    const bl = document.querySelector('.tab-btn:last-child');

    if (tab === 'create') {
        tc.classList.add('active');
        tl.classList.remove('active');
        bc.classList.add('active');
        bl.classList.remove('active');
    } else {
        tc.classList.remove('active');
        tl.classList.add('active');
        bc.classList.remove('active');
        bl.classList.add('active');
    }
}

// ============================================
// BALANCE
// ============================================
async function refreshWalletBalance() {
    try {
        const { response, data } = await safeFetch(API_BASE_URL + '/balance', {
            headers: {
                'Authorization': 'Bearer ' + AUTH_TOKEN,
                'Content-Type': 'application/json'
            }
        });

        if (isAccountBlocked) return;

        if (response && response.ok && data.status === 'success') {
            document.getElementById('userBalance').textContent = parseFloat(data.balance).toFixed(2);
        }
    } catch (error) {
        if (!isAccountBlocked) console.error('Balance fetch error:', error);
    }
}

// ============================================
// CREATE GIFT CODE
// ============================================
async function createGiftCode() {
    if (isAccountBlocked) return;

    const btn = document.getElementById('generateBtn');
    const code = document.getElementById('giftCodeInput').value.trim();
    const users = parseInt(document.getElementById('numberOfUsers').value) || 0;
    const amt = parseFloat(document.getElementById('amountPerUser').value) || 0;
    const cmt = document.getElementById('commentInput').value.trim() || 'Gift Code';

    if (!code) {
        showToast('Please Enter A Gift Code', 'error');
        document.getElementById('giftCodeInput').focus();
        return;
    }
    if (code.length < 1 || code.length > 50) {
        showToast('Code Must Be 1-50 Characters', 'error');
        document.getElementById('giftCodeInput').focus();
        return;
    }
    if (amt <= 0) {
        showToast('Amount Must Be Greater Than 0', 'error');
        document.getElementById('amountPerUser').focus();
        return;
    }
    if (users < 1) {
        showToast('Minimum 1 User Required', 'error');
        document.getElementById('numberOfUsers').focus();
        return;
    }

    const total = amt * users;
    const bal = parseFloat(document.getElementById('userBalance').textContent);
    if (total > bal) {
        showToast('Insufficient Balance! Need ₹' + total.toFixed(2) + ', Have ₹' + bal.toFixed(2), 'error');
        return;
    }

    try {
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div> Processing...';

        const { response, data } = await safeFetch(API_BASE_URL + '/create', {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + AUTH_TOKEN,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                amount: amt,
                note: cmt,
                giftCode: code,
                numberOfUsers: users
            })
        });

        if (isAccountBlocked) return;

        if (data.success) {
            showModal('create', data.giftCode, data.totalAmount || data.amount * users);
            document.getElementById('giftCodeInput').value = '';
            document.getElementById('numberOfUsers').value = '';
            document.getElementById('amountPerUser').value = '';
            document.getElementById('commentInput').value = '';
            await refreshWalletBalance();
        } else {
            showToast(data.message, 'error');
        }
    } catch (e) {
        if (!isAccountBlocked) {
            showToast('Failed To Create Gift Code. Please Try Again.', 'error');
        }
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-qrcode"></i> Generate Code';
    }
}

// ============================================
// REDEEM GIFT CODE
// ============================================
async function redeemGiftCode() {
    if (isAccountBlocked) return;

    const btn = document.getElementById('redeemBtn');
    const code = document.getElementById('redeemCodeInput').value.trim();

    if (!code) {
        showToast('Please Enter A Gift Code', 'error');
        document.getElementById('redeemCodeInput').focus();
        return;
    }
    if (code.length < 1 || code.length > 50) {
        showToast('Code Must Be 1-50 Characters', 'error');
        document.getElementById('redeemCodeInput').focus();
        return;
    }

    try {
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div> Redeeming...';

        const { response, data } = await safeFetch(API_BASE_URL + '/redeem', {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + AUTH_TOKEN,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ giftCode: code })
        });

        if (isAccountBlocked) return;

        if (data.success) {
            showModal('claim', code, data.amount);
            document.getElementById('redeemCodeInput').value = '';
            await refreshWalletBalance();
        } else {
            showToast(data.message, 'error');
        }
    } catch (e) {
        if (!isAccountBlocked) {
            showToast('Failed To Redeem Gift Code. Please Try Again.', 'error');
        }
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-check-circle"></i> Redeem Code';
    }
}

// ============================================
// NAVIGATION
// ============================================
function goBackToDashboard() {
    window.location.href = '/dashboard';
}

// ============================================
// KEYBOARD SHORTCUTS
// ============================================
document.addEventListener('keydown', function(e) {
    if (isAccountBlocked) return;
    if (e.key === 'Enter' && document.getElementById('tabCreate').classList.contains('active')) {
        const el = document.activeElement;
        if (el && el.tagName === 'INPUT') createGiftCode();
    }
    if (e.key === 'Enter' && document.getElementById('tabClaim').classList.contains('active')) {
        if (document.activeElement && document.activeElement.id === 'redeemCodeInput') redeemGiftCode();
    }
    if (e.key === 'Escape') closeModal();
});

// ============================================
// INITIALIZATION
// ============================================
document.addEventListener('DOMContentLoaded', async function() {
    const isUserValid = await verifyUserState();
    if (!isUserValid) return;

    await refreshWalletBalance();

    console.log('Gift Code System Loaded Successfully');
    console.log('Create/Claim: Space, Emoji, Symbol Allowed (1-50 Characters)');
});
