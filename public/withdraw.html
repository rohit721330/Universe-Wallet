<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Withdraw • Universal Wallet</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #ffffff 0%, #e8f0fe 50%, #d4e4f7 100%);
    color: #1a2a4a;
    padding-bottom: 85px;
    overflow-x: hidden;
    position: relative;
}

body::before {
    content: "";
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-image: 
        linear-gradient(rgba(26, 86, 219, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(26, 86, 219, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
    z-index: 0;
}

.container { max-width: 500px; margin: 0 auto; position: relative; min-height: 100vh; z-index: 1; }
.wrapper { width: 100%; padding: 40px 20px 80px 20px; position: relative; z-index: 2; }

.page-title {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 20px;
    text-align: center;
    margin-top: 10px;
    color: #1a56db;
    letter-spacing: 0.5px;
}

.card {
    border-radius: 24px;
    overflow: hidden;
    padding: 24px;
    margin-bottom: 20px;
    background: #ffffff;
    border: 1px solid #c5d9f0;
    box-shadow: 0 4px 15px rgba(0, 50, 100, 0.08);
}

.card-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 12px;
    color: #1a56db;
}
.card-title i { margin-right: 6px; }

.balance-display {
    text-align: center;
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 0;
    background: linear-gradient(135deg, #1a56db, #0088ff);
    color: #ffffff;
    box-shadow: 0 6px 20px rgba(26, 86, 219, 0.25);
}
.balance-display .label {
    font-size: 11px;
    font-weight: 700;
    opacity: 0.9;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #ffffff;
}
.balance-display .amount {
    font-size: 28px;
    font-weight: 800;
    color: #ffffff;
    margin-top: 4px;
}

.input-group { margin-bottom: 16px; }
.input-group label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    color: #5a7a9a;
}
.input-group label i { margin-right: 4px; color: #1a56db; }

.input-group input, .input-group select {
    width: 100%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 500;
    outline: none;
    font-family: 'Inter', sans-serif;
    transition: all 0.3s ease;
    background: #fafcff;
    border: 2px solid #c5d9f0;
    color: #1a2a4a;
}
.input-group input::placeholder { color: #8a9ab0; }
.input-group input:focus, .input-group select:focus {
    border-color: #1a56db;
    box-shadow: 0 0 0 4px rgba(26, 86, 219, 0.1);
    background: #ffffff;
}

.method-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
}
.method-tab {
    flex: 1;
    padding: 12px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    text-align: center;
    transition: all 0.3s ease;
    background: #f0f7ff;
    border: 2px solid #c5d9f0;
    color: #5a7a9a;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.method-tab.active {
    background: linear-gradient(135deg, #1a56db, #0088ff);
    border-color: transparent;
    color: #ffffff;
    box-shadow: 0 4px 12px rgba(26, 86, 219, 0.3);
}
.method-tab:active { transform: scale(0.97); }
.method-tab i { margin-right: 6px; }

.fee-display {
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    background: #ede9fe;
    border: 1px solid #ddd6fe;
}
.fee-display .label {
    font-weight: 700;
    color: #5a7a9a;
}
.fee-display .value {
    font-weight: 800;
    color: #8b5cf6;
}

.total-display {
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 700;
    background: #dcfce7;
    border: 1px solid #86efac;
}
.total-display .label {
    font-weight: 700;
    color: #5a7a9a;
}
.total-display .value {
    font-weight: 800;
    color: #16a34a;
}

.btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 800;
    text-transform: uppercase;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.2s;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }

.btn-primary {
    background: linear-gradient(135deg, #1a56db, #0088ff);
    color: #ffffff;
    box-shadow: 0 4px 15px rgba(26, 86, 219, 0.3);
}
.btn-primary:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(26, 86, 219, 0.4);
}

.toast-message {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 24px;
    border-radius: 60px;
    font-size: 13px;
    font-weight: 700;
    z-index: 10000;
    animation: fadeInUp 0.3s ease;
    max-width: 90%;
    text-align: center;
    background: #1a56db;
    color: #ffffff;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
}
.toast-message.error { background: #dc2626 !important; color: #ffffff !important; }
.toast-message.success { background: #16a34a !important; color: #ffffff !important; }
@keyframes fadeInUp {
    from { opacity: 0; transform: translateX(-50%) translateY(20px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

.spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    border-top-color: white;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-around;
    padding: 10px 0 20px;
    z-index: 50;
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(20px);
    border-top: 1px solid #c5d9f0;
    max-width: 500px;
    margin: 0 auto;
    box-shadow: 0 -4px 20px rgba(0, 50, 100, 0.08);
}

.nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    cursor: pointer;
    text-decoration: none;
    flex: 1;
    color: #8a9ab0;
    transition: color 0.2s;
    letter-spacing: 0.3px;
}
.nav-item i { font-size: 20px; }
.nav-item.active { color: #1a56db; }
.nav-item:active { transform: scale(0.95); }

.limit-info {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    margin-top: 4px;
    color: #8a9ab0;
    font-weight: 600;
}

.settings-status {
    text-align: center;
    font-size: 12px;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 16px;
    font-weight: 700;
    letter-spacing: 0.3px;
}
.settings-status.enabled {
    color: #16a34a;
    background: #dcfce7;
    border: 1px solid #86efac;
}
.settings-status.disabled {
    color: #dc2626;
    background: #fee2e2;
    border: 1px solid #fecaca;
}
.settings-status i {
    margin-right: 6px;
}

@media (max-width: 480px) {
    .wrapper { padding: 30px 16px 80px; }
    .page-title { font-size: 24px; }
    .card { padding: 18px; }
    .balance-display .amount { font-size: 24px; }
    .method-tab { font-size: 11px; padding: 10px 8px; }
}
</style>
</head>
<body>

<div class="container">
    <div class="wrapper">
        
        <h1 class="page-title"><i class="fa-solid fa-arrow-up"></i> Withdraw</h1>
        
        <div class="card">
            <div class="balance-display">
                <div class="label"><i class="fa-solid fa-wallet"></i> Available Balance</div>
                <div class="amount">₹<span id="balance">0.00</span></div>
            </div>
        </div>

        <div class="card">
            <div class="card-title"><i class="fa-solid fa-circle-info"></i> Withdraw Details</div>
            
            <!-- Settings Status -->
            <div id="settingsStatus" class="settings-status enabled">
                <i class="fa-solid fa-circle-check"></i> Withdraw Is Enabled
            </div>
            
            <div class="method-tabs">
                <button class="method-tab active" onclick="switchMethod('upi')">
                    <i class="fa-solid fa-mobile-screen-button"></i> UPI
                </button>
                <button class="method-tab" onclick="switchMethod('bank')">
                    <i class="fa-solid fa-building-columns"></i> Bank
                </button>
            </div>

            <!-- UPI Method -->
            <div id="upiMethod">
                <div class="input-group">
                    <label><i class="fa-solid fa-mobile-screen-button"></i> UPI ID *</label>
                    <input type="text" id="upiId" placeholder="Enter UPI ID (e.g. name@upi)">
                </div>
            </div>

            <!-- Bank Method -->
            <div id="bankMethod" style="display: none;">
                <div class="input-group">
                    <label><i class="fa-solid fa-building"></i> Bank Name *</label>
                    <input type="text" id="bankName" placeholder="Enter Bank Name">
                </div>
                
                <div class="input-group">
                    <label><i class="fa-solid fa-user"></i> Account Holder Name *</label>
                    <input type="text" id="accountHolderName" placeholder="Enter Holder Name">
                </div>
                
                <div class="input-group">
                    <label><i class="fa-solid fa-credit-card"></i> Account Number *</label>
                    <input type="text" id="accountNumber" placeholder="Enter Account Number">
                </div>
                
                <div class="input-group">
                    <label><i class="fa-solid fa-code"></i> IFSC Code *</label>
                    <input type="text" id="ifscCode" placeholder="Enter IFSC Code">
                </div>
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-indian-rupee-sign"></i> Amount (₹) *</label>
                <input type="number" id="amount" placeholder="Enter amount to withdraw" step="1" min="1">
                <div class="limit-info">
                    <span>Min: ₹<span id="minLimit">0</span></span>
                    <span>Max: ₹<span id="maxLimit">0</span></span>
                </div>
            </div>

            <!-- Fee Display -->
            <div class="fee-display" id="feeDisplay">
                <span class="label"><i class="fa-solid fa-percent"></i> Withdraw Fee</span>
                <span class="value" id="feeValue">₹0.00 (No Fee)</span>
            </div>

            <!-- Total Display -->
            <div class="total-display" id="totalDisplay">
                <span class="label"><i class="fa-solid fa-hand-holding-dollar"></i> You Will Receive</span>
                <span class="value" id="totalValue">₹0.00</span>
            </div>

            <button class="btn btn-primary" id="withdrawBtn" onclick="submitWithdraw()">
                <i class="fa-solid fa-arrow-up"></i> Submit Withdraw
            </button>
        </div>
    </div>
</div>

<div class="bottom-nav">
    <a href="/dashboard" class="nav-item"><i class="fa-solid fa-house"></i>Home</a>
    <a href="/transfer" class="nav-item"><i class="fa-solid fa-paper-plane"></i>Send</a>
    <a href="/qr" class="nav-item"><i class="fa-solid fa-qrcode"></i>QR</a>
    <a href="/deposit" class="nav-item"><i class="fa-solid fa-plus-circle"></i>Add</a>
    <a href="/transactions" class="nav-item"><i class="fa-solid fa-receipt"></i>Logs</a>
</div>

<script>
// ============================================
// CONFIGURATION
// ============================================
let currentMethod = 'upi';
let settings = {
    minAmount: 1,
    maxAmount: 5000,
    enabled: true,
    fee: 0,
    feeType: 'percentage',
    maxDailyWithdrawals: 10,
    maxMonthlyWithdrawals: 50,
    requireBankDetails: true,
    requireUpiDetails: true,
    autoApproveBelow: 0,
    approvalRequired: true
};

// ============================================
// TOAST
// ============================================
function showToast(message, type = '') {
    const toast = document.createElement('div');
    toast.className = 'toast-message';
    if (type) toast.classList.add(type);
    toast.innerHTML = message;
    document.body.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(-50%) translateY(20px)';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

// ============================================
// METHOD SWITCHING
// ============================================
function switchMethod(method) {
    currentMethod = method;
    const tabs = document.querySelectorAll('.method-tab');
    tabs.forEach(tab => tab.classList.remove('active'));
    
    if (method === 'upi') {
        tabs[0].classList.add('active');
        document.getElementById('upiMethod').style.display = 'block';
        document.getElementById('bankMethod').style.display = 'none';
    } else {
        tabs[1].classList.add('active');
        document.getElementById('upiMethod').style.display = 'none';
        document.getElementById('bankMethod').style.display = 'block';
    }
}

// ============================================
// UPDATE FEE DISPLAY
// ============================================
function updateFeeDisplay() {
    const amountInput = document.getElementById('amount');
    const amount = parseFloat(amountInput.value) || 0;
    
    const feeRate = settings.fee || 0;
    const feeType = settings.feeType || 'percentage';
    
    let feeAmount = 0;
    let feeText = '';
    
    if (feeRate > 0) {
        if (feeType === 'percentage') {
            feeAmount = (amount * feeRate) / 100;
            feeText = `${feeRate}% (₹${feeAmount.toFixed(2)})`;
        } else if (feeType === 'fixed') {
            feeAmount = feeRate;
            feeText = `₹${feeRate.toFixed(2)} (Fixed)`;
        }
    } else {
        feeText = '₹0.00 (No Fee)';
    }
    
    const userReceives = Math.round((amount - feeAmount) * 100) / 100;
    
    document.getElementById('feeValue').textContent = feeText;
    
    const totalEl = document.getElementById('totalValue');
    if (amount > 0) {
        totalEl.textContent = `₹${userReceives.toFixed(2)}`;
        if (userReceives > 0) {
            totalEl.style.color = '#16a34a';
        } else if (userReceives === 0) {
            totalEl.style.color = '#d97706';
        } else {
            totalEl.style.color = '#dc2626';
        }
    } else {
        totalEl.textContent = '₹0.00';
        totalEl.style.color = '';
    }
}

// ============================================
// LOAD SETTINGS
// ============================================
async function loadSettings() {
    try {
        const response = await fetch('/api/withdraw-settings/');
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        const data = await response.json();
        
        if (data.success && data.settings) {
            settings = {
                minAmount: data.settings.minAmount || 1,
                maxAmount: data.settings.maxAmount || 5000,
                enabled: data.settings.enabled !== undefined ? data.settings.enabled : true,
                fee: data.settings.fee || 0,
                feeType: data.settings.feeType || 'percentage',
                maxDailyWithdrawals: data.settings.maxDailyWithdrawals || 10,
                maxMonthlyWithdrawals: data.settings.maxMonthlyWithdrawals || 50,
                requireBankDetails: data.settings.requireBankDetails !== undefined ? data.settings.requireBankDetails : true,
                requireUpiDetails: data.settings.requireUpiDetails !== undefined ? data.settings.requireUpiDetails : true,
                autoApproveBelow: data.settings.autoApproveBelow || 0,
                approvalRequired: data.settings.approvalRequired !== undefined ? data.settings.approvalRequired : true
            };
            
            updateSettingsUI();
            updateFeeDisplay();
        } else {
            useDefaultSettings();
            showToast('Using Default Settings', 'error');
        }
    } catch (error) {
        console.error('Load Settings Error:', error.message);
        useDefaultSettings();
        showToast('Connection Error - Using Defaults', 'error');
    }
}

// ============================================
// USE DEFAULT SETTINGS
// ============================================
function useDefaultSettings() {
    settings = {
        minAmount: 1,
        maxAmount: 5000,
        enabled: true,
        fee: 0,
        feeType: 'percentage',
        maxDailyWithdrawals: 10,
        maxMonthlyWithdrawals: 50,
        requireBankDetails: true,
        requireUpiDetails: true,
        autoApproveBelow: 0,
        approvalRequired: true
    };
    updateSettingsUI();
    updateFeeDisplay();
}

// ============================================
// UPDATE SETTINGS UI
// ============================================
function updateSettingsUI() {
    const minLimit = document.getElementById('minLimit');
    const maxLimit = document.getElementById('maxLimit');
    const amountInput = document.getElementById('amount');
    const statusEl = document.getElementById('settingsStatus');
    const btn = document.getElementById('withdrawBtn');
    
    if (minLimit) minLimit.textContent = settings.minAmount || 0;
    if (maxLimit) maxLimit.textContent = settings.maxAmount || 0;
    
    if (amountInput) {
        amountInput.min = settings.minAmount || 0;
        amountInput.max = settings.maxAmount || 0;
    }
    
    if (statusEl && btn) {
        const isEnabled = settings.enabled !== undefined ? settings.enabled : true;
        
        if (isEnabled) {
            statusEl.className = 'settings-status enabled';
            statusEl.innerHTML = '<i class="fa-solid fa-circle-check"></i> Withdraw Is Enabled';
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-arrow-up"></i> Submit Withdraw';
        } else {
            statusEl.className = 'settings-status disabled';
            statusEl.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Withdraw Is Currently Disabled';
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-ban"></i> Withdraw Disabled';
        }
    }
}

// ============================================
// LOAD USER DATA
// ============================================
async function loadUserData() {
    try {
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/';
            return;
        }

        const response = await fetch('/api/auth/me', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        
        if (!response.ok) {
            if (response.status === 401) {
                localStorage.removeItem('token');
                window.location.href = '/';
                return;
            }
            throw new Error('Failed To Fetch User Data');
        }
        
        const data = await response.json();
        if (data.success && data.user) {
            document.getElementById('balance').textContent = data.user.balance.toFixed(2);
        }
    } catch (error) {
        console.error('Load Error:', error);
        showToast(error.message, 'error');
    }
}

// ============================================
// SUBMIT WITHDRAW
// ============================================
async function submitWithdraw() {
    const token = localStorage.getItem('token');
    if (!token) {
        showToast('Please Login First', 'error');
        return;
    }

    if (!settings.enabled) {
        showToast('Withdraw Is Currently Disabled', 'error');
        return;
    }

    const amountInput = document.getElementById('amount');
    const amount = parseFloat(amountInput.value);

    if (!amount || amount <= 0) {
        showToast('Please Enter A Valid Amount', 'error');
        return;
    }

    const currentBalance = parseFloat(document.getElementById('balance').textContent);

    if (amount < settings.minAmount) {
        showToast(`Minimum Amount Is ₹${settings.minAmount}`, 'error');
        return;
    }

    if (amount > settings.maxAmount) {
        showToast(`Maximum Amount Is ₹${settings.maxAmount}`, 'error');
        return;
    }

    const feeAmount = settings.fee > 0 ? 
        (settings.feeType === 'percentage' ? (amount * settings.fee) / 100 : settings.fee) : 0;
    const userReceives = Math.round((amount - feeAmount) * 100) / 100;

    if (amount > currentBalance) {
        showToast(`Insufficient Balance. Required: ₹${amount.toFixed(2)}. Available: ₹${currentBalance.toFixed(2)}`, 'error');
        return;
    }

    const btn = document.getElementById('withdrawBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Processing...';

    try {
        let endpoint = '';
        let requestBody = { amount: amount };

        if (currentMethod === 'upi') {
            const upiId = document.getElementById('upiId').value.trim();
            if (!upiId) {
                showToast('Please Enter UPI ID', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-arrow-up"></i> Submit Withdraw';
                return;
            }
            if (!upiId.includes('@')) {
                showToast('Please Enter A Valid UPI ID', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-arrow-up"></i> Submit Withdraw';
                return;
            }
            
            endpoint = '/api/withdraw/upi';
            requestBody.upiId = upiId;
            requestBody.note = 'UPI Withdrawal';
        } else {
            const bankName = document.getElementById('bankName').value.trim();
            const accountHolderName = document.getElementById('accountHolderName').value.trim();
            const accountNumber = document.getElementById('accountNumber').value.trim();
            const ifscCode = document.getElementById('ifscCode').value.trim().toUpperCase();

            if (!bankName || !accountHolderName || !accountNumber || !ifscCode) {
                showToast('Please Fill All Bank Details', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-arrow-up"></i> Submit Withdraw';
                return;
            }

            if (ifscCode.length < 7) {
                showToast('Please Enter A Valid IFSC Code', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-arrow-up"></i> Submit Withdraw';
                return;
            }

            endpoint = '/api/withdraw/bank';
            requestBody.bankName = bankName;
            requestBody.accountHolderName = accountHolderName;
            requestBody.accountNumber = accountNumber;
            requestBody.ifscCode = ifscCode;
            requestBody.note = 'Bank Withdrawal';
        }

        console.log('Submitting Withdrawal:', { endpoint, requestBody });

        const response = await fetch(endpoint, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(requestBody)
        });

        const data = await response.json();
        console.log('Response Data:', data);

        if (data.success) {
            const methodText = currentMethod === 'upi' ? 'UPI' : 'Bank';
            const feeText = data.fee > 0 ? ` (Fee: ₹${data.fee.toFixed(2)})` : '';
            showToast(`${methodText} Withdrawal Submitted!${feeText}`, 'success');
            
            if (data.newBalance !== undefined) {
                document.getElementById('balance').textContent = data.newBalance.toFixed(2);
            } else {
                loadUserData();
            }
            
            amountInput.value = '';
            updateFeeDisplay();
            
            if (currentMethod === 'upi') {
                document.getElementById('upiId').value = '';
            } else {
                document.getElementById('bankName').value = '';
                document.getElementById('accountHolderName').value = '';
                document.getElementById('accountNumber').value = '';
                document.getElementById('ifscCode').value = '';
            }
        } else {
            showToast(data.message || 'Withdraw Failed', 'error');
        }
    } catch (error) {
        console.error('Withdraw Error:', error);
        showToast(error.message || 'Network Error', 'error');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-arrow-up"></i> Submit Withdraw';
        
        if (!settings.enabled) {
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-ban"></i> Withdraw Disabled';
        }
    }
}

// ============================================
// INITIALIZE
// ============================================
document.addEventListener('DOMContentLoaded', function() {
    console.log('Withdraw Page Loaded');
    
    loadSettings();
    loadUserData();
    
    const amountInput = document.getElementById('amount');
    
    amountInput.addEventListener('input', updateFeeDisplay);
    
    amountInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') submitWithdraw();
    });
    
    document.getElementById('upiId').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') amountInput.focus();
    });
    
    ['bankName', 'accountHolderName', 'accountNumber', 'ifscCode'].forEach(id => {
        document.getElementById(id).addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const fields = ['bankName', 'accountHolderName', 'accountNumber', 'ifscCode'];
                const currentIndex = fields.indexOf(id);
                if (currentIndex < fields.length - 1) {
                    document.getElementById(fields[currentIndex + 1]).focus();
                } else {
                    amountInput.focus();
                }
            }
        });
    });
});
</script>
</body>
</html>
