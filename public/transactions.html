<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Transactions • Universal Wallet</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root { --bg-primary: #ffffff; --bg-secondary: #f0f7ff; --bg-card: #ffffff; --text-primary: #1a2a4a; --text-secondary: #5a7a9a; --text-muted: #8a9ab0; --border-color: #c5d9f0; --border-soft: #e8f0fe; --accent: #1a56db; --accent-gradient: linear-gradient(135deg, #1a56db, #0088ff); --accent-glow: rgba(26, 86, 219, 0.15); --shadow-card: 0 4px 20px rgba(0, 50, 100, 0.08); --nav-bg: rgba(255, 255, 255, 0.95); --input-bg: #fafcff; --grid-color: rgba(26, 86, 219, 0.04); --success: #16a34a; --danger: #dc2626; --warning: #d97706; --brand-credit: #16a34a; --brand-debit: #dc2626; }
body { font-family: 'Inter', sans-serif; min-height: 100vh; background: linear-gradient(135deg, #ffffff 0%, #e8f0fe 50%, #d4e4f7 100%); color: var(--text-primary); padding: 1rem; padding-bottom: 80px; position: relative; overflow-x: hidden; }
body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(26, 86, 219, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(26, 86, 219, 0.03) 1px, transparent 1px); background-size: 50px 50px; pointer-events: none; z-index: 0; }
.header { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0 1.5rem 0; max-width: 500px; margin: 0 auto; position: relative; z-index: 1; }
.header-left { display: flex; align-items: center; gap: 0.75rem; }
.back-btn { background: #ffffff; border: 2px solid #c5d9f0; width: 40px; height: 40px; border-radius: 50%; color: #1a56db; font-size: 1.1rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0, 50, 100, 0.08); }
.back-btn:hover { background: #f0f7ff; }
.back-btn:active { transform: scale(0.95); }
.header-logo { font-size: 1.3rem; font-weight: 800; color: #1a56db; letter-spacing: 0.5px; }
.header-right { display: flex; gap: 0.5rem; align-items: center; }
.header-right .avatar { width: 40px; height: 40px; border-radius: 50%; background: #1a56db; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: #ffffff; cursor: pointer; box-shadow: 0 4px 12px rgba(26, 86, 219, 0.3); }
.container { max-width: 500px; margin: 0 auto; position: relative; z-index: 1; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; margin-bottom: 1rem; }
.stat-card { background: #ffffff; border: 1px solid #c5d9f0; border-radius: 0.75rem; padding: 0.75rem; text-align: center; box-shadow: 0 2px 8px rgba(0, 50, 100, 0.05); }
.stat-card .stat-number { font-size: 1.1rem; font-weight: 800; }
.stat-card .stat-number.credit { color: var(--brand-credit); }
.stat-card .stat-number.debit { color: var(--brand-debit); }
.stat-card .stat-number.balance { color: var(--accent); }
.stat-card .stat-label { font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.3px; color: var(--text-secondary); margin-top: 2px; font-weight: 600; }
.stat-card .stat-icon { font-size: 1.1rem; margin-bottom: 0.2rem; display: block; }
.stat-card .stat-icon.credit { color: var(--brand-credit); }
.stat-card .stat-icon.debit { color: var(--brand-debit); }
.stat-card .stat-icon.balance { color: var(--accent); }
.filter-section { background: #ffffff; border: 1px solid #c5d9f0; border-radius: 1rem; padding: 0.75rem; margin-bottom: 1rem; box-shadow: 0 2px 8px rgba(0, 50, 100, 0.05); }
.filter-tabs { display: flex; gap: 0.3rem; flex-wrap: wrap; }
.filter-tabs button { background: #f0f7ff; border: 1px solid #c5d9f0; color: var(--text-secondary); padding: 0.35rem 0.85rem; border-radius: 2rem; font-size: 0.65rem; font-weight: 700; cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 0.3px; }
.filter-tabs button.active { background: #1a56db; border-color: #1a56db; color: #ffffff; box-shadow: 0 2px 8px rgba(26, 86, 219, 0.3); }
.filter-tabs button:hover:not(.active) { background: #e2eaf3; }
.filter-tabs button:active { transform: scale(0.95); }
.search-bar { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
.search-bar input { flex: 1; padding: 0.6rem 0.85rem; background: #fafcff; border: 2px solid #c5d9f0; border-radius: 0.75rem; color: var(--text-primary); font-size: 0.85rem; outline: none; transition: all 0.3s; font-family: 'Inter', sans-serif; }
.search-bar input:focus { border-color: #1a56db; box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.1); background: #ffffff; }
.search-bar input::placeholder { color: var(--text-muted); }
.search-bar button { padding: 0.6rem 1rem; background: #1a56db; border: none; border-radius: 0.75rem; color: #ffffff; font-weight: 700; cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif; box-shadow: 0 2px 8px rgba(26, 86, 219, 0.3); }
.search-bar button:hover { background: #1a4ac0; }
.search-bar button:active { transform: scale(0.95); }
.transaction-item { background: #ffffff; border: 1px solid #c5d9f0; border-radius: 0.75rem; padding: 0.85rem; margin-bottom: 0.5rem; transition: all 0.2s; box-shadow: 0 2px 6px rgba(0, 50, 100, 0.05); cursor: pointer; }
.transaction-item:hover { border-color: #1a56db; transform: translateX(2px); box-shadow: 0 4px 12px rgba(26, 86, 219, 0.1); }
.transaction-item:active { transform: scale(0.98); }
.transaction-item .tx-header { display: flex; justify-content: space-between; align-items: flex-start; }
.transaction-item .tx-left { display: flex; align-items: center; gap: 0.75rem; flex: 1; min-width: 0; }
.transaction-item .tx-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
.transaction-item .tx-icon.credit { background: #dcfce7; color: var(--brand-credit); }
.transaction-item .tx-icon.debit { background: #fee2e2; color: var(--brand-debit); }
.transaction-item .tx-icon.pending { background: #fef3c7; color: var(--warning); }
.transaction-item .tx-info { flex: 1; min-width: 0; }
.transaction-item .tx-title { font-weight: 700; font-size: 0.85rem; color: var(--text-primary); }
.transaction-item .tx-sub { font-size: 0.65rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.transaction-item .tx-id { font-size: 0.55rem; color: var(--text-muted); font-family: monospace; display: block; margin-top: 1px; }
.transaction-item .tx-amount { font-weight: 800; font-size: 0.95rem; flex-shrink: 0; text-align: right; }
.transaction-item .tx-amount.credit { color: var(--brand-credit); }
.transaction-item .tx-amount.debit { color: var(--brand-debit); }
.transaction-item .tx-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 0.4rem; padding-left: 3.25rem; }
.transaction-item .tx-status { padding: 0.15rem 0.55rem; border-radius: 2rem; font-size: 0.5rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.3px; }
.transaction-item .tx-status.success { background: #dcfce7; color: var(--success); }
.transaction-item .tx-status.pending { background: #fef3c7; color: var(--warning); }
.transaction-item .tx-status.failed { background: #fee2e2; color: var(--danger); }
.transaction-item .tx-status.cancelled { background: #f1f5f9; color: var(--text-muted); }
.transaction-item .tx-time { font-size: 0.6rem; color: var(--text-muted); font-weight: 500; }
.pagination { display: flex; justify-content: center; align-items: center; gap: 0.5rem; margin-top: 1rem; padding: 0.5rem 0; }
.pagination button { background: #ffffff; border: 2px solid #c5d9f0; color: #1a56db; padding: 0.4rem 0.75rem; border-radius: 0.5rem; cursor: pointer; transition: all 0.2s; font-size: 0.7rem; font-weight: 700; font-family: 'Inter', sans-serif; }
.pagination button:hover:not(:disabled) { background: #f0f7ff; }
.pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
.pagination button:active:not(:disabled) { transform: scale(0.95); }
.pagination .page-info { font-size: 0.7rem; color: var(--text-secondary); padding: 0 0.5rem; font-weight: 600; }
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 12px 20px; border-radius: 2rem; font-size: 0.75rem; font-weight: 700; z-index: 3000; opacity: 0; transition: all 0.3s; pointer-events: none; white-space: nowrap; max-width: 90%; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(10px); }
.toast.success { background: var(--success); color: #fff; }
.toast.error { background: var(--danger); color: #fff; }
.toast.warning { background: var(--warning); color: #fff; }
.toast.info { background: #1a56db; color: #fff; }
.loading-state { text-align: center; padding: 2rem; color: var(--text-secondary); }
.loading-state i { font-size: 2rem; margin-bottom: 0.5rem; display: block; animation: spin 1s linear infinite; color: #1a56db; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.empty-state { text-align: center; padding: 2rem; color: var(--text-secondary); }
.empty-state i { font-size: 2.5rem; display: block; margin-bottom: 0.5rem; opacity: 0.3; color: #1a56db; }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.98); border-top: 1px solid #c5d9f0; padding: 0.5rem 0 1rem 0; max-width: 500px; margin: 0 auto; display: flex; justify-content: space-around; backdrop-filter: blur(20px); z-index: 100; box-shadow: 0 -4px 20px rgba(0, 50, 100, 0.08); }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #8a9ab0; font-size: 0.55rem; font-weight: 700; text-transform: uppercase; transition: color 0.2s; padding: 0.25rem 0.5rem; }
.nav-item i { font-size: 1.2rem; }
.nav-item.active { color: #1a56db; }
.nav-item:active { transform: scale(0.95); }
.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px); z-index: 2000; justify-content: center; align-items: center; padding: 1.5rem; animation: fadeIn 0.3s ease; }
.modal-overlay.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
.modal-content { background: #ffffff; border: 1px solid #c5d9f0; border-radius: 1.5rem; padding: 1.5rem; max-width: 420px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0, 50, 100, 0.2); animation: slideUp 0.3s ease; position: relative; }
.modal-content::-webkit-scrollbar { width: 3px; }
.modal-content::-webkit-scrollbar-track { background: transparent; }
.modal-content::-webkit-scrollbar-thumb { background: #1a56db; border-radius: 10px; }
.modal-close { position: absolute; top: 0.75rem; right: 0.75rem; width: 32px; height: 32px; border-radius: 50%; background: #f0f7ff; border: 1px solid #c5d9f0; color: #5a7a9a; font-size: 1rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
.modal-close:hover { border-color: var(--danger); color: var(--danger); background: #fee2e2; }
.modal-close:active { transform: scale(0.9); }
.modal-tx-icon { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; margin: 0 auto 0.5rem; }
.modal-tx-icon.credit { background: #dcfce7; color: var(--brand-credit); }
.modal-tx-icon.debit { background: #fee2e2; color: var(--brand-debit); }
.modal-tx-icon.pending { background: #fef3c7; color: var(--warning); }
.modal-tx-title { text-align: center; font-size: 1.1rem; font-weight: 800; margin-bottom: 0.2rem; color: var(--text-primary); }
.modal-tx-amount { text-align: center; font-size: 2.2rem; font-weight: 900; margin: 0.3rem 0 0.8rem; }
.modal-tx-amount.credit { color: var(--brand-credit); }
.modal-tx-amount.debit { color: var(--brand-debit); }
.modal-tx-amount .currency { font-size: 1.2rem; font-weight: 700; opacity: 0.6; }
.modal-status { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.25rem 0.85rem; border-radius: 2rem; font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 auto 0.8rem; }
.modal-status.success { background: #dcfce7; color: var(--success); }
.modal-status.pending { background: #fef3c7; color: var(--warning); }
.modal-status.failed { background: #fee2e2; color: var(--danger); }
.modal-status.cancelled { background: #f1f5f9; color: var(--text-muted); }
.modal-divider { height: 1px; background: #e8f0fe; margin: 0.8rem 0; }
.modal-row { display: flex; justify-content: space-between; padding: 0.65rem 0; border-bottom: 1px solid #e8f0fe; }
.modal-row:last-child { border-bottom: none; }
.modal-label { font-size: 0.65rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.3px; font-weight: 700; }
.modal-value { font-size: 0.8rem; color: var(--text-primary); font-weight: 600; text-align: right; word-break: break-all; max-width: 60%; }
.modal-value .highlight { color: var(--accent); font-weight: 700; }
.modal-value .credit-text { color: var(--brand-credit); }
.modal-value .debit-text { color: var(--brand-debit); }
.modal-btn-copy { background: #f0f7ff; border: 1px solid #c5d9f0; color: #5a7a9a; padding: 0.2rem 0.55rem; border-radius: 0.4rem; font-size: 0.6rem; cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif; display: inline-flex; align-items: center; gap: 0.2rem; margin-left: 0.3rem; font-weight: 600; }
.modal-btn-copy:hover { border-color: #1a56db; color: #1a56db; background: #e2eaf3; }
.modal-btn-copy:active { transform: scale(0.95); }
.modal-center { text-align: center; }

/* ============================================
   BLOCKED / DELETED / DEACTIVATED OVERLAY
   ============================================ */
.blocked-overlay { position: fixed; inset: 0; z-index: 99999; background: linear-gradient(135deg, #ffffff 0%, #e8f0fe 50%, #d4e4f7 100%); display: none; align-items: center; justify-content: center; padding: 20px; }
.blocked-overlay.active { display: flex; }
.blocked-card { background: #ffffff; border-radius: 24px; padding: 40px 30px; max-width: 420px; width: 100%; text-align: center; border: 1px solid #c5d9f0; box-shadow: 0 20px 60px rgba(0, 50, 100, 0.2); animation: blockedIn 0.4s ease-out; }
@keyframes blockedIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
.blocked-icon { width: 90px; height: 90px; border-radius: 24px; background: #fee2e2; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 42px; color: #dc2626; border: 2px solid #fca5a5; }
.blocked-title { font-size: 24px; font-weight: 900; color: #1a3a6b; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
.blocked-sub { font-size: 14px; color: #5a7a9a; line-height: 1.6; margin-bottom: 24px; font-weight: 500; }
.blocked-btn { width: 100%; padding: 15px; border-radius: 16px; font-size: 14px; font-weight: 800; border: none; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; font-family: 'Inter', sans-serif; transition: all 0.2s; background: #1a56db; color: #ffffff; box-shadow: 0 4px 15px rgba(26, 86, 219, 0.3); display: flex; align-items: center; justify-content: center; gap: 8px; }
.blocked-btn:hover { background: #1a4ac0; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(26, 86, 219, 0.4); }
.blocked-btn:active { transform: scale(0.98); }

@media (max-width: 480px) {
    .stats-grid { grid-template-columns: 1fr 1fr 1fr; }
    .filter-tabs { gap: 0.25rem; }
    .filter-tabs button { padding: 0.3rem 0.55rem; font-size: 0.55rem; }
    .tx-bottom { padding-left: 0; flex-wrap: wrap; gap: 0.3rem; }
    .tx-left { gap: 0.5rem; }
    .tx-icon { width: 34px; height: 34px; font-size: 1rem; }
    .modal-content { padding: 1.2rem; margin: 0.5rem; }
    .modal-tx-amount { font-size: 1.8rem; }
}
</style>
</head>
<body>

<!-- BLOCKED OVERLAY -->
<div class="blocked-overlay" id="blockedOverlay">
    <div class="blocked-card">
        <div class="blocked-icon"><i class="fas fa-user-slash"></i></div>
        <div class="blocked-title" id="blockedTitle">Access Denied</div>
        <div class="blocked-sub" id="blockedSub">Your account has been blocked or deleted. Please contact support.</div>
        <button class="blocked-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Back To Login</button>
    </div>
</div>

<header class="header">
    <div class="header-left">
        <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
        <span class="header-logo">Transactions</span>
    </div>
    <div class="header-right">
        <div class="avatar" onclick="goToProfile()"><i class="fas fa-user"></i></div>
    </div>
</header>

<div class="container">
    <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
            <span class="stat-icon credit"><i class="fas fa-arrow-down"></i></span>
            <div class="stat-number credit" id="totalCredit">₹0</div>
            <div class="stat-label">Total Credit</div>
        </div>
        <div class="stat-card">
            <span class="stat-icon debit"><i class="fas fa-arrow-up"></i></span>
            <div class="stat-number debit" id="totalDebit">₹0</div>
            <div class="stat-label">Total Debit</div>
        </div>
        <div class="stat-card">
            <span class="stat-icon balance"><i class="fas fa-wallet"></i></span>
            <div class="stat-number balance" id="currentBalance">₹0</div>
            <div class="stat-label">Balance</div>
        </div>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search By ID, UTR, Or Remark..." onkeyup="handleSearch(event)">
        <button onclick="handleSearch()"><i class="fas fa-search"></i></button>
    </div>

    <div class="filter-section">
        <div class="filter-tabs">
            <button class="active" data-filter="all" onclick="filterTransactions('all')">All</button>
            <button data-filter="credit" onclick="filterTransactions('credit')">Credit</button>
            <button data-filter="debit" onclick="filterTransactions('debit')">Debit</button>
            <button data-filter="success" onclick="filterTransactions('success')">Success</button>
            <button data-filter="pending" onclick="filterTransactions('pending')">Pending</button>
            <button data-filter="failed" onclick="filterTransactions('failed')">Failed</button>
        </div>
    </div>

    <div id="transactionList">
        <div class="loading-state">
            <i class="fas fa-bolt"></i>
            <p>Loading Transactions...</p>
        </div>
    </div>

    <div class="pagination" id="pagination">
        <button onclick="changePage('prev')" id="prevPage" disabled><i class="fas fa-chevron-left"></i></button>
        <span class="page-info" id="pageInfo">Page 1 of 1</span>
        <button onclick="changePage('next')" id="nextPage" disabled><i class="fas fa-chevron-right"></i></button>
    </div>
</div>

<div class="bottom-nav">
    <a href="/dashboard" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
    <a href="/transfer" class="nav-item"><i class="fas fa-paper-plane"></i><span>Send</span></a>
    <a href="/transactions" class="nav-item active"><i class="fas fa-list-ul"></i><span>Logs</span></a>
    <a href="/deposit" class="nav-item"><i class="fas fa-plus-circle"></i><span>Add</span></a>
    <a href="/profile" class="nav-item"><i class="fas fa-user"></i><span>Profile</span></a>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal-content" id="modalContent" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
        <div id="modalBody"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================
// STATE
// ============================================
let state = {
    transactions: [],
    filteredTransactions: [],
    currentPage: 1,
    limit: 20,
    totalPages: 1,
    totalTransactions: 0,
    filter: 'all',
    searchQuery: '',
    userId: null
};

let isAccountBlocked = false;

// ============================================
// ACCOUNT STATE PROTECTION
// ============================================
function showBlockedOverlay(title, message) {
    if (isAccountBlocked) return;
    isAccountBlocked = true;
    if (title) document.getElementById('blockedTitle').textContent = title;
    if (message) document.getElementById('blockedSub').textContent = message;
    document.getElementById('blockedOverlay').classList.add('active');
    closeModal();
}

function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    localStorage.removeItem('pin_set');
    localStorage.removeItem('pin_verified');
    window.location.href = '/';
}

// ============================================
// AUTH
// ============================================
function getToken() { return localStorage.getItem('token'); }

function checkAuth() {
    const token = getToken();
    if (!token) {
        showToast('Please Login To View Transactions.', 'error');
        setTimeout(() => { window.location.href = '/'; }, 1500);
        return false;
    }
    return true;
}

// ============================================
// SAFE FETCH
// ============================================
async function safeFetch(url, options = {}) {
    try {
        const response = await fetch(url, options);
        let data = {};
        const contentType = response.headers.get('content-type');
        if (contentType && contentType.includes('application/json')) {
            try { data = await response.json(); } catch (e) { data = {}; }
        }

        if (response.status === 401) { logout(); throw new Error('Session expired'); }
        if (response.status === 403) {
            showBlockedOverlay('Access Denied', data.message || 'Your account has been blocked.');
            throw new Error('Account blocked');
        }
        if (response.status === 404 && data.userNotFound) {
            showBlockedOverlay('Account Not Found', 'Your account has been deleted. Please contact support.');
            throw new Error('Account deleted');
        }
        return { response, data };
    } catch (error) {
        if (!isAccountBlocked) throw error;
        return { response: null, data: {} };
    }
}

// ============================================
// VERIFY USER STATE
// ============================================
async function verifyUserState() {
    const t = getToken();
    if (!t) { window.location.href = '/'; return false; }
    try {
        const res = await fetch('/api/auth/me', {
            headers: { 'Authorization': 'Bearer ' + t, 'Content-Type': 'application/json' }
        });
        let data = {};
        try { data = await res.json(); } catch (e) { data = {}; }

        if (res.status === 401) { logout(); return false; }
        if (res.status === 403) {
            showBlockedOverlay('Account Blocked', data.message || 'Your account has been blocked.');
            return false;
        }
        if (res.status === 404) {
            showBlockedOverlay('Account Not Found', 'Your account has been deleted.');
            return false;
        }

        const user = data.user || data.data || data;
        if (!user || (!user.id && !user._id)) {
            showBlockedOverlay('Invalid Account', 'Your account data could not be found.');
            return false;
        }
        if (user.isBlocked === true) {
            showBlockedOverlay('Account Blocked', 'Your account has been blocked by administrator.');
            return false;
        }
        if (user.isDeleted === true || user.deletedAt) {
            showBlockedOverlay('Account Deleted', 'Your account has been deleted.');
            return false;
        }
        if (user.isActive === false) {
            showBlockedOverlay('Account Deactivated', 'Your account has been deactivated.');
            return false;
        }

        state.userId = user.id || user._id;
        localStorage.setItem('user', JSON.stringify(user));
        return true;
    } catch (error) {
        console.error('User state check error:', error);
        return true;
    }
}

// ============================================
// NAVIGATION
// ============================================
function goBack() { window.location.href = '/dashboard'; }
function goToProfile() { window.location.href = '/profile'; }

// ============================================
// API CALL
// ============================================
async function apiCall(endpoint, options = {}) {
    if (isAccountBlocked) throw new Error('Account blocked');
    const token = getToken();
    if (!token) { logout(); throw new Error('Not authenticated'); }

    const defaultOptions = {
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
    };

    const { response, data } = await safeFetch(endpoint, { ...defaultOptions, ...options });
    if (isAccountBlocked) throw new Error('Account blocked');

    if (!response) throw new Error('Network error');
    if (!response.ok) {
        throw new Error(data.message || `Server error ${response.status}`);
    }
    return data;
}

// ============================================
// FETCH USER INFO
// ============================================
async function fetchUserInfo() {
    try {
        const data = await apiCall('/api/auth/me');
        if (data.success && data.user) {
            state.userId = data.user._id || data.user.id;
        }
    } catch (error) {
        if (!isAccountBlocked) console.error('Fetch User Error:', error);
    }
}

// ============================================================
// CHECK IF TRANSACTION IS CREDIT
// ============================================================
function isTransactionCredit(tx) {
    if (!state.userId) return false;

    const senderId = tx.sender_id?._id?.toString() || tx.sender_id?.toString() || null;
    const receiverId = tx.receiver_id?._id?.toString() || tx.receiver_id?.toString() || null;
    const userIdStr = state.userId.toString();

    if (tx.metadata && tx.metadata.transactionType) {
        if (tx.metadata.transactionType === 'payment_received') return true;
        if (tx.metadata.transactionType === 'payment_sent') return false;
    }
    if (tx.userRole === 'receiver') return true;
    if (tx.userRole === 'sender') return false;
    if (receiverId === userIdStr) return true;
    if (senderId === userIdStr) return false;

    const creditTypes = ['deposit', 'credit', 'admin_add', 'game_win', 'redeem', 'lifafa_received', 'gift_received'];
    if (creditTypes.includes(tx.type)) return true;

    const debitTypes = ['withdrawal', 'withdraw', 'debit', 'admin_deduct', 'game_loss', 'lifafa_created', 'gift_created'];
    if (debitTypes.includes(tx.type)) return false;

    return receiverId === userIdStr;
}

// ============================================================
// GET TRANSACTION DISPLAY NAME
// ============================================================
function getTransactionDisplayName(tx) {
    const isCredit = isTransactionCredit(tx);

    if (tx.metadata && tx.metadata.transactionType) {
        if (tx.metadata.transactionType === 'payment_received') return 'Transfer Received';
        if (tx.metadata.transactionType === 'payment_sent') return 'Transfer Sent';
    }
    if (tx.type === 'transfer' || tx.type === 'api') {
        return isCredit ? 'Transfer Received' : 'Transfer Sent';
    }
    if (tx.type === 'deposit' || tx.type === 'credit' || tx.type === 'admin_add') return 'Balance Added';
    if (tx.type === 'withdrawal' || tx.type === 'withdraw' || tx.type === 'debit' || tx.type === 'admin_deduct') return 'Withdrawal';
    if (tx.type === 'game_win') return 'Game Win';
    if (tx.type === 'game_loss') return 'Game Loss';
    if (tx.type === 'lifafa' || tx.type === 'envelope') {
        return isCredit ? 'Lifafa Claimed' : 'Lifafa Created';
    }
    if (tx.type === 'gift') {
        return isCredit ? 'Gift Received' : 'Gift Created';
    }
    if (tx.type === 'redeem') return 'Redeem';
    return tx.type || 'Transaction';
}

// ============================================================
// GET COUNTERPARTY
// ============================================================
function getCounterparty(tx) {
    const isCredit = isTransactionCredit(tx);
    if (isCredit) {
        if (tx.sender_id?.fullName) return tx.sender_id.fullName;
        if (tx.metadata?.senderName) return tx.metadata.senderName;
        if (tx.sender_id?.mobile) return tx.sender_id.mobile;
        return 'Unknown';
    } else {
        if (tx.receiver_id?.fullName) return tx.receiver_id.fullName;
        if (tx.metadata?.receiverName) return tx.metadata.receiverName;
        if (tx.receiver_id?.mobile) return tx.receiver_id.mobile;
        return 'Unknown';
    }
}

function getCounterpartyType(tx) {
    return isTransactionCredit(tx) ? 'From' : 'To';
}

// ============================================================
// GET ICON CLASS
// ============================================================
function getTransactionIcon(tx) {
    const isCredit = isTransactionCredit(tx);
    if (tx.metadata && tx.metadata.transactionType) {
        if (tx.metadata.transactionType === 'payment_received') return 'fa-arrow-down';
        if (tx.metadata.transactionType === 'payment_sent') return 'fa-arrow-up';
    }
    if (tx.type === 'transfer' || tx.type === 'api') {
        return isCredit ? 'fa-arrow-down' : 'fa-arrow-up';
    }
    if (tx.type === 'deposit' || tx.type === 'credit' || tx.type === 'admin_add') return 'fa-arrow-down';
    if (tx.type === 'withdrawal' || tx.type === 'withdraw' || tx.type === 'debit' || tx.type === 'admin_deduct') return 'fa-arrow-up';
    if (tx.type === 'game_win') return 'fa-trophy';
    if (tx.type === 'game_loss') return 'fa-times-circle';
    if (tx.type === 'lifafa' || tx.type === 'envelope') return 'fa-envelope-open-text';
    if (tx.type === 'gift') return 'fa-gift';
    if (tx.type === 'redeem') return 'fa-exchange-alt';
    return 'fa-circle';
}

// ============================================
// FETCH TRANSACTIONS
// ============================================
async function fetchTransactions() {
    if (isAccountBlocked) return;
    if (!checkAuth()) return;

    const listEl = document.getElementById('transactionList');
    listEl.innerHTML = `<div class="loading-state"><i class="fas fa-bolt"></i><p>Loading Transactions...</p></div>`;

    try {
        await fetchUserInfo();
        if (isAccountBlocked) return;

        let url = `/api/payment/history?page=${state.currentPage}&limit=${state.limit}`;
        const data = await apiCall(url);
        if (isAccountBlocked) return;

        state.transactions = data.data?.transactions || [];
        state.totalTransactions = data.data?.pagination?.total || 0;
        state.totalPages = data.data?.pagination?.totalPages || 1;

        applyFiltersAndSearch();
        renderStats();
        renderPagination();
    } catch (error) {
        if (!isAccountBlocked) {
            console.error('Fetch Transactions Error:', error);
            listEl.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed To Load Transactions</p><button onclick="fetchTransactions()" style="margin-top:0.5rem;padding:0.4rem 1rem;background:#1a56db;border:none;border-radius:0.5rem;color:#fff;cursor:pointer;font-family:'Inter',sans-serif;font-size:0.75rem;font-weight:700;">Retry</button></div>`;
        }
    }
}

// ============================================
// FILTER & SEARCH
// ============================================
function applyFiltersAndSearch() {
    if (isAccountBlocked) return;
    let filtered = [...state.transactions];

    if (state.filter !== 'all') {
        filtered = filtered.filter(tx => {
            const isCredit = isTransactionCredit(tx);
            const status = tx.status || 'success';
            if (state.filter === 'credit') return isCredit;
            if (state.filter === 'debit') return !isCredit;
            if (state.filter === 'success') return status === 'success';
            if (state.filter === 'pending') return status === 'pending';
            if (state.filter === 'failed') return status === 'failed' || status === 'cancelled';
            return true;
        });
    }

    if (state.searchQuery.trim()) {
        const query = state.searchQuery.trim().toLowerCase();
        filtered = filtered.filter(tx => {
            const id = (tx.tx_id || tx._id || '').toLowerCase();
            const remark = (tx.remark || tx.description || '').toLowerCase();
            const utr = (tx.metadata?.transactionRef || '').toLowerCase();
            return id.includes(query) || remark.includes(query) || utr.includes(query);
        });
    }

    state.filteredTransactions = filtered;
    renderTransactions();
}

function filterTransactions(filter) {
    if (isAccountBlocked) return;
    state.filter = filter;
    state.currentPage = 1;
    document.querySelectorAll('.filter-tabs button').forEach(b => b.classList.remove('active'));
    const btn = document.querySelector(`.filter-tabs button[data-filter="${filter}"]`);
    if (btn) btn.classList.add('active');
    applyFiltersAndSearch();
}

function handleSearch(event) {
    if (isAccountBlocked) return;
    if (event && event.key === 'Enter') {
        state.searchQuery = document.getElementById('searchInput').value;
        state.currentPage = 1;
        applyFiltersAndSearch();
    } else if (!event) {
        state.searchQuery = document.getElementById('searchInput').value;
        state.currentPage = 1;
        applyFiltersAndSearch();
    }
}

// ============================================
// RENDER TRANSACTIONS
// ============================================
function renderTransactions() {
    if (isAccountBlocked) return;
    const listEl = document.getElementById('transactionList');
    const txs = state.filteredTransactions;

    if (!txs || txs.length === 0) {
        listEl.innerHTML = `<div class="empty-state"><i class="fas fa-receipt"></i><p>${state.searchQuery ? 'No Transactions Match Your Search.' : 'No Transactions Found.'}</p></div>`;
        return;
    }

    let html = '';
    txs.forEach(tx => {
        const isCredit = isTransactionCredit(tx);
        const displayName = getTransactionDisplayName(tx);
        const status = tx.status || 'success';
        const amount = tx.amount || 0;
        const time = new Date(tx.tx_time || tx.createdAt).toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
        const amountSign = isCredit ? '+' : '-';
        const amountClass = isCredit ? 'credit' : 'debit';
        const iconClass = isCredit ? 'credit' : 'debit';
        const icon = getTransactionIcon(tx);
        const statusClass = status === 'success' ? 'success' : (status === 'pending' ? 'pending' : 'failed');

        let subText = '';
        if (tx.metadata) {
            if (isCredit && tx.metadata.senderName) subText = 'From: ' + tx.metadata.senderName;
            else if (!isCredit && tx.metadata.receiverName) subText = 'To: ' + tx.metadata.receiverName;
        }

        const txnId = tx.tx_id || tx._id || 'N/A';

        html += `
            <div class="transaction-item" onclick="openTransactionDetails('${txnId}')">
                <div class="tx-header">
                    <div class="tx-left">
                        <div class="tx-icon ${iconClass}">
                            <i class="fas ${icon}"></i>
                        </div>
                        <div class="tx-info">
                            <div class="tx-title">${displayName}</div>
                            ${subText ? `<div class="tx-sub">${subText}</div>` : ''}
                            <span class="tx-id">${txnId}</span>
                        </div>
                    </div>
                    <div class="tx-amount ${amountClass}">${amountSign}₹${amount.toFixed(2)}</div>
                </div>
                <div class="tx-bottom">
                    <span class="tx-time"><i class="far fa-clock"></i> ${time}</span>
                    <span class="tx-status ${statusClass}">${status}</span>
                </div>
            </div>
        `;
    });
    listEl.innerHTML = html;
}

// ============================================
// RENDER STATS
// ============================================
function renderStats() {
    if (isAccountBlocked) return;
    let totalCredit = 0, totalDebit = 0;
    state.transactions.forEach(tx => {
        const isCredit = isTransactionCredit(tx);
        const amount = tx.amount || 0;
        if (isCredit) totalCredit += amount;
        else totalDebit += amount;
    });
    document.getElementById('totalCredit').textContent = '₹' + totalCredit.toFixed(2);
    document.getElementById('totalDebit').textContent = '₹' + totalDebit.toFixed(2);
    fetchBalance();
}

async function fetchBalance() {
    if (isAccountBlocked) return;
    try {
        const token = getToken();
        if (!token) return;
        const { response, data } = await safeFetch('/api/auth/me', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (isAccountBlocked) return;
        if (response && response.ok && data.success && data.user) {
            document.getElementById('currentBalance').textContent = '₹' + (data.user.balance || 0).toFixed(2);
        }
    } catch (error) {
        if (!isAccountBlocked) console.error('Balance Error:', error);
    }
}

// ============================================
// PAGINATION
// ============================================
function renderPagination() {
    if (isAccountBlocked) return;
    document.getElementById('pageInfo').textContent = `Page ${state.currentPage} of ${state.totalPages || 1}`;
    document.getElementById('prevPage').disabled = state.currentPage <= 1;
    document.getElementById('nextPage').disabled = state.currentPage >= state.totalPages;
}

function changePage(direction) {
    if (isAccountBlocked) return;
    if (direction === 'prev' && state.currentPage > 1) { state.currentPage--; }
    else if (direction === 'next' && state.currentPage < state.totalPages) { state.currentPage++; }
    else { return; }
    fetchTransactions();
}

// ============================================================
// MODAL / POPUP
// ============================================================
async function openTransactionDetails(txnId) {
    if (isAccountBlocked) return;
    const modal = document.getElementById('modalOverlay');
    const body = document.getElementById('modalBody');

    modal.classList.add('active');
    body.innerHTML = `<div style="text-align:center;padding:1rem;"><i class="fas fa-spinner fa-spin" style="font-size:1.5rem;color:#1a56db;"></i><p style="margin-top:0.5rem;color:#5a7a9a;font-size:0.8rem;">Loading Details...</p></div>`;

    try {
        const data = await apiCall(`/api/payment/${txnId}`);
        if (isAccountBlocked) return;

        if (data.status === 'success' && data.data?.transaction) {
            renderModal(data.data.transaction);
        } else {
            body.innerHTML = `<div style="text-align:center;padding:1.5rem;color:#5a7a9a;"><i class="fas fa-exclamation-triangle" style="font-size:2rem;display:block;margin-bottom:0.5rem;opacity:0.3;"></i><p>Transaction Not Found</p></div>`;
        }
    } catch (error) {
        if (!isAccountBlocked) {
            body.innerHTML = `<div style="text-align:center;padding:1.5rem;color:#5a7a9a;"><i class="fas fa-exclamation-triangle" style="font-size:2rem;display:block;margin-bottom:0.5rem;opacity:0.3;"></i><p>Failed To Load Details</p></div>`;
        }
    }
}

function renderModal(tx) {
    const body = document.getElementById('modalBody');
    const isCredit = isTransactionCredit(tx);
    const displayName = getTransactionDisplayName(tx);
    const icon = getTransactionIcon(tx);
    const iconClass = isCredit ? 'credit' : 'debit';
    const amountClass = isCredit ? 'credit' : 'debit';
    const amountSign = isCredit ? '+' : '-';
    const status = tx.status || 'success';
    const amount = tx.amount || 0;
    const time = new Date(tx.tx_time || tx.createdAt).toLocaleString('en-IN', {
        day: '2-digit', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hour12: true
    });

    const counterparty = getCounterparty(tx);
    const counterpartyType = getCounterpartyType(tx);
    const txnId = tx.tx_id || tx._id || 'N/A';

    let statusClass = status;
    if (status === 'success') statusClass = 'success';
    else if (status === 'pending') statusClass = 'pending';
    else if (status === 'failed' || status === 'cancelled') statusClass = 'failed';

    let html = `
        <div class="modal-center">
            <div class="modal-tx-icon ${iconClass}">
                <i class="fas ${icon}"></i>
            </div>
            <div class="modal-tx-title">${displayName}</div>
            <div class="modal-tx-amount ${amountClass}">
                <span class="currency">₹</span>${amountSign} ${amount.toFixed(2)}
            </div>
            <div class="modal-status ${statusClass}">
                <i class="fas ${status === 'success' ? 'fa-check-circle' : status === 'pending' ? 'fa-clock' : 'fa-times-circle'}"></i>
                ${status}
            </div>
        </div>

        <div class="modal-divider"></div>

        <div class="modal-row">
            <span class="modal-label">Transaction Id</span>
            <span class="modal-value">
                ${txnId}
                <button class="modal-btn-copy" onclick="copyToClipboard('${txnId}')">
                    <i class="fas fa-copy"></i>
                </button>
            </span>
        </div>

        <div class="modal-row">
            <span class="modal-label">${counterpartyType}</span>
            <span class="modal-value highlight">${counterparty}</span>
        </div>

        <div class="modal-row">
            <span class="modal-label">Amount</span>
            <span class="modal-value ${amountClass}">₹${amount.toFixed(2)}</span>
        </div>

        <div class="modal-row">
            <span class="modal-label">Date & Time</span>
            <span class="modal-value">${time}</span>
        </div>

        ${tx.remark || tx.description ? `
        <div class="modal-row">
            <span class="modal-label">Note</span>
            <span class="modal-value">${tx.remark || tx.description}</span>
        </div>
        ` : ''}
    `;

    body.innerHTML = html;
}

function closeModal(event) {
    if (event && event.target !== event.currentTarget) return;
    document.getElementById('modalOverlay').classList.remove('active');
}

// ============================================
// COPY TO CLIPBOARD
// ============================================
function copyToClipboard(text) {
    if (isAccountBlocked) return;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
        showToast('Copied To Clipboard', 'success');
    }).catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('Copied To Clipboard', 'success');
    });
}

// ============================================
// TOAST
// ============================================
function showToast(message, type = 'info') {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = `toast ${type} show`;
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => toast.className = 'toast', 3000);
}

// ============================================
// KEYBOARD SHORTCUTS
// ============================================
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
});

// ============================================
// INIT
// ============================================
document.addEventListener('DOMContentLoaded', async function() {
    console.log('Transactions Page Loading...');
    if (!checkAuth()) return;

    const isUserValid = await verifyUserState();
    if (!isUserValid) return;

    fetchTransactions();
});
