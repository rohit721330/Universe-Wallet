<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dᴇᴘᴏꜱɪᴛ Mᴀɴᴀɢᴇᴍᴇɴᴛ • Pʀɪᴍᴇ Wᴀʟʟᴇᴛ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #11162e;
            --bg-card: #1a1f3a;
            --text-primary: #ffffff;
            --text-secondary: #8a8fad;
            --text-muted: #6b6f8d;
            --border-color: rgba(0, 240, 255, 0.12);
            --border-soft: rgba(0, 240, 255, 0.06);
            --accent: #00f0ff;
            --accent-gradient: linear-gradient(135deg, #00f0ff, #0088ff);
            --accent-glow: rgba(0, 240, 255, 0.3);
            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.3);
            --nav-bg: rgba(8, 12, 28, 0.95);
            --input-bg: #0a0e27;
            --grid-color: rgba(0, 240, 255, 0.06);
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --pending-color: #f59e0b;
            --completed-color: #22c55e;
            --cancelled-color: #ef4444;
            --manual-color: #8b5cf6;
            --anodized-glow: 0 0 30px rgba(0, 240, 255, 0.15);
            --anodized-border: 1px solid rgba(0, 240, 255, 0.2);
        }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 1rem;
            padding-bottom: 80px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
            animation: gridMove 8s linear infinite;
        }
        @keyframes gridMove { 0% { transform: translate(0,0); } 100% { transform: translate(50px,50px); } }
        
        .electron-particle {
            position: fixed;
            bottom: -20px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: riseElectron linear infinite;
            opacity: 0;
            box-shadow: 0 0 20px rgba(0,240,255,0.4), 0 0 60px rgba(0,240,255,0.1);
        }
        .electron-particle.big { box-shadow: 0 0 30px rgba(0,240,255,0.6), 0 0 80px rgba(0,240,255,0.15); background: radial-gradient(circle, #00f0ff, #0088ff); }
        .electron-particle.small { box-shadow: 0 0 15px rgba(0,240,255,0.3); background: radial-gradient(circle, #00f0ff, transparent); }
        @keyframes riseElectron { 0% { transform: translateY(0) scale(1); opacity: 0; } 5% { opacity: 0.8; } 95% { opacity: 0.8; } 100% { transform: translateY(-100vh) scale(0.3); opacity: 0; } }

        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 999; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }
        .sidebar { position: fixed; top: 0; left: -300px; width: 280px; height: 100%; background: var(--bg-secondary); z-index: 1000; transition: all 0.3s ease; padding: 1.5rem 0; overflow-y: auto; border-right: var(--anodized-border); box-shadow: var(--anodized-glow); }
        .sidebar.open { left: 0; }
        .sidebar-header { padding: 0 1.5rem 1.5rem; border-bottom: var(--anodized-border); display: flex; align-items: center; gap: 0.75rem; }
        .sidebar-header .sidebar-logo { font-size: 1.2rem; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 30px rgba(0,240,255,0.3); }
        .sidebar-header .sidebar-close { margin-left: auto; width: 32px; height: 32px; border-radius: 50%; border: var(--anodized-border); background: var(--bg-card); color: var(--text-primary); font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .sidebar-header .sidebar-close:active { transform: scale(0.9); }
        .sidebar-user { padding: 1.5rem; border-bottom: var(--anodized-border); display: flex; align-items: center; gap: 0.75rem; }
        .sidebar-user .user-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 700; color: #fff; flex-shrink: 0; box-shadow: 0 0 30px rgba(0,240,255,0.3); }
        .sidebar-user .user-info { flex: 1; min-width: 0; }
        .sidebar-user .user-name { font-size: 0.9rem; font-weight: 700; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sidebar-user .user-role { font-size: 0.65rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }
        .sidebar-menu { padding: 0.5rem 0; }
        .sidebar-menu .menu-label { padding: 0.5rem 1.5rem; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
        .sidebar-menu .menu-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.7rem 1.5rem; color: var(--text-secondary); text-decoration: none; font-size: 0.85rem; font-weight: 500; transition: all 0.2s; cursor: pointer; border: none; background: none; width: 100%; text-align: left; font-family: 'Inter', sans-serif; }
        .sidebar-menu .menu-item i { width: 20px; font-size: 1rem; color: var(--text-muted); }
        .sidebar-menu .menu-item:hover { background: var(--bg-card); color: var(--text-primary); }
        .sidebar-menu .menu-item.active { background: var(--bg-card); color: var(--accent); border-left: 3px solid var(--accent); }
        .sidebar-menu .menu-item.active i { color: var(--accent); text-shadow: 0 0 20px rgba(0,240,255,0.3); }
        .sidebar-menu .menu-item.logout { margin-top: 0.5rem; border-top: var(--anodized-border); padding-top: 1rem; color: var(--danger); }
        .sidebar-menu .menu-item.logout i { color: var(--danger); }
        .sidebar-menu .menu-item.logout:hover { background: rgba(239,68,68,0.1); }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0 1.5rem 0; max-width: 500px; margin: 0 auto; position: relative; z-index: 1; }
        .header-left { display: flex; align-items: center; gap: 0.75rem; }
        .menu-btn { background: var(--bg-secondary); border: var(--anodized-border); width: 40px; height: 40px; border-radius: 50%; color: var(--text-primary); font-size: 1.2rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(0,240,255,0.05); }
        .menu-btn:active { transform: scale(0.95); }
        .header-logo { font-size: 1.3rem; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 30px rgba(0,240,255,0.2); }
        .header-right { display: flex; gap: 0.5rem; align-items: center; }
        .header-right .admin-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 700; color: #fff; cursor: pointer; box-shadow: 0 0 30px rgba(0,240,255,0.3); }
        .admin-badge { background: rgba(0,240,255,0.15); color: var(--accent); padding: 0.25rem 0.75rem; border-radius: 2rem; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; border: var(--anodized-border); box-shadow: 0 0 20px rgba(0,240,255,0.1); }
        .container { max-width: 500px; margin: 0 auto; position: relative; z-index: 1; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; margin-bottom: 1.5rem; }
        .stat-card { background: var(--bg-card); border: var(--anodized-border); border-radius: 0.75rem; padding: 0.75rem; text-align: center; box-shadow: var(--anodized-glow); }
        .stat-card .stat-number { font-size: 1.2rem; font-weight: 800; }
        .stat-card .stat-number.total { color: var(--accent); text-shadow: 0 0 30px rgba(0,240,255,0.2); }
        .stat-card .stat-number.pending { color: var(--warning); }
        .stat-card .stat-number.completed { color: var(--success); }
        .stat-card .stat-label { font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.3px; color: var(--text-secondary); margin-top: 2px; }

        .filter-section { background: var(--bg-card); border: var(--anodized-border); border-radius: 1rem; padding: 1rem; margin-bottom: 1rem; box-shadow: var(--anodized-glow); }
        .filter-tabs { display: flex; gap: 0.4rem; flex-wrap: wrap; }
        .filter-tabs button { background: var(--input-bg); border: var(--anodized-border); color: var(--text-secondary); padding: 0.4rem 1rem; border-radius: 2rem; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif; }
        .filter-tabs button.active { background: rgba(0,240,255,0.15); border-color: var(--accent); color: var(--accent); box-shadow: 0 0 20px rgba(0,240,255,0.1); }
        .filter-tabs button:active { transform: scale(0.95); }

        .deposit-item { background: var(--bg-card); border: var(--anodized-border); border-radius: 0.75rem; padding: 0.75rem 1rem; margin-bottom: 0.5rem; transition: all 0.2s; box-shadow: var(--anodized-glow); }
        .deposit-item:hover { border-color: rgba(0,240,255,0.3); }
        .deposit-item .deposit-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
        .deposit-item .deposit-user { font-weight: 700; font-size: 0.95rem; color: var(--text-primary); }
        .deposit-item .deposit-details { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin-top: 0.2rem; }
        .deposit-item .deposit-details span { font-size: 0.65rem; color: var(--text-secondary); }
        .deposit-item .deposit-details i { margin-right: 0.2rem; color: var(--accent); opacity: 0.6; }
        .deposit-item .deposit-details .utr-highlight { color: var(--warning); font-weight: 600; }
        .deposit-item .deposit-amount { font-weight: 700; font-size: 1rem; color: var(--accent); }
        .deposit-item .deposit-status { padding: 0.15rem 0.6rem; border-radius: 2rem; font-size: 0.55rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
        .deposit-item .deposit-status.pending { background: rgba(245,158,11,0.15); color: var(--warning); }
        .deposit-item .deposit-status.pending_approval { background: rgba(245,158,11,0.25); color: var(--warning); border: 1px solid rgba(245,158,11,0.2); }
        .deposit-item .deposit-status.approved { background: rgba(34,197,94,0.15); color: var(--success); }
        .deposit-item .deposit-status.completed { background: rgba(34,197,94,0.15); color: var(--success); }
        .deposit-item .deposit-status.rejected { background: rgba(239,68,68,0.15); color: var(--danger); }
        .deposit-item .deposit-status.failed { background: rgba(239,68,68,0.15); color: var(--danger); }
        .deposit-item .deposit-status.cancelled { background: rgba(239,68,68,0.10); color: var(--danger); }
        .deposit-item .deposit-status.expired { background: rgba(107,114,128,0.15); color: var(--text-muted); }
        .deposit-item .deposit-type-badge { font-size: 0.55rem; font-weight: 600; padding: 0.1rem 0.5rem; border-radius: 2rem; margin-left: 0.5rem; }
        .deposit-item .deposit-type-badge.auto { color: var(--accent); background: rgba(0,240,255,0.1); }
        .deposit-item .deposit-type-badge.manual { color: var(--manual-color); background: rgba(139,92,246,0.1); }
        .deposit-item .deposit-actions { display: flex; gap: 0.4rem; margin-top: 0.5rem; flex-wrap: wrap; }
        .deposit-item .deposit-actions button { padding: 0.3rem 0.9rem; border-radius: 0.5rem; font-size: 0.65rem; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif; }
        .deposit-item .deposit-actions button:active { transform: scale(0.95); }
        .deposit-item .deposit-actions .btn-approve { background: rgba(34,197,94,0.15); color: var(--success); }
        .deposit-item .deposit-actions .btn-approve:hover { background: rgba(34,197,94,0.25); }
        .deposit-item .deposit-actions .btn-reject { background: rgba(239,68,68,0.15); color: var(--danger); }
        .deposit-item .deposit-actions .btn-reject:hover { background: rgba(239,68,68,0.25); }
        .deposit-item .deposit-actions .btn-view { background: rgba(0,240,255,0.1); color: var(--accent); }
        .deposit-item .deposit-actions .btn-view:hover { background: rgba(0,240,255,0.2); }
        .deposit-item .deposit-actions button:disabled { opacity: 0.4; cursor: not-allowed; }

        .pagination { display: flex; justify-content: center; align-items: center; gap: 0.5rem; margin-top: 1.5rem; padding: 0.5rem 0; }
        .pagination button { background: var(--bg-card); border: var(--anodized-border); color: var(--text-secondary); padding: 0.4rem 0.8rem; border-radius: 0.5rem; cursor: pointer; transition: all 0.2s; font-size: 0.8rem; font-family: 'Inter', sans-serif; }
        .pagination button.active { background: rgba(0,240,255,0.15); border-color: var(--accent); color: var(--accent); }
        .pagination button:disabled { opacity: 0.3; cursor: not-allowed; }
        .pagination button:active:not(:disabled) { transform: scale(0.95); }
        .pagination .page-info { font-size: 0.75rem; color: var(--text-muted); padding: 0 0.5rem; }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 12px 20px; border-radius: 2rem; font-size: 0.8rem; font-weight: 600; z-index: 3000; opacity: 0; transition: all 0.3s; pointer-events: none; white-space: nowrap; max-width: 90%; border: var(--anodized-border); }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(10px); }
        .toast.success { background: var(--success); color: #fff; }
        .toast.error { background: var(--danger); color: #fff; }
        .toast.warning { background: var(--warning); color: #fff; }
        .toast.info { background: var(--bg-card); color: var(--accent); border-color: var(--accent); box-shadow: 0 0 40px rgba(0,240,255,0.2); }

        .loading-state { text-align: center; padding: 2rem; color: var(--text-secondary); }
        .loading-state i { font-size: 2rem; margin-bottom: 0.5rem; display: block; animation: spin 1s linear infinite; color: var(--accent); }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 2rem; color: var(--text-secondary); }
        .empty-state i { font-size: 2.5rem; display: block; margin-bottom: 0.5rem; opacity: 0.3; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--nav-bg); border-top: var(--anodized-border); padding: 0.5rem 0 1rem 0; max-width: 500px; margin: 0 auto; display: flex; justify-content: space-around; backdrop-filter: blur(20px); z-index: 100; box-shadow: 0 -10px 40px rgba(0,0,0,0.3); }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: var(--text-muted); font-size: 0.6rem; transition: color 0.2s; padding: 0.25rem 0.5rem; }
        .nav-item i { font-size: 1.2rem; }
        .nav-item.active { color: var(--accent); text-shadow: 0 0 20px rgba(0,240,255,0.3); }
        .nav-item:active { transform: scale(0.95); }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 2000; display: none; justify-content: center; align-items: center; padding: 1rem; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--bg-secondary); border: var(--anodized-border); border-radius: 1.5rem; padding: 1.5rem; max-width: 450px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.5), var(--anodized-glow); animation: modalIn 0.3s ease; }
        @keyframes modalIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: var(--anodized-border); }
        .modal-header h3 { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); }
        .modal-header h3 i { color: var(--accent); margin-right: 0.5rem; }
        .modal-close { background: var(--bg-card); border: var(--anodized-border); color: var(--text-secondary); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
        .modal-close:active { transform: scale(0.9); }
        .modal-body .detail-row { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid var(--border-soft); }
        .modal-body .detail-row:last-child { border-bottom: none; }
        .modal-body .detail-row .label { color: var(--text-secondary); font-size: 0.75rem; }
        .modal-body .detail-row .value { color: var(--text-primary); font-weight: 600; font-size: 0.85rem; text-align: right; }
        .modal-body .detail-row .value.balance { color: var(--accent); font-size: 1rem; }
        .modal-body .detail-row .value.utr-value { color: var(--warning); font-family: monospace; font-weight: 700; }
        .modal-body .detail-row .value.id-value { font-family: monospace; font-size: 0.8rem; }
        .modal-footer { display: flex; gap: 0.5rem; margin-top: 1rem; padding-top: 0.75rem; border-top: var(--anodized-border); justify-content: flex-end; flex-wrap: wrap; }
        .modal-footer button { padding: 0.5rem 1.2rem; border-radius: 0.75rem; border: none; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif; }
        .modal-footer button:active { transform: scale(0.95); }
        .modal-footer .btn-cancel { background: var(--bg-card); color: var(--text-secondary); border: var(--anodized-border); }
        .modal-footer .btn-confirm { background: var(--accent-gradient); color: #fff; box-shadow: 0 4px 20px rgba(0,240,255,0.3); }
        .modal-footer .btn-danger { background: var(--danger); color: #fff; box-shadow: 0 4px 20px rgba(239,68,68,0.3); }

        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .deposit-item .deposit-header { flex-direction: column; }
            .deposit-item .deposit-right { width: 100%; display: flex; justify-content: space-between; margin-top: 0.3rem; }
        }
    </style>
</head>
<body>

    <div id="particles"></div>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-logo"><i class="fas fa-shield-alt"></i> Aᴅᴍɪɴ</span>
            <button class="sidebar-close" onclick="closeSidebar()"><i class="fas fa-times"></i></button>
        </div>
        <div class="sidebar-user">
            <div class="user-avatar" id="sidebarAvatar">A</div>
            <div class="user-info">
                <div class="user-name" id="sidebarName">Aᴅᴍɪɴ</div>
                <div class="user-role"><i class="fas fa-bolt"></i> Sᴜᴘᴇʀ Aᴅᴍɪɴ</div>
            </div>
        </div>
        <div class="sidebar-menu">
            <div class="menu-label">Mᴀɪɴ Mᴇɴᴜ</div>
            <a href="/rohit" class="menu-item"><i class="fas fa-chart-pie"></i><span>Dᴀꜱʜʙᴏᴀʀᴅ</span></a>
            <a href="/admin-deposit" class="menu-item active"><i class="fas fa-coins"></i><span>Dᴇᴘᴏꜱɪᴛꜱ</span></a>
            <a href="/admin-withdraw" class="menu-item"><i class="fas fa-arrow-up"></i><span>Wɪᴛʜᴅʀᴀᴡᴀʟꜱ</span></a>
            <a href="/admin-users" class="menu-item"><i class="fas fa-users"></i><span>Uꜱᴇʀꜱ</span></a>
            <button class="menu-item logout" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i><span>Lᴏɢᴏᴜᴛ</span></button>
        </div>
    </div>

    <div class="content-wrapper">
        <header class="header">
            <div class="header-left">
                <button class="menu-btn" onclick="toggleSidebar()"><i class="fas fa-bolt"></i></button>
                <span class="header-logo">Dᴇᴘᴏꜱɪᴛ Mɢᴍᴛ</span>
            </div>
            <div class="header-right">
                <span class="admin-badge"><i class="fas fa-bolt"></i> Aᴅᴍɪɴ</span>
                <div class="admin-avatar" onclick="toggleSidebar()" title="Menu"><i class="fas fa-user"></i></div>
            </div>
        </header>

        <div class="container">
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="stat-number total" id="totalDeposits">0</div>
                    <div class="stat-label">Tᴏᴛᴀʟ</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number pending" id="pendingDeposits">0</div>
                    <div class="stat-label">Pᴇɴᴅɪɴɢ</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number completed" id="approvedDeposits">0</div>
                    <div class="stat-label">Aᴘᴘʀᴏᴠᴇᴅ</div>
                </div>
            </div>

            <div class="filter-section">
                <div class="filter-tabs">
                    <button class="active" data-filter="all" onclick="filterDeposits('all')">Aʟʟ</button>
                    <button data-filter="pending_approval" onclick="filterDeposits('pending_approval')">⏳ Aᴘᴘʀᴏᴠᴀʟ</button>
                    <button data-filter="pending" onclick="filterDeposits('pending')">⏳ Pᴇɴᴅɪɴɢ</button>
                    <button data-filter="approved" onclick="filterDeposits('approved')">✅ Aᴘᴘʀᴏᴠᴇᴅ</button>
                    <button data-filter="rejected" onclick="filterDeposits('rejected')">❌ Rᴇᴊᴇᴄᴛᴇᴅ</button>
                </div>
            </div>

            <div id="depositList">
                <div class="loading-state">
                    <i class="fas fa-bolt"></i>
                    <p>Lᴏᴀᴅɪɴɢ ᴅᴇᴘᴏꜱɪᴛꜱ...</p>
                </div>
            </div>

            <div class="pagination" id="pagination">
                <button onclick="changePage('prev')" id="prevPage" disabled><i class="fas fa-chevron-left"></i></button>
                <span class="page-info" id="pageInfo">Pᴀɢᴇ 1 ᴏꜰ 1</span>
                <button onclick="changePage('next')" id="nextPage" disabled><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>

        <div class="bottom-nav">
            <a href="/rohit" class="nav-item"><i class="fas fa-bolt"></i><span>Dᴀꜱʜ</span></a>
            <a href="/admin-deposit" class="nav-item active"><i class="fas fa-coins"></i><span>Dᴇᴘᴏꜱɪᴛ</span></a>
            <a href="/admin-withdraw" class="nav-item"><i class="fas fa-arrow-up"></i><span>Wɪᴛʜᴅʀᴀᴡ</span></a>
            <a href="/admin-users" class="nav-item"><i class="fas fa-users"></i><span>Uꜱᴇʀꜱ</span></a>
            <a href="#" class="nav-item"><i class="fas fa-user-cog"></i><span>Sᴇᴛᴛɪɴɢꜱ</span></a>
        </div>
    </div>

    <div class="modal-overlay" id="userModal">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="fas fa-coins"></i> <span id="modalTitle">Dᴇᴘᴏꜱɪᴛ Dᴇᴛᴀɪʟꜱ</span></h3>
                <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeModal()">Cʟᴏꜱᴇ</button>
                <button class="btn-confirm" id="modalApproveBtn" style="display:none;" onclick="modalApprove()">✅ Aᴘᴘʀᴏᴠᴇ</button>
                <button class="btn-danger" id="modalRejectBtn" style="display:none;" onclick="modalReject()">❌ Rᴇᴊᴇᴄᴛ</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let state = {
            deposits: [],
            currentPage: 1,
            limit: 20,
            totalPages: 1,
            totalDeposits: 0,
            filter: 'all',
            currentDepositId: null
        };

        function createElectronParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.className = 'electron-particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (8 + Math.random() * 15) + 's';
                p.style.animationDelay = Math.random() * 15 + 's';
                const size = 2 + Math.random() * 8;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.classList.add(size > 5 ? 'big' : 'small');
                container.appendChild(p);
            }
        }

        function getToken() { return localStorage.getItem('adminToken') || localStorage.getItem('token'); }

        function checkAuth() {
            const token = getToken();
            if (!token) { window.location.href = 'admin.html'; return false; }
            return true;
        }

        function handleLogout() {
            if (confirm('Aʀᴇ ʏᴏᴜ ꜱᴜʀᴇ ʏᴏᴜ ᴡᴀɴᴛ ᴛᴏ ʟᴏɢᴏᴜᴛ?')) {
                localStorage.removeItem('adminToken');
                localStorage.removeItem('token');
                localStorage.removeItem('adminData');
                window.location.href = 'admin.html';
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }

        document.addEventListener('click', function(e) {
            const s = document.getElementById('sidebar');
            const btn = document.querySelector('.menu-btn');
            if (s.classList.contains('open') && !s.contains(e.target) && !btn.contains(e.target)) {
                closeSidebar();
            }
        });

        async function apiCall(endpoint, options = {}) {
            const token = getToken();
            if (!token) { window.location.href = 'admin.html'; throw new Error('Nᴏᴛ ᴀᴜᴛʜᴇɴᴛɪᴄᴀᴛᴇᴅ'); }

            const defaultOptions = {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            };

            try {
                const response = await fetch(endpoint, { ...defaultOptions, ...options });
                const data = await response.json();

                if (!response.ok) {
                    if (response.status === 401) {
                        localStorage.removeItem('adminToken');
                        localStorage.removeItem('token');
                        localStorage.removeItem('adminData');
                        window.location.href = 'admin.html';
                        throw new Error('Sᴇꜱꜱɪᴏɴ ᴇxᴘɪʀᴇᴅ');
                    }
                    throw new Error(data.message || 'Sᴏᴍᴇᴛʜɪɴɢ ᴡᴇɴᴛ ᴡʀᴏɴɢ');
                }
                return data;
            } catch (error) {
                console.error('API Eʀʀᴏʀ:', error);
                showToast(error.message, 'error');
                throw error;
            }
        }

        async function fetchDeposits() {
            if (!checkAuth()) return;

            const listEl = document.getElementById('depositList');
            listEl.innerHTML = `
                <div class="loading-state">
                    <i class="fas fa-bolt"></i>
                    <p>Lᴏᴀᴅɪɴɢ ᴅᴇᴘᴏꜱɪᴛꜱ...</p>
                </div>
            `;

            try {
                let url = `/api/admin/deposits?page=${state.currentPage}&limit=${state.limit}`;
                if (state.filter !== 'all') {
                    url += `&status=${state.filter}`;
                }

                const data = await apiCall(url);
                state.deposits = data.deposits || [];
                state.totalDeposits = data.pagination?.total || 0;
                state.totalPages = data.pagination?.totalPages || 1;

                renderDeposits();
                renderPagination();
                fetchStats();

            } catch (error) {
                listEl.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Fᴀɪʟᴇᴅ ᴛᴏ ʟᴏᴀᴅ ᴅᴇᴘᴏꜱɪᴛꜱ</p>
                        <button onclick="fetchDeposits()" style="margin-top:0.75rem;padding:0.5rem 1.5rem;background:var(--bg-card);border:var(--anodized-border);border-radius:0.75rem;color:var(--accent);cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;">
                            <i class="fas fa-redo"></i> Rᴇᴛʀʏ
                        </button>
                    </div>
                `;
            }
        }

        async function fetchStats() {
            try {
                const data = await apiCall('/api/admin/stats');
                const stats = data.stats || {};
                document.getElementById('totalDeposits').textContent = (stats.approvedDeposits || 0) + (stats.pendingDeposits || 0) + (stats.rejectedDeposits || 0);
                document.getElementById('pendingDeposits').textContent = stats.pendingDeposits || 0;
                document.getElementById('approvedDeposits').textContent = stats.approvedDeposits || 0;
            } catch (error) {
                console.error('Fᴀɪʟᴇᴅ ᴛᴏ ꜰᴇᴛᴄʜ ꜱᴛᴀᴛꜱ:', error);
            }
        }

        function renderDeposits() {
            const listEl = document.getElementById('depositList');

            if (!state.deposits || state.deposits.length === 0) {
                listEl.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-coins"></i>
                        <p>Nᴏ ᴅᴇᴘᴏꜱɪᴛꜱ ꜰᴏᴜɴᴅ</p>
                        <p style="font-size:0.7rem;color:var(--text-muted);margin-top:0.25rem;">Tʀʏ ᴄʜᴀɴɢɪɴɢ ᴛʜᴇ ꜰɪʟᴛᴇʀ</p>
                    </div>
                `;
                return;
            }

            let html = '';
            state.deposits.forEach(deposit => {
                const status = deposit.status || 'pending';
                const userName = deposit.userId?.fullName || 'Uɴᴋɴᴏᴡɴ';
                const userMobile = deposit.userId?.mobile || 'N/A';
                const userWallet = deposit.userId?.walletId || 'N/A';
                const time = new Date(deposit.createdAt).toLocaleString('en-IN', { 
                    day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' 
                });
                
                const isAuto = deposit.depositId && deposit.depositId.startsWith('PAY_');
                const depositTypeLabel = isAuto ? '🤖 Aᴜᴛᴏ' : '📝 Mᴀɴᴜᴀʟ';
                const depositTypeClass = isAuto ? 'auto' : 'manual';
                
                let statusDisplay = status;
                let statusClass = status;
                if (status === 'pending_approval') {
                    statusDisplay = '⏳ Pᴇɴᴅɪɴɢ Aᴘᴘʀᴏᴠᴀʟ';
                    statusClass = 'pending_approval';
                } else if (status === 'pending') {
                    statusDisplay = '⏳ Pᴇɴᴅɪɴɢ';
                    statusClass = 'pending';
                } else if (status === 'approved' || status === 'completed') {
                    statusDisplay = '✅ Aᴘᴘʀᴏᴠᴇᴅ';
                    statusClass = 'approved';
                } else if (status === 'rejected') {
                    statusDisplay = '❌ Rᴇᴊᴇᴄᴛᴇᴅ';
                    statusClass = 'rejected';
                } else if (status === 'cancelled') {
                    statusDisplay = '🚫 Cᴀɴᴄᴇʟʟᴇᴅ';
                    statusClass = 'cancelled';
                } else if (status === 'expired') {
                    statusDisplay = '⏰ Exᴘɪʀᴇᴅ';
                    statusClass = 'expired';
                }

                let displayId = deposit.depositId || deposit._id?.slice(-8) || 'N/A';
                let idLabel = isAuto ? 'Pᴀʏᴍᴇɴᴛ Iᴅ' : 'Dᴇᴘᴏꜱɪᴛ Iᴅ';
                const utrNumber = deposit.utr_number || deposit.transactionRef || null;

                // ✅ SHOW APPROVE/REJECT BUTTONS FOR pending_approval AND pending status
                const showActions = status === 'pending_approval' || status === 'pending';

                html += `
                    <div class="deposit-item">
                        <div class="deposit-header">
                            <div>
                                <div class="deposit-user">
                                    ${userName}
                                    <span class="deposit-type-badge ${depositTypeClass}">${depositTypeLabel}</span>
                                </div>
                                <div class="deposit-details">
                                    <span><i class="fas fa-phone"></i> ${userMobile}</span>
                                    <span><i class="fas fa-id-card"></i> ${userWallet}</span>
                                    <span><i class="fas fa-hashtag"></i> ${idLabel}: ${displayId}</span>
                                    ${utrNumber ? `<span><i class="fas fa-receipt utr-highlight"></i> <span class="utr-highlight">UTR: ${utrNumber}</span></span>` : ''}
                                </div>
                            </div>
                            <div class="deposit-right">
                                <div class="deposit-amount">₹${(deposit.amount || 0).toFixed(2)}</div>
                                <div style="display:flex;align-items:center;gap:0.5rem;justify-content:flex-end;">
                                    <span class="deposit-status ${statusClass}">${statusDisplay}</span>
                                    <span style="font-size:0.55rem;color:var(--text-muted);">${time}</span>
                                </div>
                            </div>
                        </div>
                        ${showActions ? `
                            <div class="deposit-actions">
                                <button class="btn-approve" onclick="verifyDeposit('${deposit._id}', 'approve')">
                                    <i class="fas fa-check"></i> Aᴘᴘʀᴏᴠᴇ
                                </button>
                                <button class="btn-reject" onclick="verifyDeposit('${deposit._id}', 'reject')">
                                    <i class="fas fa-times"></i> Rᴇᴊᴇᴄᴛ
                                </button>
                                <button class="btn-view" onclick="viewDeposit('${deposit._id}')">
                                    <i class="fas fa-eye"></i> Vɪᴇᴡ
                                </button>
                            </div>
                        ` : `
                            <div class="deposit-actions">
                                <button class="btn-view" onclick="viewDeposit('${deposit._id}')">
                                    <i class="fas fa-eye"></i> Vɪᴇᴡ
                                </button>
                            </div>
                        `}
                        ${deposit.adminNote ? `
                            <div style="margin-top:0.4rem;padding-top:0.4rem;border-top:1px solid var(--border-soft);font-size:0.6rem;color:var(--text-muted);">
                                <i class="fas fa-sticky-note"></i> ${deposit.adminNote}
                            </div>
                        ` : ''}
                        ${deposit.adminNotes ? `
                            <div style="margin-top:0.4rem;padding-top:0.4rem;border-top:1px solid var(--border-soft);font-size:0.6rem;color:var(--text-muted);">
                                <i class="fas fa-sticky-note"></i> ${deposit.adminNotes}
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            listEl.innerHTML = html;
        }

        function renderPagination() {
            document.getElementById('pageInfo').textContent = `Pᴀɢᴇ ${state.currentPage} ᴏꜰ ${state.totalPages || 1}`;
            document.getElementById('prevPage').disabled = state.currentPage <= 1;
            document.getElementById('nextPage').disabled = state.currentPage >= state.totalPages;
        }

        function changePage(direction) {
            if (direction === 'prev' && state.currentPage > 1) {
                state.currentPage--;
            } else if (direction === 'next' && state.currentPage < state.totalPages) {
                state.currentPage++;
            } else {
                return;
            }
            fetchDeposits();
        }

        function filterDeposits(filter) {
            state.filter = filter;
            state.currentPage = 1;

            document.querySelectorAll('.filter-tabs button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`.filter-tabs button[data-filter="${filter}"]`).classList.add('active');

            fetchDeposits();
        }

        async function verifyDeposit(depositId, action) {
            const actionText = action === 'approve' ? 'Aᴘᴘʀᴏᴠᴇ' : 'Rᴇᴊᴇᴄᴛ';
            if (!confirm(`Cᴏɴꜰɪʀᴍ ${actionText} ᴛʜɪꜱ ᴅᴇᴘᴏꜱɪᴛ?`)) return;

            const notes = prompt(`Eɴᴛᴇʀ ɴᴏᴛᴇꜱ ꜰᴏʀ ${actionText} (Oᴘᴛɪᴏɴᴀʟ):`);

            try {
                const data = await apiCall('/api/admin/verify-deposit', {
                    method: 'POST',
                    body: JSON.stringify({
                        depositId,
                        action,
                        adminNotes: notes || `${actionText}ᴅ ʙʏ ᴀᴅᴍɪɴ`
                    })
                });

                showToast(data.message, 'success');
                fetchDeposits();

            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        function viewDeposit(depositId) {
            const deposit = state.deposits.find(d => d._id === depositId);
            if (!deposit) {
                showToast('Dᴇᴘᴏꜱɪᴛ ɴᴏᴛ ꜰᴏᴜɴᴅ', 'error');
                return;
            }

            state.currentDepositId = depositId;

            const userName = deposit.userId?.fullName || 'Uɴᴋɴᴏᴡɴ';
            const userMobile = deposit.userId?.mobile || 'N/A';
            const userWallet = deposit.userId?.walletId || 'N/A';
            
            const isAuto = deposit.depositId && deposit.depositId.startsWith('PAY_');
            const idLabel = isAuto ? 'Pᴀʏᴍᴇɴᴛ Iᴅ' : 'Dᴇᴘᴏꜱɪᴛ Iᴅ';
            const typeLabel = isAuto ? '🤖 Aᴜᴛᴏ' : '📝 Mᴀɴᴜᴀʟ';

            let statusDisplay = deposit.status;
            if (deposit.status === 'pending_approval') statusDisplay = '⏳ Pᴇɴᴅɪɴɢ Aᴘᴘʀᴏᴠᴀʟ';
            else if (deposit.status === 'pending') statusDisplay = '⏳ Pᴇɴᴅɪɴɢ';
            else if (deposit.status === 'approved' || deposit.status === 'completed') statusDisplay = '✅ Aᴘᴘʀᴏᴠᴇᴅ';
            else if (deposit.status === 'rejected') statusDisplay = '❌ Rᴇᴊᴇᴄᴛᴇᴅ';
            else if (deposit.status === 'cancelled') statusDisplay = '🚫 Cᴀɴᴄᴇʟʟᴇᴅ';
            else if (deposit.status === 'expired') statusDisplay = '⏰ Exᴘɪʀᴇᴅ';

            const utrNumber = deposit.utr_number || deposit.transactionRef || null;
            const txId = deposit.tx_id || null;

            const modalBody = document.getElementById('modalBody');
            const modalTitle = document.getElementById('modalTitle');
            const approveBtn = document.getElementById('modalApproveBtn');
            const rejectBtn = document.getElementById('modalRejectBtn');

            modalTitle.textContent = `💳 ${idLabel}: ${deposit.depositId || deposit._id?.slice(-8) || 'N/A'}`;

            // Show approve/reject buttons if pending_approval or pending
            if (deposit.status === 'pending_approval' || deposit.status === 'pending') {
                approveBtn.style.display = 'inline-flex';
                rejectBtn.style.display = 'inline-flex';
                approveBtn.onclick = () => { closeModal(); verifyDeposit(depositId, 'approve'); };
                rejectBtn.onclick = () => { closeModal(); verifyDeposit(depositId, 'reject'); };
            } else {
                approveBtn.style.display = 'none';
                rejectBtn.style.display = 'none';
            }

            modalBody.innerHTML = `
                <div class="detail-row"><span class="label">Tʏᴘᴇ</span><span class="value">${typeLabel}</span></div>
                <div class="detail-row"><span class="label">Uꜱᴇʀ</span><span class="value">${userName}</span></div>
                <div class="detail-row"><span class="label">Mᴏʙɪʟᴇ</span><span class="value">${userMobile}</span></div>
                <div class="detail-row"><span class="label">Wᴀʟʟᴇᴛ Iᴅ</span><span class="value">${userWallet}</span></div>
                <div class="detail-row"><span class="label">Aᴍᴏᴜɴᴛ</span><span class="value balance">₹${(deposit.amount || 0).toFixed(2)}</span></div>
                <div class="detail-row"><span class="label">${idLabel}</span><span class="value id-value">${deposit.depositId || 'N/A'}</span></div>
                <div class="detail-row"><span class="label">Sᴛᴀᴛᴜꜱ</span><span class="value"><span class="deposit-status ${deposit.status}">${statusDisplay}</span></span></div>
                ${utrNumber ? `<div class="detail-row"><span class="label">Uᴛʀ Nᴜᴍʙᴇʀ</span><span class="value utr-value">${utrNumber}</span></div>` : ''}
                ${txId ? `<div class="detail-row"><span class="label">Tʀᴀɴꜱᴀᴄᴛɪᴏɴ Iᴅ</span><span class="value id-value">${txId}</span></div>` : ''}
                ${deposit.adminNote ? `<div class="detail-row"><span class="label">Aᴅᴍɪɴ Nᴏᴛᴇ</span><span class="value" style="font-size:0.75rem;">${deposit.adminNote}</span></div>` : ''}
                ${deposit.adminNotes ? `<div class="detail-row"><span class="label">Aᴅᴍɪɴ Nᴏᴛᴇꜱ</span><span class="value" style="font-size:0.75rem;">${deposit.adminNotes}</span></div>` : ''}
                <div class="detail-row"><span class="label">Cʀᴇᴀᴛᴇᴅ</span><span class="value">${new Date(deposit.createdAt).toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</span></div>
                ${deposit.approvedAt ? `<div class="detail-row"><span class="label">Aᴘᴘʀᴏᴠᴇᴅ Aᴛ</span><span class="value" style="color:var(--success);">${new Date(deposit.approvedAt).toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}</span></div>` : ''}
                ${deposit.rejectedAt ? `<div class="detail-row"><span class="label">Rᴇᴊᴇᴄᴛᴇᴅ Aᴛ</span><span class="value" style="color:var(--danger);">${new Date(deposit.rejectedAt).toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}</span></div>` : ''}
                ${deposit.expiresAt ? `<div class="detail-row"><span class="label">Exᴘɪʀᴇꜱ</span><span class="value" style="color:var(--warning);">${new Date(deposit.expiresAt).toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}</span></div>` : ''}
            `;

            document.getElementById('userModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('userModal').classList.remove('active');
            document.getElementById('modalApproveBtn').style.display = 'none';
            document.getElementById('modalRejectBtn').style.display = 'none';
        }

        document.getElementById('userModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.className = 'toast', 3500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            createElectronParticles();
            if (checkAuth()) fetchDeposits();
        });

        console.log('⚡ Dᴇᴘᴏꜱɪᴛ Mᴀɴᴀɢᴇᴍᴇɴᴛ Lᴏᴀᴅᴇᴅ');
    </script>
</body>
</html>
