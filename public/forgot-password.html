<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password • Universal Wallet</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- ✅ PWA META TAGS -->
<link rel="manifest" href="/site.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/universe-wallet-logo-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/universe-wallet-logo-512.png">
<link rel="apple-touch-icon" href="/universe-wallet-logo-192.png">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Universe">

<style>
/* ============================================
   ✅ THEME VARIABLES (LIGHT)
   ============================================ */
:root {
    --bg-1: #ffffff;
    --bg-2: #e8f0fe;
    --bg-3: #d4e4f7;
    --grid-color: rgba(26, 86, 219, 0.03);
    --text: #1a2a4a;
    --text-title: #1a2a4a;
    --muted: #5a7a9a;
    --muted-2: #8a9ab0;
    --brand-span: #1a56db;
    --brand-icon-bg: linear-gradient(135deg, #1a56db, #0088ff);
    --card-bg: #ffffff;
    --card-border: #c5d9f0;
    --card-shadow: 0 10px 40px rgba(0, 50, 100, 0.12);
    --input-bg: #fafcff;
    --input-border: #c5d9f0;
    --input-focus-bg: #ffffff;
    --input-text: #1a2a4a;
    --input-placeholder: #8a9ab0;
    --label-color: #5a7a9a;
    --icon-color: #1a56db;
    --btn-bg: linear-gradient(135deg, #1a56db, #0088ff);
    --btn-shadow: 0 4px 12px rgba(26, 86, 219, 0.3);
    --step-dot-bg: #c5d9f0;
    --step-dot-active: #1a56db;
    --step-dot-completed: #16a34a;
    --id-toggle-bg: #fafcff;
    --id-toggle-border: #c5d9f0;
    --id-toggle-color: #5a7a9a;
    --id-toggle-active-bg: linear-gradient(135deg, #1a56db, #0088ff);
    --green-bg: #f0fdf4;
    --green-border: #86efac;
    --green-color: #16a34a;
    --green-hover: #dcfce7;
    --password-rules-bg: #f0f5fb;
    --password-rules-border: #c5d9f0;
    --password-rule-color: #5a7a9a;
    --password-rule-valid: #16a34a;
    --msg-error-bg: #fee2e2;
    --msg-error-color: #991b1b;
    --msg-error-border: #dc2626;
    --msg-success-bg: #dcfce7;
    --msg-success-color: #166534;
    --msg-success-border: #16a34a;
    --toast-info-bg: #1a56db;
    --toast-success-bg: #16a34a;
    --toast-error-bg: #dc2626;
    --toast-color: #ffffff;
    --back-color: #1a56db;
    --theme-btn-bg: #ffffff;
    --theme-btn-border: #c5d9f0;
    --theme-btn-color: #1a56db;
    --blocked-bg-1: #ffffff;
    --blocked-bg-2: #e8f0fe;
    --blocked-bg-3: #d4e4f7;
    --blocked-card-bg: #ffffff;
    --blocked-card-border: #c5d9f0;
    --blocked-title: #1a3a6b;
    --blocked-sub: #5a7a9a;
}

/* ============================================
   ✅ THEME VARIABLES (DARK)
   ============================================ */
body.dark {
    --bg-1: #0d1526;
    --bg-2: #0d1526;
    --bg-3: #1a2639;
    --grid-color: rgba(90, 120, 170, 0.06);
    --text: #edf3ff;
    --text-title: #edf3ff;
    --muted: #8491a6;
    --muted-2: #8491a6;
    --brand-span: #60a5fa;
    --brand-icon-bg: linear-gradient(135deg, #1a56db, #0088ff);
    --card-bg: #1a2639;
    --card-border: #2b3a50;
    --card-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    --input-bg: #101a2c;
    --input-border: #2b3a50;
    --input-focus-bg: #1a2639;
    --input-text: #edf3ff;
    --input-placeholder: #8491a6;
    --label-color: #8491a6;
    --icon-color: #60a5fa;
    --btn-bg: linear-gradient(135deg, #1a56db, #0088ff);
    --btn-shadow: 0 4px 12px rgba(26, 86, 219, 0.4);
    --step-dot-bg: #2b3a50;
    --step-dot-active: #60a5fa;
    --step-dot-completed: #10c993;
    --id-toggle-bg: #101a2c;
    --id-toggle-border: #2b3a50;
    --id-toggle-color: #8491a6;
    --id-toggle-active-bg: linear-gradient(135deg, #1a56db, #0088ff);
    --green-bg: #12352f;
    --green-border: #10c993;
    --green-color: #10c993;
    --green-hover: #1a4a3f;
    --password-rules-bg: #101a2c;
    --password-rules-border: #2b3a50;
    --password-rule-color: #8491a6;
    --password-rule-valid: #10c993;
    --msg-error-bg: #3a2025;
    --msg-error-color: #f87171;
    --msg-error-border: #f87171;
    --msg-success-bg: #12352f;
    --msg-success-color: #10c993;
    --msg-success-border: #10c993;
    --toast-info-bg: #1a56db;
    --toast-success-bg: #16a34a;
    --toast-error-bg: #dc2626;
    --toast-color: #ffffff;
    --back-color: #60a5fa;
    --theme-btn-bg: #202d42;
    --theme-btn-border: #2b3a50;
    --theme-btn-color: #cbd5e1;
    --blocked-bg-1: #0d1526;
    --blocked-bg-2: #1a2639;
    --blocked-bg-3: #202d42;
    --blocked-card-bg: #1a2639;
    --blocked-card-border: #2b3a50;
    --blocked-title: #edf3ff;
    --blocked-sub: #8491a6;
}

/* ============================================
   RESET
   ============================================ */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%); padding: 20px; position: relative; overflow: hidden; color: var(--text); transition: background .3s ease, color .3s ease; }
body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px); background-size: 50px 50px; pointer-events: none; z-index: 0; }

/* ============================================
   ✅ DISABLE TEXT SELECTION & LONG PRESS MENU
   ============================================ */
* {
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}
input, textarea, select, [contenteditable="true"] {
    -webkit-user-select: text !important;
    -moz-user-select: text !important;
    -ms-user-select: text !important;
    user-select: text !important;
    -webkit-touch-callout: default !important;
}
img {
    -webkit-user-drag: none;
    user-drag: none;
}

/* ============================================
   THEME TOGGLE BUTTON
   ============================================ */
.theme-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--theme-btn-bg);
    border: 1.5px solid var(--theme-btn-border);
    color: var(--theme-btn-color);
    font-size: 17px;
    cursor: pointer;
    z-index: 100;
    transition: all 0.25s ease;
    box-shadow: 0 4px 15px rgba(26, 86, 219, 0.15);
}
.theme-btn:hover {
    transform: rotate(20deg) scale(1.08);
    border-color: #1a56db;
    color: #1a56db;
}
.theme-btn:active { transform: scale(0.95); }

/* ============================================
   WRAPPER
   ============================================ */
.wrapper { z-index: 2; position: relative; width: 100%; max-width: 400px; }
.brand-header { text-align: center; margin-bottom: 28px; }
.brand-logo { width: 78px; height: 78px; border-radius: 22px; background: var(--brand-icon-bg); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 34px; margin: 0 auto 14px; box-shadow: 0 4px 15px rgba(26, 86, 219, 0.3); }
.brand-title { font-size: 30px; font-weight: 800; color: var(--text-title); letter-spacing: -0.5px; }
.brand-title span { color: var(--brand-span); }
.brand-subtitle { font-size: 11px; letter-spacing: 3px; color: var(--muted); margin-top: 6px; font-weight: 600; text-transform: uppercase; }
.brand-subtitle i { color: var(--icon-color); margin: 0 4px; }
.brand-divider { height: 3px; border-radius: 10px; background: linear-gradient(to right, #1a56db, #0088ff); margin-top: 14px; width: 60%; margin-left: auto; margin-right: auto; }
.card { background: var(--card-bg); padding: 28px; border-radius: 24px; box-shadow: var(--card-shadow); border: 1px solid var(--card-border); transition: background .3s ease, border .3s ease, box-shadow .3s ease; }
.forgot-header { text-align: center; margin-bottom: 20px; }
.forgot-title { font-size: 22px; font-weight: 800; color: var(--text-title); text-transform: uppercase; letter-spacing: 0.5px; }
.forgot-title i { color: var(--icon-color); margin-right: 4px; }
.forgot-subtitle { font-size: 12px; color: var(--muted); margin-top: 6px; font-weight: 600; }
.step-indicator { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; }
.step-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--step-dot-bg); opacity: 0.5; transition: all 0.3s ease; }
.step-dot.active { opacity: 1; background: var(--step-dot-active); transform: scale(1.3); box-shadow: 0 0 10px rgba(26, 86, 219, 0.4); }
.step-dot.completed { opacity: 0.8; background: var(--step-dot-completed); }
.identifier-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
.id-toggle-btn { flex: 1; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--id-toggle-border); background: var(--id-toggle-bg); font-size: 12px; font-weight: 800; cursor: pointer; transition: all 0.3s ease; color: var(--id-toggle-color); text-transform: uppercase; letter-spacing: 0.5px; font-family: inherit; }
.id-toggle-btn:hover { background: var(--password-rules-bg); }
.id-toggle-btn.active { border-color: #1a56db; background: var(--id-toggle-active-bg); color: #ffffff; box-shadow: 0 4px 12px rgba(26, 86, 219, 0.3); }
.id-toggle-btn i { margin-right: 4px; }
.group { margin-top: 16px; }
label { font-size: 12px; font-weight: 800; letter-spacing: 1px; color: var(--label-color); display: flex; align-items: center; gap: 6px; margin-bottom: 6px; text-transform: uppercase; }
label i { color: var(--icon-color); }
input { width: 100%; margin-top: 0; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--input-border); outline: none; background: var(--input-bg); font-size: 15px; font-weight: 500; color: var(--input-text); transition: all 0.2s; font-family: inherit; }
input::placeholder { color: var(--input-placeholder); }
input:focus { background: var(--input-focus-bg); border-color: #1a56db; box-shadow: 0 0 0 4px rgba(26, 86, 219, 0.1); }
.password-wrapper { position: relative; width: 100%; }
.password-wrapper input { padding-right: 45px; }
.password-eye { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--muted-2); transition: color 0.3s ease; z-index: 5; background: transparent; border: none; font-size: 16px; display: flex; align-items: center; justify-content: center; padding: 5px; }
.password-eye:hover { color: var(--icon-color); }
.btn { margin-top: 24px; width: 100%; padding: 16px; border-radius: 20px; border: none; color: #fff; font-weight: 800; font-size: 15px; cursor: pointer; background: var(--btn-bg); transition: transform 0.2s, box-shadow 0.2s; box-shadow: var(--btn-shadow); display: flex; align-items: center; justify-content: center; gap: 10px; text-transform: uppercase; letter-spacing: 0.5px; font-family: inherit; }
.btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(26, 86, 219, 0.4); }
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.row { display: flex; gap: 12px; align-items: center; }
.green { background: var(--green-bg); border: 2px solid var(--green-border); padding: 12px 16px; border-radius: 14px; font-size: 12px; font-weight: 800; cursor: pointer; text-align: center; white-space: nowrap; color: var(--green-color); transition: all 0.2s; display: flex; align-items: center; gap: 6px; height: 50px; min-width: 110px; justify-content: center; text-transform: uppercase; letter-spacing: 0.3px; font-family: inherit; }
.green:hover { background: var(--green-hover); }
.green:active { transform: scale(0.97); }
.green.disabled { opacity: 0.5; pointer-events: none; }
.timer { font-size: 11px; margin-top: 8px; color: var(--icon-color); font-weight: 700; text-align: center; letter-spacing: 0.3px; }
.hidden { display: none !important; }
.back { text-align: center; margin-top: 20px; font-size: 13px; font-weight: 700; color: var(--back-color); cursor: pointer; transition: opacity 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
.back:hover { opacity: 0.8; text-decoration: underline; }
.password-rules { margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: var(--password-rules-bg); display: none; border: 1px solid var(--password-rules-border); transition: background .3s ease, border .3s ease; }
.password-rules.show { display: block; }
.password-rule { font-size: 11px; font-weight: 600; padding: 4px 0; display: flex; align-items: center; gap: 8px; color: var(--password-rule-color); transition: color 0.2s ease; }
.password-rule i { width: 16px; font-size: 11px; }
.password-rule.valid i { color: var(--password-rule-valid); }
.password-rule.valid { color: var(--password-rule-valid); }
.msg { padding: 12px 16px; border-radius: 12px; font-size: 12px; font-weight: 700; text-align: center; margin-bottom: 12px; display: none; }
.msg.error { background: var(--msg-error-bg); color: var(--msg-error-color); border-left: 4px solid var(--msg-error-border); }
.msg.success { background: var(--msg-success-bg); color: var(--msg-success-color); border-left: 4px solid var(--msg-success-border); }
.msg i { margin-right: 6px; }
.msg.error, .msg.success { display: block; }

/* ============================================
   TOAST
   ============================================ */
.toast-message { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 9999; padding: 12px 24px; border-radius: 60px; color: var(--toast-color); font-weight: 700; font-size: 13px; max-width: 90%; text-align: center; animation: fadeInUp 0.3s ease; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); border: none; }
.toast-message.success { background: var(--toast-success-bg); border-left: 4px solid #22c55e; }
.toast-message.error { background: var(--toast-error-bg); border-left: 4px solid #ef4444; }
.toast-message.info { background: var(--toast-info-bg); border-left: 4px solid #60a5fa; }
@keyframes fadeInUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* ============================================
   BLOCKED OVERLAY
   ============================================ */
.blocked-overlay { position: fixed; inset: 0; z-index: 99999; background: linear-gradient(135deg, var(--blocked-bg-1) 0%, var(--blocked-bg-2) 50%, var(--blocked-bg-3) 100%); display: none; align-items: center; justify-content: center; padding: 20px; transition: background .3s ease; }
.blocked-overlay.active { display: flex; }
.blocked-card { background: var(--blocked-card-bg); border-radius: 24px; padding: 40px 30px; max-width: 420px; width: 100%; text-align: center; border: 1px solid var(--blocked-card-border); box-shadow: 0 20px 60px rgba(0, 50, 100, 0.2); animation: blockedIn 0.4s ease-out; transition: background .3s ease, border .3s ease; }
body.dark .blocked-card { box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
@keyframes blockedIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
.blocked-icon { width: 90px; height: 90px; border-radius: 24px; background: #fee2e2; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 42px; color: #dc2626; border: 2px solid #fca5a5; }
body.dark .blocked-icon { background: #3a2025; border-color: #7f1d1d; }
.blocked-title { font-size: 24px; font-weight: 900; color: var(--blocked-title); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
.blocked-sub { font-size: 14px; color: var(--blocked-sub); line-height: 1.6; margin-bottom: 24px; font-weight: 500; }
.blocked-btn { width: 100%; padding: 15px; border-radius: 16px; font-size: 14px; font-weight: 800; border: none; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; font-family: 'Inter', sans-serif; transition: all 0.2s; background: #1a56db; color: #ffffff; box-shadow: 0 4px 15px rgba(26, 86, 219, 0.3); display: flex; align-items: center; justify-content: center; gap: 8px; }
.blocked-btn:hover { background: #1a4ac0; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(26, 86, 219, 0.4); }
.blocked-btn:active { transform: scale(0.98); }

@media (max-width: 480px) {
    .card { padding: 20px; }
    .brand-title { font-size: 24px; }
    .forgot-title { font-size: 18px; }
    .brand-logo { width: 64px; height: 64px; font-size: 28px; }
    .green { min-width: 95px; padding: 10px 12px; font-size: 11px; }
    input { padding: 12px 14px; font-size: 14px; }
    .id-toggle-btn { font-size: 11px; padding: 8px 10px; }
    .btn { font-size: 14px; padding: 14px; }
    .theme-btn { width: 40px; height: 40px; font-size: 15px; top: 12px; right: 12px; }
}
</style>
</head>
<body>

<!-- =====================================================
     THEME TOGGLE BUTTON
===================================================== -->
<button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle Theme">
    <i class="fas fa-moon"></i>
</button>

<!-- =====================================================
     BLOCKED OVERLAY
===================================================== -->
<div class="blocked-overlay" id="blockedOverlay">
    <div class="blocked-card">
        <div class="blocked-icon"><i class="fas fa-user-slash"></i></div>
        <div class="blocked-title" id="blockedTitle">Access Denied</div>
        <div class="blocked-sub" id="blockedSub">Your account has been blocked or deleted. Please contact support.</div>
        <button class="blocked-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Back To Login</button>
    </div>
</div>

<div class="wrapper">
    <!-- BRAND HEADER -->
    <div class="brand-header">
        <div class="brand-logo"><i class="fas fa-wallet"></i></div>
        <div class="brand-title">UNIVERSAL <span>WALLET</span></div>
        <div class="brand-subtitle"><i class="fas fa-shield-alt"></i> SECURE • FAST • TRUSTED <i class="fas fa-shield-alt"></i></div>
        <div class="brand-divider"></div>
    </div>

    <!-- CARD -->
    <div class="card">
        <div class="forgot-header">
            <div class="forgot-title"><i class="fas fa-key"></i> Forgot Password</div>
            <div class="forgot-subtitle" id="stepSubtitle">Step 1: Verify Your Identity</div>
        </div>

        <div class="step-indicator">
            <div class="step-dot active" id="step1"></div>
            <div class="step-dot" id="step2"></div>
            <div class="step-dot" id="step3"></div>
        </div>

        <div id="msgContainer" class="msg"></div>

        <!-- STEP 1: VERIFY IDENTITY -->
        <div id="step1Container">
            <div class="identifier-toggle">
                <button class="id-toggle-btn active" id="mobileToggle" onclick="switchIdentifier('mobile')">
                    <i class="fas fa-phone"></i> MOBILE
                </button>
                <button class="id-toggle-btn" id="telegramToggle" onclick="switchIdentifier('telegram')">
                    <i class="fab fa-telegram"></i> TELEGRAM
                </button>
            </div>

            <div class="group">
                <label id="identifierLabel"><i class="fas fa-phone"></i> Mobile Number</label>
                <input id="identifierInput" placeholder="Enter Registered Mobile" inputmode="numeric" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
            </div>

            <div class="group">
                <label><i class="fas fa-shield-alt"></i> OTP</label>
                <div class="row">
                    <input id="otp" placeholder="Enter 6-Digit OTP" inputmode="numeric" maxlength="6" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                    <div id="otpBtn" class="green" onclick="sendOTP()">
                        <i class="fas fa-paper-plane"></i> Send OTP
                    </div>
                </div>
                <div id="timer" class="timer hidden"></div>
            </div>

            <button class="btn" id="verifyBtn" onclick="verifyOTP()">
                <i class="fas fa-check-circle"></i> Verify
            </button>
        </div>

        <!-- STEP 2: NEW PASSWORD -->
        <div id="step2Container" class="hidden">
            <div class="group">
                <label><i class="fas fa-lock"></i> New Password</label>
                <div class="password-wrapper">
                    <input id="password" type="password" placeholder="Create New Password" maxlength="15">
                    <button type="button" class="password-eye" onclick="togglePassword('password')">
                        <i class="fas fa-eye-slash"></i>
                    </button>
                </div>
                <div class="password-rules" id="passwordRules">
                    <div class="password-rule" id="rule-length"><i class="fas fa-circle"></i> <span>8 to 15 characters</span></div>
                    <div class="password-rule" id="rule-uppercase"><i class="fas fa-circle"></i> <span>Uppercase letter (A-Z)</span></div>
                    <div class="password-rule" id="rule-lowercase"><i class="fas fa-circle"></i> <span>Lowercase letter (a-z)</span></div>
                    <div class="password-rule" id="rule-number"><i class="fas fa-circle"></i> <span>Number (0-9)</span></div>
                </div>
            </div>

            <div class="group">
                <label><i class="fas fa-check-double"></i> Confirm Password</label>
                <div class="password-wrapper">
                    <input id="confirmPassword" type="password" placeholder="Confirm New Password" maxlength="15">
                    <button type="button" class="password-eye" onclick="togglePassword('confirmPassword')">
                        <i class="fas fa-eye-slash"></i>
                    </button>
                </div>
            </div>

            <button class="btn" id="saveBtn" onclick="savePassword()">
                <i class="fas fa-save"></i> Save Password
            </button>
        </div>

        <!-- BACK TO LOGIN -->
        <div class="back" onclick="window.location.href='/'">
            <i class="fas fa-arrow-left"></i> Back To Login
        </div>
    </div>
</div>

<script>
const API = "/api";
let cooldown = 0;
let interval = null;
let otpExpiryTimer = null;
let currentIdentifier = 'mobile';
let passwordTimeout = null;
let verifiedIdentifier = null;
let currentStep = 1;
let isAccountBlocked = false;
let blockCheckDone = false;

/* ============================================
   ✅ THEME SYSTEM — সব পেজে একই রকম কাজ করবে
   ============================================ */

/**
 * Theme apply করে body + documentElement এ
 * @param {string} theme - 'dark' অথবা 'light'
 */
function applyTheme(theme) {
    var isDark = (theme === 'dark');
    if (isDark) {
        document.body.classList.add('dark');
        document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme', 'dark');
    } else {
        document.body.classList.remove('dark');
        document.documentElement.classList.remove('dark');
        document.documentElement.setAttribute('data-theme', 'light');
    }
    // Update button icon
    var themeBtn = document.getElementById('themeBtn');
    if (themeBtn) {
        themeBtn.innerHTML = isDark 
            ? '<i class="fas fa-sun"></i>' 
            : '<i class="fas fa-moon"></i>';
    }
}

/**
 * localStorage থেকে theme পড়ে apply করে
 */
function initTheme() {
    var savedTheme = localStorage.getItem('uwTheme');
    if (savedTheme === 'dark' || savedTheme === 'light') {
        applyTheme(savedTheme);
    } else {
        // System preference detect
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(prefersDark ? 'dark' : 'light');
    }
}

/**
 * Toggle করে এবং localStorage এ save করে
 */
function toggleTheme() {
    var isCurrentlyDark = document.body.classList.contains('dark');
    var newTheme = isCurrentlyDark ? 'light' : 'dark';
    applyTheme(newTheme);
    localStorage.setItem('uwTheme', newTheme);
}

// ✅ Cross-tab sync — অন্য tab এ theme change হলে এই tab এ auto update
window.addEventListener('storage', function(e) {
    if (e.key === 'uwTheme' && e.newValue) {
        applyTheme(e.newValue);
    }
});

// ✅ System preference change listener
if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
        if (!localStorage.getItem('uwTheme')) {
            applyTheme(e.matches ? 'dark' : 'light');
        }
    });
}

/* ============================================
   ✅ UNIVERSAL USER EXTRACTOR
   ============================================ */
function extractUser(payload) {
    if (!payload) return null;
    var u = payload;
    var safety = 0;
    while (u && safety < 6) {
        if (u.id || u._id) return u;
        if (u.user && typeof u.user === 'object') { u = u.user; safety++; continue; }
        if (u.data && typeof u.data === 'object') { u = u.data; safety++; continue; }
        break;
    }
    return u;
}

/* ============================================
   ✅ LOGOUT
   ============================================ */
function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    localStorage.removeItem('pin_set');
    sessionStorage.removeItem('pin_verified');
    window.location.href = '/';
}

/* ============================================
   ✅ SHOW BLOCKED OVERLAY
   ============================================ */
function showBlockedOverlay(title, message) {
    if (isAccountBlocked) return;
    isAccountBlocked = true;
    if (title) document.getElementById('blockedTitle').textContent = title;
    if (message) document.getElementById('blockedSub').textContent = message;
    document.getElementById('blockedOverlay').classList.add('active');
}

/* ============================================
   ✅ CHECK STATUS BY MOBILE
   ============================================ */
async function checkStatusByMobile(mobile) {
    if (!mobile) return { allowed: true, reason: null };
    try {
        var cleanMobile = String(mobile).replace(/\D/g, '');
        if (cleanMobile.length === 12 && cleanMobile.startsWith('91')) {
            cleanMobile = cleanMobile.slice(2);
        }
        var res = await fetch('/api/check-status/' + cleanMobile);
        var data = await res.json();
        return data;
    } catch (err) {
        return { allowed: true, reason: 'network_error' };
    }
}

function handleBlockReason(reason) {
    if (reason === 'blocked') {
        showBlockedOverlay('Account Blocked', 'Your account has been blocked by administrator. Please contact support.');
    } else if (reason === 'deleted') {
        showBlockedOverlay('Account Deleted', 'Your account has been deleted. Please contact support.');
    } else if (reason === 'inactive') {
        showBlockedOverlay('Account Deactivated', 'Your account has been deactivated. Please contact support.');
    } else if (reason === 'notfound') {
        showBlockedOverlay('Account Not Found', 'Your account data could not be found.');
    } else {
        showBlockedOverlay('Access Denied', 'Your account is not accessible. Please contact support.');
    }
}

/* ============================================
   ✅ CHECK ACCOUNT STATE (Only if logged in)
   ============================================ */
async function checkAccountState() {
    var t = localStorage.getItem('token');
    if (!t) return; // Not logged in — skip check

    try {
        var res = await fetch('/api/auth/me', {
            headers: { 'Authorization': 'Bearer ' + t, 'Content-Type': 'application/json' }
        });
        var data = {};
        try { data = await res.json(); } catch (e) { data = {}; }

        // If session invalid, just clear token silently (not blocked, just expired)
        if (res.status === 401) {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            return;
        }

        if (res.status === 403) {
            showBlockedOverlay('Account Blocked', data.message || 'Your account has been blocked.');
            return;
        }
        if (res.status === 404) {
            showBlockedOverlay('Account Not Found', 'Your account has been deleted.');
            return;
        }

        var user = extractUser(data);
        if (!user) return;

        if (user.isBlocked === true) {
            showBlockedOverlay('Account Blocked', 'Your account has been blocked by administrator.');
            return;
        }
        if (user.isDeleted === true || user.deletedAt) {
            showBlockedOverlay('Account Deleted', 'Your account has been deleted.');
            return;
        }
        if (user.isActive === false) {
            showBlockedOverlay('Account Deactivated', 'Your account has been deactivated.');
            return;
        }

        if (user.mobile && !blockCheckDone) {
            blockCheckDone = true;
            var status = await checkStatusByMobile(user.mobile);
            if (status && status.allowed === false) {
                handleBlockReason(status.reason);
                return;
            }
        }
    } catch (err) {
        // Silent fail — this page doesn't require login
    }
}

/* ============================================
   TOAST
   ============================================ */
function showToast(message, type = 'info') {
    if (isAccountBlocked) return;
    const existing = document.querySelector('.toast-message');
    if (existing) existing.remove();

    const toast = document.createElement('div');
    toast.className = `toast-message ${type}`;
    toast.textContent = message;
    document.body.appendChild(toast);

    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(-50%) translateY(30px)';
        setTimeout(() => toast.remove(), 400);
    }, 3000);
}

/* ============================================
   INLINE MESSAGE
   ============================================ */
function showInlineMessage(message, type = 'error') {
    const container = document.getElementById('msgContainer');
    container.innerHTML = message;
    container.className = `msg ${type}`;
    container.style.display = 'block';
    setTimeout(() => {
        container.style.display = 'none';
        container.innerHTML = '';
    }, 5000);
}

function clearInlineMessage() {
    const container = document.getElementById('msgContainer');
    container.style.display = 'none';
    container.innerHTML = '';
}

/* ============================================
   TOGGLE PASSWORD
   ============================================ */
function togglePassword(inputId) {
    const p = document.getElementById(inputId);
    const icon = p.parentElement.querySelector('.password-eye i');
    if (p.type === "password") {
        p.type = "text";
        icon.className = 'fas fa-eye';
    } else {
        p.type = "password";
        icon.className = 'fas fa-eye-slash';
    }
}

/* ============================================
   PASSWORD VALIDATION
   ============================================ */
function validatePassword(password) {
    const checks = {
        length: password.length >= 8 && password.length <= 15,
        uppercase: /[A-Z]/.test(password),
        lowercase: /[a-z]/.test(password),
        number: /[0-9]/.test(password)
    };
    const ruleLength = document.getElementById('rule-length');
    const ruleUppercase = document.getElementById('rule-uppercase');
    const ruleLowercase = document.getElementById('rule-lowercase');
    const ruleNumber = document.getElementById('rule-number');
    if (ruleLength) { if (checks.length) ruleLength.classList.add('valid'); else ruleLength.classList.remove('valid'); }
    if (ruleUppercase) { if (checks.uppercase) ruleUppercase.classList.add('valid'); else ruleUppercase.classList.remove('valid'); }
    if (ruleLowercase) { if (checks.lowercase) ruleLowercase.classList.add('valid'); else ruleLowercase.classList.remove('valid'); }
    if (ruleNumber) { if (checks.number) ruleNumber.classList.add('valid'); else ruleNumber.classList.remove('valid'); }
    return checks.length && checks.uppercase && checks.lowercase && checks.number;
}

function setupPasswordValidation() {
    const passwordField = document.getElementById('password');
    const rulesContainer = document.getElementById('passwordRules');
    if (!passwordField || !rulesContainer) return;
    if (passwordTimeout) clearTimeout(passwordTimeout);
    const hideRules = () => rulesContainer.classList.remove('show');
    const updateRules = () => {
        rulesContainer.classList.add('show');
        validatePassword(passwordField.value);
        if (passwordTimeout) clearTimeout(passwordTimeout);
        passwordTimeout = setTimeout(hideRules, 1500);
    };
    passwordField.addEventListener('focus', function() {
        if (passwordField.value.length > 0) updateRules();
    });
    passwordField.addEventListener('input', function(e) { updateRules(); });
    passwordField.addEventListener('blur', function() {
        setTimeout(() => {
            if (document.activeElement !== passwordField) hideRules();
        }, 200);
    });
}

/* ============================================
   SWITCH IDENTIFIER
   ============================================ */
function switchIdentifier(type) {
    if (isAccountBlocked) return;
    currentIdentifier = type;
    const mobileBtn = document.getElementById('mobileToggle');
    const telegramBtn = document.getElementById('telegramToggle');
    const label = document.getElementById('identifierLabel');
    const input = document.getElementById('identifierInput');

    if (type === 'mobile') {
        mobileBtn.classList.add('active');
        telegramBtn.classList.remove('active');
        label.innerHTML = '<i class="fas fa-phone"></i> Mobile Number';
        input.placeholder = 'Enter Registered Mobile';
        input.inputMode = 'numeric';
        input.maxLength = 10;
        input.oninput = function() { this.value = this.value.replace(/[^0-9]/g,''); };
    } else {
        telegramBtn.classList.add('active');
        mobileBtn.classList.remove('active');
        label.innerHTML = '<i class="fab fa-telegram"></i> Telegram ID';
        input.placeholder = 'Enter Your Telegram ID';
        input.inputMode = 'numeric';
        input.maxLength = 15;
        input.oninput = function() { this.value = this.value.replace(/[^0-9]/g,''); };
    }

    if (otpExpiryTimer) {
        clearTimeout(otpExpiryTimer);
        otpExpiryTimer = null;
    }
    if (cooldown <= 0) {
        const btn = document.getElementById("otpBtn");
        const timerDiv = document.getElementById("timer");
        if (btn.classList.contains("disabled")) {
            btn.classList.remove("disabled");
            timerDiv.classList.add("hidden");
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send OTP';
        }
        if (interval) {
            clearInterval(interval);
            interval = null;
            cooldown = 0;
        }
    }
    document.getElementById("otp").value = '';
    clearInlineMessage();
}

/* ============================================
   COOLDOWN TIMER
   ============================================ */
function startCooldown() {
    cooldown = 60;
    const btn = document.getElementById("otpBtn");
    const timerDiv = document.getElementById("timer");

    btn.classList.add("disabled");
    timerDiv.classList.remove("hidden");
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending';

    if (interval) clearInterval(interval);

    interval = setInterval(() => {
        if (cooldown <= 0) {
            clearInterval(interval);
            btn.classList.remove("disabled");
            timerDiv.classList.add("hidden");
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send OTP';
        } else {
            timerDiv.textContent = `⏳ Resend In ${cooldown}s`;
            cooldown--;
        }
    }, 1000);
}

function startOTPExpiry() {
    if (otpExpiryTimer) clearTimeout(otpExpiryTimer);

    otpExpiryTimer = setTimeout(() => {
        showToast('OTP Expired. Please Request A New One', 'error');
        document.getElementById("otp").value = '';
        otpExpiryTimer = null;
    }, 300000);
}

/* ============================================
   SEND OTP
   ============================================ */
async function sendOTP() {
    if (isAccountBlocked) return;
    const identifier = document.getElementById("identifierInput").value.trim();
    if (!identifier) {
        showToast('Please Enter Your ' + (currentIdentifier === 'mobile' ? 'Mobile Number' : 'Telegram ID'), 'error');
        return;
    }

    if (currentIdentifier === 'mobile' && !/^[0-9]{10}$/.test(identifier)) {
        showToast('Please Enter A Valid 10-Digit Mobile Number', 'error');
        return;
    }

    if (currentIdentifier === 'telegram' && !/^[0-9]+$/.test(identifier)) {
        showToast('Please Enter A Valid Telegram ID (Numeric)', 'error');
        return;
    }

    if (cooldown > 0) {
        showToast(`Please Wait ${cooldown}s To Resend OTP`, 'error');
        return;
    }

    const btn = document.getElementById("otpBtn");
    const originalText = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
    btn.style.opacity = "0.7";

    try {
        let requestBody = {};

        if (currentIdentifier === 'mobile') {
            requestBody.mobile = identifier;
        } else {
            requestBody.telegramId = identifier;
        }

        const res = await fetch(`${API}/auth/send-forgot-password-otp`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(requestBody)
        });

        const data = await res.json();

        if (res.ok) {
            btn.innerHTML = '<i class="fas fa-check"></i> Sent';
            startCooldown();
            startOTPExpiry();
            showToast('OTP Sent To Your Telegram Successfully', 'success');
        } else {
            btn.innerHTML = originalText;
            const errorMsg = data.message || 'Failed To Send OTP. Please Try Again';
            const cleanMsg = errorMsg.replace(/<[^>]*>/g, '');
            showToast(cleanMsg, 'error');
        }
    } catch (err) {
        console.error('Send OTP Error:', err);
        btn.innerHTML = originalText;
        showToast('Connection Error. Please Check Your Network', 'error');
    } finally {
        setTimeout(() => {
            if (!btn.classList.contains("disabled")) {
                btn.innerHTML = originalText;
                btn.style.opacity = "1";
            } else {
                btn.style.opacity = "1";
            }
        }, 800);
    }
}

/* ============================================
   VERIFY OTP
   ============================================ */
async function verifyOTP() {
    if (isAccountBlocked) return;
    const identifier = document.getElementById("identifierInput").value.trim();
    const otp = document.getElementById("otp").value;

    if (!identifier) {
        showToast('Please Enter Your ' + (currentIdentifier === 'mobile' ? 'Mobile Number' : 'Telegram ID'), 'error');
        return;
    }

    if (!otp) {
        showToast('Please Enter The OTP', 'error');
        return;
    }

    if (otp.length !== 6) {
        showToast('OTP Must Be Exactly 6 Digits', 'error');
        return;
    }

    if (otpExpiryTimer === null) {
        showToast('OTP Expired. Please Request A New One', 'error');
        return;
    }

    const verifyBtn = document.getElementById('verifyBtn');
    const originalText = verifyBtn.innerHTML;
    verifyBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
    verifyBtn.disabled = true;

    try {
        let requestBody = { otp };

        if (currentIdentifier === 'mobile') {
            requestBody.mobile = identifier;
        } else {
            requestBody.telegramId = identifier;
        }

        const res = await fetch(`${API}/auth/verify-otp`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(requestBody)
        });

        const data = await res.json();

        if (res.ok && data.verified) {
            verifiedIdentifier = identifier;
            showToast('OTP Verified Successfully!', 'success');
            goToStep(2);
        } else {
            const errorMsg = data.message || 'Invalid OTP. Please Try Again';
            const cleanMsg = errorMsg.replace(/<[^>]*>/g, '');
            showToast(cleanMsg, 'error');
        }
    } catch (err) {
        console.error('Verify OTP Error:', err);
        showToast('Connection Error. Please Check Your Network', 'error');
    } finally {
        verifyBtn.innerHTML = originalText;
        verifyBtn.disabled = false;
    }
}

/* ============================================
   STEP NAVIGATION
   ============================================ */
function goToStep(step) {
    currentStep = step;

    for (let i = 1; i <= 3; i++) {
        const dot = document.getElementById(`step${i}`);
        dot.classList.remove('active', 'completed');
        if (i < step) {
            dot.classList.add('completed');
        } else if (i === step) {
            dot.classList.add('active');
        }
    }

    const step1Container = document.getElementById('step1Container');
    const step2Container = document.getElementById('step2Container');
    const subtitle = document.getElementById('stepSubtitle');

    if (step === 1) {
        step1Container.classList.remove('hidden');
        step2Container.classList.add('hidden');
        subtitle.textContent = 'Step 1: Verify Your Identity';
        clearInlineMessage();
    } else if (step === 2) {
        step1Container.classList.add('hidden');
        step2Container.classList.remove('hidden');
        subtitle.textContent = 'Step 2: Create New Password';
        setupPasswordValidation();
        clearInlineMessage();
    }
}

/* ============================================
   SAVE PASSWORD
   ============================================ */
async function savePassword() {
    if (isAccountBlocked) return;
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (!password) {
        showToast('Please Enter New Password', 'error');
        document.getElementById("password").focus();
        return;
    }

    const isPasswordValid = validatePassword(password);
    if (!isPasswordValid) {
        showToast('Password Must Have: 8-15 Chars, Uppercase, Lowercase & Number', 'error');
        document.getElementById("password").focus();
        return;
    }

    if (!confirmPassword) {
        showToast('Please Confirm Your Password', 'error');
        document.getElementById("confirmPassword").focus();
        return;
    }

    if (password !== confirmPassword) {
        showToast('Passwords Do Not Match', 'error');
        document.getElementById("confirmPassword").focus();
        return;
    }

    const saveBtn = document.getElementById('saveBtn');
    const originalText = saveBtn.innerHTML;
    saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
    saveBtn.disabled = true;

    try {
        let requestBody = { otp: document.getElementById("otp").value, password };

        if (currentIdentifier === 'mobile') {
            requestBody.mobile = verifiedIdentifier;
        } else {
            requestBody.telegramId = verifiedIdentifier;
        }

        const res = await fetch(`${API}/auth/reset-password`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(requestBody)
        });

        const data = await res.json();

        if (res.ok) {
            if (otpExpiryTimer) {
                clearTimeout(otpExpiryTimer);
                otpExpiryTimer = null;
            }

            document.getElementById('step3').classList.add('completed');

            // ✅ Clear any lingering auth state
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            localStorage.removeItem('pin_set');
            sessionStorage.removeItem('pin_verified');

            showToast('Password Reset Successful! Please Login', 'success');
            setTimeout(() => {
                window.location.href = "/";
            }, 1500);
        } else {
            const errorMsg = data.message || 'Reset Failed. Please Try Again';
            const cleanMsg = errorMsg.replace(/<[^>]*>/g, '');
            showToast(cleanMsg, 'error');
        }
    } catch (err) {
        console.error('Save Password Error:', err);
        showToast('Connection Error. Please Check Your Network', 'error');
    } finally {
        saveBtn.innerHTML = originalText;
        saveBtn.disabled = false;
    }
}

/* ============================================
   KEYBOARD HANDLERS
   ============================================ */
document.getElementById("otp").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        verifyOTP();
    }
});

document.getElementById("identifierInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("otp").focus();
});

document.getElementById("password").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("confirmPassword").focus();
});

document.getElementById("confirmPassword").addEventListener("keydown", (e) => {
    if (e.key === "Enter") savePassword();
});

document.getElementById("identifierInput").addEventListener("change", function() {
    if (otpExpiryTimer) {
        clearTimeout(otpExpiryTimer);
        otpExpiryTimer = null;
    }

    if (cooldown <= 0) {
        const btn = document.getElementById("otpBtn");
        const timerDiv = document.getElementById("timer");
        if (btn.classList.contains("disabled")) {
            btn.classList.remove("disabled");
            timerDiv.classList.add("hidden");
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send OTP';
        }
        if (interval) {
            clearInterval(interval);
            interval = null;
            cooldown = 0;
        }
    }
    document.getElementById("otp").value = '';
    clearInlineMessage();
});

/* ============================================
   ✅ INIT — DOMContentLoaded এ theme + auth state চেক
   ============================================ */
document.addEventListener('DOMContentLoaded', async function() {
    // ✅ STEP 1: Theme apply করুন (সবার আগে)
    initTheme();

    // ✅ STEP 2: Check if already logged-in user is blocked/deleted
    await checkAccountState();

    // ✅ STEP 3: Start step 1 form
    goToStep(1);
});
</script>
</body>
</html>
