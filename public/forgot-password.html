<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fᴏʀɢᴏᴛ Pᴀssᴡᴏʀᴅ • Pʀɪᴍᴇ Wᴀʟʟᴇᴛ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --p1: #a855f7;
            --p2: #6d28d9;
            --card-light: rgba(241, 239, 255, 0.9);
            --input-light: #ebe9ff;
            --border-soft: #555555;
            --border-soft-light: #888888;
            --red: #dc2626;
            --green: #16a34a;
            --neon-blue: #00f0ff;
            --neon-blue-deep: #0099ff;
            --neon-blue-glow: #00e0ff;
            --dark-bg-start: #0a0a1a;
            --dark-bg-mid: #0c1022;
            --dark-bg-end: #060610;
            --glass-dark: rgba(8, 12, 25, 0.85);
            
            --card: rgba(241, 239, 255, 0.92);
            --card-border: rgba(168, 85, 247, 0.2);
            --input: #fefefe;
            --text-primary: #1e1b2f;
            --text-secondary: #4a4a6a;
            --text-muted: #8b8b9f;
            --label-color: #5a5a7a;
            --btn-text: #ffffff;
            --success-bg: #e7fff4;
            --success-border: #34d399;
            --back-link: #7c3aed;
            --bg-gradient-start: #ede9fe;
            --bg-gradient-end: #f5f3ff;
            --grid-color: rgba(124, 58, 237, 0.12);
            --flow-gradient: linear-gradient(120deg, rgba(124,58,237,0.15), rgba(168,85,247,0.1), rgba(236,72,153,0.12));
            --shadow-sm: 0 8px 24px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.12);
            --danger-color: #ef4444;
            --danger-bg: #fee2e2;
        }

        body.dark {
            --p1: #c084fc;
            --p2: #8b5cf6;
            --card: rgba(30, 26, 47, 0.94);
            --card-border: rgba(192, 132, 252, 0.25);
            --input: rgba(8, 12, 28, 0.9);
            --text-primary: #f1f0ff;
            --text-secondary: #b9b4d4;
            --text-muted: #8e8aa8;
            --label-color: #b9b4d4;
            --btn-text: #ffffff;
            --success-bg: #0e2a24;
            --success-border: #2c6e5a;
            --back-link: #c084fc;
            --bg-gradient-start: #0f0a1a;
            --bg-gradient-end: #18132a;
            --grid-color: rgba(168, 85, 247, 0.08);
            --flow-gradient: linear-gradient(120deg, rgba(124,58,237,0.2), rgba(168,85,247,0.15), rgba(236,72,153,0.12));
            --shadow-sm: 0 8px 24px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.5);
            --danger-bg: #2d1a1a;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-attachment: fixed;
            transition: background 0.4s ease, color 0.3s ease;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body.light {
            background: 
                radial-gradient(circle at 20% 30%, #d1c4fd 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, #b8a9fa 0%, transparent 40%),
                linear-gradient(135deg, #f0ecfe, #f8f5ff);
        }

        body.dark {
            background: 
                radial-gradient(circle at 15% 25%, #00e0ff20 0%, transparent 50%),
                radial-gradient(circle at 85% 75%, #0088ff30 0%, transparent 50%),
                linear-gradient(135deg, #0a0a1a, #0c1025, #060610);
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(139, 92, 246, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(139, 92, 246, 0.06) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        body.dark::before {
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.06) 1px, transparent 1px);
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(139, 92, 246, 0.03) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
            animation: pulse 4s ease-in-out infinite;
        }

        body.dark::after {
            background: radial-gradient(circle at 20% 50%, rgba(0, 240, 255, 0.05) 0%, transparent 60%);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .star-dot {
            position: fixed;
            bottom: -20px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: riseStar linear infinite;
            opacity: 0;
        }
        .star-dot.big { box-shadow: 0 0 12px currentColor; }
        .star-dot.small { box-shadow: 0 0 4px currentColor; }
        @keyframes riseStar {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            5% { opacity: 0.9; }
            95% { opacity: 0.9; }
            100% { transform: translateY(-100vh) scale(0.5); opacity: 0; }
        }

        .wrapper {
            z-index: 2;
            position: relative;
            width: 100%;
            max-width: 400px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo {
            width: 78px;
            height: 78px;
            border-radius: 22px;
            background: linear-gradient(135deg, var(--p1), var(--p2));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 34px;
            margin: 0 auto 14px;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
            transition: all 0.3s ease;
        }

        body.dark .brand-logo {
            background: linear-gradient(135deg, #00e0ff, #0088ff);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .brand-title {
            font-size: 30px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            transition: color 0.3s ease;
        }

        body.dark .brand-title {
            color: #f0f5ff;
            text-shadow: 0 0 5px rgba(0, 224, 255, 0.5);
        }

        .brand-title span {
            color: #8b5cf6;
        }

        body.dark .brand-title span {
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .brand-subtitle {
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        body.dark .brand-subtitle {
            color: #6a7a9a;
        }

        .brand-divider {
            height: 3px;
            border-radius: 10px;
            background: linear-gradient(to right, #8b5cf6, #ec4899);
            margin-top: 14px;
            width: 60%;
            margin-left: auto;
            margin-right: auto;
        }

        body.dark .brand-divider {
            background: linear-gradient(to right, #00f0ff, #0099ff);
            box-shadow: 0 0 10px #00e0ff66;
        }

        .card {
            background: var(--card);
            padding: 28px;
            border-radius: 34px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }

        body.light .card {
            backdrop-filter: blur(10px);
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.1);
        }

        body.dark .card {
            background: var(--glass-dark);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 240, 255, 0.35);
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.6), 0 0 20px rgba(0, 224, 255, 0.25), inset 0 1px 0 rgba(255,255,255,0.03);
        }

        .forgot-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .forgot-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            transition: color 0.3s ease;
        }

        body.dark .forgot-title {
            color: #f0f5ff;
        }

        .forgot-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            transition: color 0.3s ease;
        }

        body.dark .forgot-subtitle {
            color: #8a8ab0;
        }

        .group {
            margin-top: 16px;
        }

        label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #8b8b9f;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
            transition: color 0.3s ease;
        }

        body.dark label {
            color: #8a8ab0;
        }

        .inputWrap {
            position: relative;
        }

        input {
            width: 100%;
            margin-top: 0;
            padding: 14px 16px;
            border-radius: 18px;
            border: 1px solid #888888 !important;
            outline: none;
            background: var(--input);
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            transition: all 0.2s;
        }

        body.light input {
            background: #fefefe;
            color: #2c2c2c;
            border-color: #888888 !important;
        }

        body.light input:focus {
            background: #fff;
            border-color: #9b6df2 !important;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
            outline: none;
        }

        body.dark input {
            background: rgba(8, 12, 28, 0.9);
            color: #e0f0ff;
            border: 1px solid rgba(0, 200, 230, 0.5) !important;
        }

        body.dark input:focus {
            background: #0a1030;
            border-color: #00f0ff !important;
            box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.25);
            outline: none;
        }

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 45px;
        }

        .password-eye {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
            transition: color 0.3s ease;
            z-index: 5;
            background: transparent;
            border: none;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
        }

        .password-eye:hover {
            color: #8b5cf6;
        }

        body.dark .password-eye:hover {
            color: #00f0ff;
        }

        .btn {
            margin-top: 24px;
            width: 100%;
            padding: 16px;
            border-radius: 28px;
            border: none;
            color: #fff;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            background: linear-gradient(135deg, var(--p1), var(--p2));
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(107, 70, 193, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        body.light .btn {
            background: linear-gradient(135deg, var(--p1), var(--p2));
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25);
        }

        body.dark .btn {
            background: linear-gradient(135deg, #00e0ff, #0088ff);
            box-shadow: 0 8px 20px rgba(0, 160, 255, 0.45);
            color: #0a0a1a;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(107, 70, 193, 0.4);
        }

        body.dark .btn:hover {
            box-shadow: 0 8px 18px rgba(0, 240, 255, 0.5);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .green {
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            color: var(--text-primary);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            height: 50px;
            min-width: 100px;
            justify-content: center;
        }

        body.light .green {
            background: #e7fff4;
            border: 1px solid #34d399;
            color: #059669;
        }

        body.dark .green {
            background: rgba(0, 30, 40, 0.7);
            border: 1px solid #00f0ff;
            color: #8effff;
        }

        .green:hover {
            transform: scale(0.98);
        }

        body.light .green:hover {
            background: #d4f5e0;
        }

        body.dark .green:hover {
            background: rgba(0, 50, 60, 0.7);
        }

        .green:active {
            transform: scale(0.97);
        }

        .green.disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.1);
        }

        .timer {
            font-size: 11px;
            margin-top: 8px;
            color: var(--p1);
            font-weight: 500;
            text-align: center;
            letter-spacing: 0.3px;
            transition: color 0.3s ease;
        }

        body.dark .timer {
            color: #00f0ff;
        }

        .hidden {
            display: none !important;
        }

        .back {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--back-link);
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        body.dark .back {
            color: #00f0ff;
        }

        .back:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            padding: 12px 24px;
            border-radius: 60px;
            background: #2a2a3a;
            color: #f0f0ff;
            font-weight: 600;
            font-size: 14px;
            max-width: 90%;
            text-align: center;
            animation: fadeInUp 0.3s ease;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2);
            backdrop-filter: blur(8px);
        }

        body.dark .toast-message {
            background: #00f0ff;
            color: #0a0a1a;
            border: none;
        }

        .toast-message.success {
            border-left: 4px solid #22c55e;
        }

        body.dark .toast-message.success {
            border-left: 4px solid #22c55e;
        }

        .toast-message.error {
            border-left: 4px solid var(--danger-color);
        }

        body.dark .toast-message.error {
            border-left: 4px solid #ff5e5e;
        }

        .toast-message.info {
            border-left: 4px solid var(--p1);
        }

        body.dark .toast-message.info {
            border-left: 4px solid #00f0ff;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .password-rules {
            margin-top: 8px;
            padding: 10px 12px;
            border-radius: 16px;
            background: rgba(0,0,0,0.03);
            display: none;
        }

        .password-rules.show {
            display: block;
        }

        body.dark .password-rules {
            background: rgba(255,255,255,0.05);
        }

        .password-rule {
            font-size: 11px;
            font-weight: 500;
            padding: 4px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s ease;
        }

        body.light .password-rule {
            color: #555555;
        }

        body.dark .password-rule {
            color: #aaaaaa;
        }

        .password-rule i {
            width: 16px;
            font-size: 11px;
        }

        .password-rule.valid i {
            color: var(--green);
        }

        body.light .password-rule.valid {
            color: var(--green);
        }

        body.dark .password-rule.valid {
            color: #6eff8e;
        }

        .msg {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 12px;
            display: none;
        }

        body.light .msg.error {
            background: #fee2e2;
            color: #000000 !important;
            border-left: 4px solid var(--red);
        }

        body.dark .msg.error {
            background: rgba(220, 38, 38, 0.2);
            color: #ffffff !important;
            border-left: 4px solid #ff5555;
            backdrop-filter: blur(4px);
        }

        body.light .msg.success {
            background: #dcfce7;
            color: #000000 !important;
            border-left: 4px solid var(--green);
        }

        body.dark .msg.success {
            background: rgba(22, 163, 74, 0.2);
            color: #ffffff !important;
            border-left: 4px solid #3eff6e;
            backdrop-filter: blur(4px);
        }

        .msg i {
            margin-right: 6px;
        }

        .msg.error, .msg.success {
            display: block;
        }

        .identifier-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .id-toggle-btn {
            flex: 1;
            padding: 8px 12px;
            border-radius: 16px;
            border: 2px solid transparent;
            background: transparent;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-secondary);
        }

        body.light .id-toggle-btn {
            color: #4a4a6a;
        }

        body.dark .id-toggle-btn {
            color: #8a8ab0;
        }

        .id-toggle-btn.active {
            border-color: var(--p1);
            background: rgba(139, 92, 246, 0.1);
        }

        body.dark .id-toggle-btn.active {
            border-color: #00f0ff;
            background: rgba(0, 240, 255, 0.1);
            color: #aaf0ff;
        }

        body.light .id-toggle-btn.active {
            color: #6d28d9;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .step-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-muted);
            opacity: 0.3;
            transition: all 0.3s ease;
        }

        .step-dot.active {
            opacity: 1;
            background: var(--p1);
            transform: scale(1.3);
        }

        body.dark .step-dot.active {
            background: #00f0ff;
        }

        .step-dot.completed {
            opacity: 0.7;
            background: var(--green);
        }

        body.dark .step-dot.completed {
            background: #6eff8e;
        }

        @media (max-width: 480px) {
            .card {
                padding: 20px;
            }
            .brand-title {
                font-size: 24px;
            }
            .forgot-title {
                font-size: 20px;
            }
            .toast-message {
                font-size: 12px;
                padding: 10px 16px;
                bottom: 20px;
            }
            .brand-logo {
                width: 64px;
                height: 64px;
                font-size: 28px;
            }
            .green {
                min-width: 85px;
                padding: 10px 12px;
                font-size: 12px;
            }
            input {
                padding: 12px 14px;
                font-size: 14px;
            }
            .id-toggle-btn {
                font-size: 11px;
                padding: 6px 10px;
            }
            .step-indicator {
                gap: 8px;
            }
            .step-dot {
                width: 8px;
                height: 8px;
            }
        }
    </style>
</head>
<body class="light">
    <div class="wrapper">
        <div class="brand-header">
            <div class="brand-logo">
                <i class="fas fa-wallet"></i>
            </div>
            <div class="brand-title">
                Pʀɪᴍᴇ <span>Wᴀʟʟᴇᴛ</span>
            </div>
            <div class="brand-subtitle">
                <i class="fas fa-shield-alt"></i> Sᴇᴄᴜʀᴇ • Fᴀsᴛ • Tʀᴜsᴛᴇᴅ <i class="fas fa-shield-alt"></i>
            </div>
            <div class="brand-divider"></div>
        </div>

        <div class="card">
            <div class="forgot-header">
                <div class="forgot-title">
                    <i class="fas fa-key" style="color: var(--p1);"></i> Fᴏʀɢᴏᴛ Pᴀssᴡᴏʀᴅ
                </div>
                <div class="forgot-subtitle" id="stepSubtitle">
                    Sᴛᴇᴘ 1: Vᴇʀɪꜰʏ Yᴏᴜʀ Iᴅᴇɴᴛɪᴛʏ
                </div>
            </div>

            <div class="step-indicator">
                <div class="step-dot active" id="step1"></div>
                <div class="step-dot" id="step2"></div>
                <div class="step-dot" id="step3"></div>
            </div>

            <div id="msgContainer" class="msg"></div>

            <div id="step1Container">
                <div class="identifier-toggle">
                    <button class="id-toggle-btn active" id="mobileToggle" onclick="switchIdentifier('mobile')">
                        <i class="fas fa-phone"></i> Mᴏʙɪʟᴇ
                    </button>
                    <button class="id-toggle-btn" id="telegramToggle" onclick="switchIdentifier('telegram')">
                        <i class="fab fa-telegram"></i> Tᴇʟᴇɢʀᴀᴍ
                    </button>
                </div>

                <div class="group">
                    <label id="identifierLabel"><i class="fas fa-phone"></i> Mᴏʙɪʟᴇ Nᴜᴍʙᴇʀ</label>
                    <input id="identifierInput" placeholder="Eɴᴛᴇʀ Rᴇɢɪsᴛᴇʀᴇᴅ Mᴏʙɪʟᴇ" inputmode="numeric" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                </div>

                <div class="group">
                    <label><i class="fas fa-shield-alt"></i> Oᴛᴘ</label>
                    <div class="row">
                        <input id="otp" placeholder="Eɴᴛᴇʀ 6-Dɪɢɪᴛ Oᴛᴘ" inputmode="numeric" maxlength="6" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                        <div id="otpBtn" class="green" onclick="sendOTP()">
                            <i class="fas fa-paper-plane"></i> Sᴇɴᴅ Oᴛᴘ
                        </div>
                    </div>
                    <div id="timer" class="timer hidden"></div>
                </div>

                <button class="btn" id="verifyBtn" onclick="verifyOTP()">
                    <i class="fas fa-check-circle"></i> Vᴇʀɪꜰʏ
                </button>
            </div>

            <div id="step2Container" class="hidden">
                <div class="group">
                    <label><i class="fas fa-lock"></i> Nᴇᴡ Pᴀssᴡᴏʀᴅ</label>
                    <div class="password-wrapper">
                        <input id="password" type="password" placeholder="Cʀᴇᴀᴛᴇ Nᴇᴡ Pᴀssᴡᴏʀᴅ" maxlength="15">
                        <button type="button" class="password-eye" onclick="togglePassword('password')"><i class="fas fa-eye-slash"></i></button>
                    </div>
                    <div class="password-rules" id="passwordRules">
                        <div class="password-rule" id="rule-length"><i class="fas fa-circle"></i> <span>8 to 15 characters</span></div>
                        <div class="password-rule" id="rule-uppercase"><i class="fas fa-circle"></i> <span>Uppercase letter (A-Z)</span></div>
                        <div class="password-rule" id="rule-lowercase"><i class="fas fa-circle"></i> <span>Lowercase letter (a-z)</span></div>
                        <div class="password-rule" id="rule-number"><i class="fas fa-circle"></i> <span>Number (0-9)</span></div>
                    </div>
                </div>

                <div class="group">
                    <label><i class="fas fa-check-double"></i> Cᴏɴꜰɪʀᴍ Pᴀssᴡᴏʀᴅ</label>
                    <div class="password-wrapper">
                        <input id="confirmPassword" type="password" placeholder="Cᴏɴꜰɪʀᴍ Nᴇᴡ Pᴀssᴡᴏʀᴅ" maxlength="15">
                        <button type="button" class="password-eye" onclick="togglePassword('confirmPassword')"><i class="fas fa-eye-slash"></i></button>
                    </div>
                </div>

                <button class="btn" id="saveBtn" onclick="savePassword()">
                    <i class="fas fa-save"></i> Sᴀᴠᴇ
                </button>
            </div>

            <div class="back" onclick="window.location.href='/'">
                <i class="fas fa-arrow-left"></i> Bᴀᴄᴋ Tᴏ Lᴏɢɪɴ
            </div>
        </div>
    </div>

    <script>
        const API = "/api";
        let cooldown = 0;
        let interval = null;
        let otpExpiryTimer = null;
        let currentIdentifier = 'mobile';
        let passwordTimeout = null;
        let verifiedIdentifier = null;
        let currentStep = 1;

        function loadTheme() {
            const saved = localStorage.getItem('jarvisTheme');
            const body = document.body;
            if (saved === 'dark') {
                body.classList.add('dark');
                body.classList.remove('light');
            } else {
                body.classList.add('light');
                body.classList.remove('dark');
            }
            updateStarColors();
        }

        function updateStarColors() {
            const stars = document.querySelectorAll('.star-dot');
            const isDark = document.body.classList.contains('dark');
            const color = isDark ? '#00f0ff' : '#8b5cf6';
            stars.forEach(star => {
                star.style.color = color;
                star.style.backgroundColor = color;
            });
        }

        document.addEventListener('DOMContentLoaded', loadTheme);

        function createStarDots() {
            const dotCount = Math.floor(Math.random() * 6) + 10;
            for (let i = 0; i < dotCount; i++) {
                const dot = document.createElement('div');
                dot.className = 'star-dot';
                const leftPos = Math.random() * 100;
                dot.style.left = leftPos + '%';
                const duration = 5 + Math.random() * 10;
                dot.style.animationDuration = duration + 's';
                const delay = Math.random() * 10;
                dot.style.animationDelay = delay + 's';
                const size = 2 + Math.random() * 7;
                dot.style.width = size + 'px';
                dot.style.height = size + 'px';
                if (size > 5) dot.classList.add('big');
                else dot.classList.add('small');
                const opacity = 0.4 + Math.random() * 0.5;
                dot.style.opacity = opacity;
                document.body.appendChild(dot);
            }
            updateStarColors();
        }
        createStarDots();

        function showToast(message, type = 'info') {
            const existing = document.querySelector('.toast-message');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = `toast-message ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(30px)';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        function showInlineMessage(message, type = 'error') {
            const container = document.getElementById('msgContainer');
            container.innerHTML = message;
            container.className = `msg ${type}`;
            container.style.display = 'block';
            setTimeout(() => {
                container.style.display = 'none';
                container.innerHTML = '';
            }, 5000);
        }

        function clearInlineMessage() {
            const container = document.getElementById('msgContainer');
            container.style.display = 'none';
            container.innerHTML = '';
        }

        function togglePassword(inputId) {
            const p = document.getElementById(inputId);
            const icon = p.parentElement.querySelector('.password-eye i');
            if (p.type === "password") {
                p.type = "text";
                icon.className = 'fas fa-eye';
            } else {
                p.type = "password";
                icon.className = 'fas fa-eye-slash';
            }
        }

        function validatePassword(password) {
            const checks = {
                length: password.length >= 8 && password.length <= 15,
                uppercase: /[A-Z]/.test(password),
                lowercase: /[a-z]/.test(password),
                number: /[0-9]/.test(password)
            };
            const ruleLength = document.getElementById('rule-length');
            const ruleUppercase = document.getElementById('rule-uppercase');
            const ruleLowercase = document.getElementById('rule-lowercase');
            const ruleNumber = document.getElementById('rule-number');
            if (ruleLength) { if (checks.length) ruleLength.classList.add('valid'); else ruleLength.classList.remove('valid'); }
            if (ruleUppercase) { if (checks.uppercase) ruleUppercase.classList.add('valid'); else ruleUppercase.classList.remove('valid'); }
            if (ruleLowercase) { if (checks.lowercase) ruleLowercase.classList.add('valid'); else ruleLowercase.classList.remove('valid'); }
            if (ruleNumber) { if (checks.number) ruleNumber.classList.add('valid'); else ruleNumber.classList.remove('valid'); }
            return checks.length && checks.uppercase && checks.lowercase && checks.number;
        }

        function setupPasswordValidation() {
            const passwordField = document.getElementById('password');
            const rulesContainer = document.getElementById('passwordRules');
            if (!passwordField || !rulesContainer) return;
            if (passwordTimeout) clearTimeout(passwordTimeout);
            const hideRules = () => rulesContainer.classList.remove('show');
            const updateRules = () => {
                rulesContainer.classList.add('show');
                validatePassword(passwordField.value);
                if (passwordTimeout) clearTimeout(passwordTimeout);
                passwordTimeout = setTimeout(hideRules, 1500);
            };
            passwordField.addEventListener('focus', function() {
                if (passwordField.value.length > 0) updateRules();
            });
            passwordField.addEventListener('input', function(e) { updateRules(); });
            passwordField.addEventListener('blur', function() {
                setTimeout(() => {
                    if (document.activeElement !== passwordField) hideRules();
                }, 200);
            });
        }

        function switchIdentifier(type) {
            currentIdentifier = type;
            const mobileBtn = document.getElementById('mobileToggle');
            const telegramBtn = document.getElementById('telegramToggle');
            const label = document.getElementById('identifierLabel');
            const input = document.getElementById('identifierInput');

            if (type === 'mobile') {
                mobileBtn.classList.add('active');
                telegramBtn.classList.remove('active');
                label.innerHTML = '<i class="fas fa-phone"></i> Mᴏʙɪʟᴇ Nᴜᴍʙᴇʀ';
                input.placeholder = 'Eɴᴛᴇʀ Rᴇɢɪsᴛᴇʀᴇᴅ Mᴏʙɪʟᴇ';
                input.inputMode = 'numeric';
                input.maxLength = 10;
                input.oninput = function() { this.value = this.value.replace(/[^0-9]/g,''); };
            } else {
                telegramBtn.classList.add('active');
                mobileBtn.classList.remove('active');
                label.innerHTML = '<i class="fab fa-telegram"></i> Tᴇʟᴇɢʀᴀᴍ Iᴅ';
                input.placeholder = 'Eɴᴛᴇʀ Yᴏᴜʀ Tᴇʟᴇɢʀᴀᴍ Iᴅ';
                input.inputMode = 'numeric';
                input.maxLength = 15;
                input.oninput = function() { this.value = this.value.replace(/[^0-9]/g,''); };
            }

            if (otpExpiryTimer) {
                clearTimeout(otpExpiryTimer);
                otpExpiryTimer = null;
            }
            if (cooldown <= 0) {
                const btn = document.getElementById("otpBtn");
                const timerDiv = document.getElementById("timer");
                if (btn.classList.contains("disabled")) {
                    btn.classList.remove("disabled");
                    timerDiv.classList.add("hidden");
                    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Sᴇɴᴅ Oᴛᴘ';
                }
                if (interval) {
                    clearInterval(interval);
                    interval = null;
                    cooldown = 0;
                }
            }
            document.getElementById("otp").value = '';
            clearInlineMessage();
        }

        function startCooldown() {
            cooldown = 60;
            const btn = document.getElementById("otpBtn");
            const timerDiv = document.getElementById("timer");

            btn.classList.add("disabled");
            timerDiv.classList.remove("hidden");
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sᴇɴᴅɪɴɢ';

            if (interval) clearInterval(interval);
            
            interval = setInterval(() => {
                if (cooldown <= 0) {
                    clearInterval(interval);
                    btn.classList.remove("disabled");
                    timerDiv.classList.add("hidden");
                    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Sᴇɴᴅ Oᴛᴘ';
                } else {
                    timerDiv.textContent = `⏳ Rᴇsᴇɴᴅ Iɴ ${cooldown}s`;
                    cooldown--;
                }
            }, 1000);
        }

        function startOTPExpiry() {
            if (otpExpiryTimer) clearTimeout(otpExpiryTimer);
            
            otpExpiryTimer = setTimeout(() => {
                showToast('⏰ Oᴛᴘ Exᴘɪʀᴇᴅ. Pʟᴇᴀsᴇ Rᴇǫᴜᴇsᴛ A Nᴇᴡ Oɴᴇ', 'error');
                document.getElementById("otp").value = '';
                otpExpiryTimer = null;
            }, 300000);
        }

        async function sendOTP() {
            const identifier = document.getElementById("identifierInput").value.trim();
            if (!identifier) {
                showToast('⚠️ Pʟᴇᴀsᴇ Eɴᴛᴇʀ Yᴏᴜʀ ' + (currentIdentifier === 'mobile' ? 'Mᴏʙɪʟᴇ Nᴜᴍʙᴇʀ' : 'Tᴇʟᴇɢʀᴀᴍ Iᴅ'), 'error');
                return;
            }

            if (currentIdentifier === 'mobile' && !/^[0-9]{10}$/.test(identifier)) {
                showToast('⚠️ Pʟᴇᴀsᴇ Eɴᴛᴇʀ A Vᴀʟɪᴅ 10-Dɪɢɪᴛ Mᴏʙɪʟᴇ Nᴜᴍʙᴇʀ', 'error');
                return;
            }

            if (currentIdentifier === 'telegram' && !/^[0-9]+$/.test(identifier)) {
                showToast('⚠️ Pʟᴇᴀsᴇ Eɴᴛᴇʀ A Vᴀʟɪᴅ Tᴇʟᴇɢʀᴀᴍ Iᴅ (Nᴜᴍᴇʀɪᴄ)', 'error');
                return;
            }

            if (cooldown > 0) {
                showToast(`⏳ Pʟᴇᴀsᴇ Wᴀɪᴛ ${cooldown}s Tᴏ Rᴇsᴇɴᴅ Oᴛᴘ`, 'error');
                return;
            }

            const btn = document.getElementById("otpBtn");
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sᴇɴᴅɪɴɢ...';
            btn.style.opacity = "0.7";

            try {
                let requestBody = {};
                
                if (currentIdentifier === 'mobile') {
                    requestBody.mobile = identifier;
                } else {
                    requestBody.telegramId = identifier;
                }

                const res = await fetch(`${API}/auth/send-forgot-password-otp`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(requestBody)
                });

                const data = await res.json();

                if (res.ok) {
                    btn.innerHTML = '<i class="fas fa-check"></i> Sᴇɴᴛ';
                    startCooldown();
                    startOTPExpiry();
                    showToast('✅ Oᴛᴘ Sᴇɴᴛ Tᴏ Yᴏᴜʀ Tᴇʟᴇɢʀᴀᴍ Sᴜᴄᴄᴇssꜰᴜʟʟʏ', 'success');
                } else {
                    btn.innerHTML = originalText;
                    const errorMsg = data.message || 'Fᴀɪʟᴇᴅ Tᴏ Sᴇɴᴅ Oᴛᴘ. Pʟᴇᴀsᴇ Tʀʏ Aɢᴀɪɴ';
                    const cleanMsg = errorMsg.replace(/<[^>]*>/g, '');
                    showToast(`❌ ${cleanMsg}`, 'error');
                }
            } catch (err) {
                console.error('❌ Sᴇɴᴅ Oᴛᴘ Eʀʀᴏʀ:', err);
                btn.innerHTML = originalText;
                showToast('⚠️ Cᴏɴɴᴇᴄᴛɪᴏɴ Eʀʀᴏʀ. Pʟᴇᴀsᴇ Cʜᴇᴄᴋ Yᴏᴜʀ Nᴇᴛᴡᴏʀᴋ', 'error');
            } finally {
                setTimeout(() => {
                    if (!btn.classList.contains("disabled")) {
                        btn.innerHTML = originalText;
                        btn.style.opacity = "1";
                    } else {
                        btn.style.opacity = "1";
                    }
                }, 800);
            }
        }

        async function verifyOTP() {
            const identifier = document.getElementById("identifierInput").value.trim();
            const otp = document.getElementById("otp").value;

            if (!identifier) {
                showToast('⚠️ Pʟᴇᴀsᴇ Eɴᴛᴇʀ Yᴏᴜʀ ' + (currentIdentifier === 'mobile' ? 'Mᴏʙɪʟᴇ Nᴜᴍʙᴇʀ' : 'Tᴇʟᴇɢʀᴀᴍ Iᴅ'), 'error');
                return;
            }

            if (!otp) {
                showToast('🔑 Pʟᴇᴀsᴇ Eɴᴛᴇʀ Tʜᴇ Oᴛᴘ', 'error');
                return;
            }

            if (otp.length !== 6) {
                showToast('⚠️ Oᴛᴘ Mᴜsᴛ Bᴇ Exᴀᴄᴛʟʏ 6 Dɪɢɪᴛs', 'error');
                return;
            }

            if (otpExpiryTimer === null) {
                showToast('⏰ Oᴛᴘ Exᴘɪʀᴇᴅ. Pʟᴇᴀsᴇ Rᴇǫᴜᴇsᴛ A Nᴇᴡ Oɴᴇ', 'error');
                return;
            }

            const verifyBtn = document.getElementById('verifyBtn');
            const originalText = verifyBtn.innerHTML;
            verifyBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Vᴇʀɪꜰʏɪɴɢ...';
            verifyBtn.disabled = true;

            try {
                let requestBody = { otp };
                
                if (currentIdentifier === 'mobile') {
                    requestBody.mobile = identifier;
                } else {
                    requestBody.telegramId = identifier;
                }

                const res = await fetch(`${API}/auth/verify-otp`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(requestBody)
                });

                const data = await res.json();

                if (res.ok && data.verified) {
                    verifiedIdentifier = identifier;
                    showToast('✅ Oᴛᴘ Vᴇʀɪꜰɪᴇᴅ Sᴜᴄᴄᴇssꜰᴜʟʟʏ!', 'success');
                    goToStep(2);
                } else {
                    const errorMsg = data.message || 'Iɴᴠᴀʟɪᴅ Oᴛᴘ. Pʟᴇᴀsᴇ Tʀʏ Aɢᴀɪɴ';
                    const cleanMsg = errorMsg.replace(/<[^>]*>/g, '');
                    showToast(`❌ ${cleanMsg}`, 'error');
                }
            } catch (err) {
                console.error('❌ Vᴇʀɪꜰʏ Oᴛᴘ Eʀʀᴏʀ:', err);
                showToast('⚠️ Cᴏɴɴᴇᴄᴛɪᴏɴ Eʀʀᴏʀ. Pʟᴇᴀsᴇ Cʜᴇᴄᴋ Yᴏᴜʀ Nᴇᴛᴡᴏʀᴋ', 'error');
            } finally {
                verifyBtn.innerHTML = originalText;
                verifyBtn.disabled = false;
            }
        }

        function goToStep(step) {
            currentStep = step;
            
            for (let i = 1; i <= 3; i++) {
                const dot = document.getElementById(`step${i}`);
                dot.classList.remove('active', 'completed');
                if (i < step) {
                    dot.classList.add('completed');
                } else if (i === step) {
                    dot.classList.add('active');
                }
            }

            const step1Container = document.getElementById('step1Container');
            const step2Container = document.getElementById('step2Container');
            const subtitle = document.getElementById('stepSubtitle');

            if (step === 1) {
                step1Container.classList.remove('hidden');
                step2Container.classList.add('hidden');
                subtitle.textContent = 'Sᴛᴇᴘ 1: Vᴇʀɪꜰʏ Yᴏᴜʀ Iᴅᴇɴᴛɪᴛʏ';
                clearInlineMessage();
            } else if (step === 2) {
                step1Container.classList.add('hidden');
                step2Container.classList.remove('hidden');
                subtitle.textContent = 'Sᴛᴇᴘ 2: Cʀᴇᴀᴛᴇ Nᴇᴡ Pᴀssᴡᴏʀᴅ';
                setupPasswordValidation();
                clearInlineMessage();
            }
        }

        async function savePassword() {
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (!password) {
                showToast('🔒 Pʟᴇᴀsᴇ Eɴᴛᴇʀ Nᴇᴡ Pᴀssᴡᴏʀᴅ', 'error');
                document.getElementById("password").focus();
                return;
            }

            const isPasswordValid = validatePassword(password);
            if (!isPasswordValid) {
                showToast('⚠️ Pᴀssᴡᴏʀᴅ Mᴜꜱᴛ Hᴀᴠᴇ: 8-15 Cʜᴀʀs, Uᴘᴘᴇʀᴄᴀsᴇ, Lᴏᴡᴇʀᴄᴀsᴇ & Nᴜᴍʙᴇʀ', 'error');
                document.getElementById("password").focus();
                return;
            }

            if (!confirmPassword) {
                showToast('🔒 Pʟᴇᴀsᴇ Cᴏɴꜰɪʀᴍ Yᴏᴜʀ Pᴀssᴡᴏʀᴅ', 'error');
                document.getElementById("confirmPassword").focus();
                return;
            }

            if (password !== confirmPassword) {
                showToast('⚠️ Pᴀssᴡᴏʀᴅs Dᴏ Nᴏᴛ Mᴀᴛᴄʜ', 'error');
                document.getElementById("confirmPassword").focus();
                return;
            }

            const saveBtn = document.getElementById('saveBtn');
            const originalText = saveBtn.innerHTML;
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sᴀᴠɪɴɢ...';
            saveBtn.disabled = true;

            try {
                let requestBody = { otp: document.getElementById("otp").value, password };
                
                if (currentIdentifier === 'mobile') {
                    requestBody.mobile = verifiedIdentifier;
                } else {
                    requestBody.telegramId = verifiedIdentifier;
                }

                const res = await fetch(`${API}/auth/reset-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(requestBody)
                });

                const data = await res.json();

                if (res.ok) {
                    if (otpExpiryTimer) {
                        clearTimeout(otpExpiryTimer);
                        otpExpiryTimer = null;
                    }
                    
                    document.getElementById('step3').classList.add('completed');
                    
                    showToast('✅ Pᴀssᴡᴏʀᴅ Rᴇsᴇᴛ Sᴜᴄᴄᴇssꜰᴜʟ! Pʟᴇᴀsᴇ Lᴏɢɪɴ', 'success');
                    setTimeout(() => {
                        window.location.href = "/";
                    }, 1500);
                } else {
                    const errorMsg = data.message || 'Rᴇsᴇᴛ Fᴀɪʟᴇᴅ. Pʟᴇᴀsᴇ Tʀʏ Aɢᴀɪɴ';
                    const cleanMsg = errorMsg.replace(/<[^>]*>/g, '');
                    showToast(`❌ ${cleanMsg}`, 'error');
                }
            } catch (err) {
                console.error('❌ Sᴀᴠᴇ Pᴀssᴡᴏʀᴅ Eʀʀᴏʀ:', err);
                showToast('⚠️ Cᴏɴɴᴇᴄᴛɪᴏɴ Eʀʀᴏʀ. Pʟᴇᴀsᴇ Cʜᴇᴄᴋ Yᴏᴜʀ Nᴇᴛᴡᴏʀᴋ', 'error');
            } finally {
                saveBtn.innerHTML = originalText;
                saveBtn.disabled = false;
            }
        }

        document.getElementById("otp").addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                verifyOTP();
            }
        });

        document.getElementById("identifierInput").addEventListener("keydown", (e) => {
            if (e.key === "Enter") document.getElementById("otp").focus();
        });

        document.getElementById("password").addEventListener("keydown", (e) => {
            if (e.key === "Enter") document.getElementById("confirmPassword").focus();
        });

        document.getElementById("confirmPassword").addEventListener("keydown", (e) => {
            if (e.key === "Enter") savePassword();
        });

        document.getElementById("identifierInput").addEventListener("change", function() {
            if (otpExpiryTimer) {
                clearTimeout(otpExpiryTimer);
                otpExpiryTimer = null;
            }
            
            if (cooldown <= 0) {
                const btn = document.getElementById("otpBtn");
                const timerDiv = document.getElementById("timer");
                if (btn.classList.contains("disabled")) {
                    btn.classList.remove("disabled");
                    timerDiv.classList.add("hidden");
                    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Sᴇɴᴅ Oᴛᴘ';
                }
                if (interval) {
                    clearInterval(interval);
                    interval = null;
                    cooldown = 0;
                }
            }
            document.getElementById("otp").value = '';
            clearInlineMessage();
        });

        goToStep(1);
    </script>
</body>
</html>
