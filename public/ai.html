<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Universal Wallet AI — Your Intelligent Financial Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --blue: #1a56db; --blue2: #1e40af; --blue3: #3b82f6; --blue-lt: #eff6ff; --blue-glow: rgba(26,86,219,.18); --bg: #f0f5ff; --white: #ffffff; --border: #dbeafe; --text: #0f172a; --muted: #64748b; }
html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

/* === Animated ambient background === */
.ambient { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
.ambient::before { content: ''; position: absolute; top: -20%; left: -10%; width: 60%; height: 60%; border-radius: 50%; background: radial-gradient(circle, rgba(26,86,219,.20), transparent 70%); filter: blur(60px); animation: float1 18s ease-in-out infinite; }
.ambient::after { content: ''; position: absolute; bottom: -20%; right: -10%; width: 55%; height: 55%; border-radius: 50%; background: radial-gradient(circle, rgba(59,130,246,.18), transparent 70%); filter: blur(60px); animation: float2 22s ease-in-out infinite; }
@keyframes float1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(60px,40px) scale(1.15); } }
@keyframes float2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-60px,-40px) scale(1.15); } }
.dots-grid { position: fixed; inset: 0; z-index: 0; background-image: radial-gradient(rgba(26,86,219,.10) 1px, transparent 1px); background-size: 24px 24px; mask-image: radial-gradient(ellipse at center, black 40%, transparent 75%); -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 75%); }

/* === Layout === */
.layout { position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; max-width: 920px; margin: 0 auto; padding: 0 16px; }

/* === Floating header === */
header { margin-top: 14px; padding: 12px 18px; border-radius: 18px; background: rgba(255,255,255,.85); backdrop-filter: blur(20px); border: 1.5px solid var(--border); box-shadow: 0 8px 32px rgba(26,86,219,.10), 0 1px 0 rgba(255,255,255,.9) inset; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; gap: 12px; }
.header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.hex-avatar { position: relative; width: 46px; height: 46px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.hex-avatar svg { position: absolute; inset: 0; width: 100%; height: 100%; animation: hexSpin 12s linear infinite; }
.hex-avatar svg polygon { fill: none; stroke: url(#hexGrad); stroke-width: 2; }
@keyframes hexSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.hex-icon { position: relative; z-index: 2; font-size: 18px; color: var(--blue); }
.header-info h1 { font-size: 16px; font-weight: 800; letter-spacing: -.3px; color: var(--text); display: flex; align-items: center; gap: 8px; }
.header-info h1 .live-dot { width: 7px; height: 7px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 0 3px rgba(34,197,94,.2); animation: livePulse 2s ease-in-out infinite; }
@keyframes livePulse { 0%,100% { box-shadow: 0 0 0 3px rgba(34,197,94,.2); } 50% { box-shadow: 0 0 0 6px rgba(34,197,94,.05); } }
.header-info p { font-size: 11px; color: var(--muted); font-weight: 500; margin-top: 1px; }
.header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.pill-badge { display: flex; align-items: center; gap: 6px; background: var(--blue-lt); border: 1.5px solid var(--border); color: var(--blue); font-size: 10px; font-weight: 700; padding: 5px 10px; border-radius: 20px; letter-spacing: .3px; font-family: 'JetBrains Mono', monospace; white-space: nowrap; }
.pill-badge i { font-size: 9px; }
.icon-btn { width: 36px; height: 36px; border-radius: 12px; background: var(--white); border: 1.5px solid var(--border); color: var(--blue); display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; font-size: 14px; transition: all .2s; }
.icon-btn:hover { background: var(--blue); color: #fff; border-color: var(--blue); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(26,86,219,.3); }

/* === Chat area === */
.chat-area { flex: 1; overflow-y: auto; padding: 22px 4px 12px; display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth; }
.chat-area::-webkit-scrollbar { width: 5px; }
.chat-area::-webkit-scrollbar-track { background: transparent; }
.chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }

/* === Welcome hero === */
.welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; text-align: center; padding: 20px; gap: 22px; }
.hero-orb { position: relative; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; }
.hero-orb .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid transparent; }
.hero-orb .ring-1 { border-top-color: var(--blue); border-right-color: rgba(26,86,219,.3); animation: ringSpin 4s linear infinite; }
.hero-orb .ring-2 { inset: 10px; border-bottom-color: var(--blue3); border-left-color: rgba(59,130,246,.3); animation: ringSpin 6s linear infinite reverse; }
.hero-orb .ring-3 { inset: 20px; border-top-color: rgba(26,86,219,.5); animation: ringSpin 5s linear infinite; }
@keyframes ringSpin { to { transform: rotate(360deg); } }
.hero-orb .core { position: relative; z-index: 2; width: 68px; height: 68px; background: linear-gradient(135deg, var(--blue), var(--blue2)); border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #fff; box-shadow: 0 12px 40px rgba(26,86,219,.4), inset 0 1px 0 rgba(255,255,255,.2); animation: corePulse 3s ease-in-out infinite; }
@keyframes corePulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.welcome h2 { font-size: 30px; font-weight: 900; letter-spacing: -.7px; line-height: 1.15; background: linear-gradient(135deg, var(--blue2), var(--blue), var(--blue3)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.welcome p { font-size: 14px; color: var(--muted); max-width: 400px; line-height: 1.6; font-weight: 500; }

/* === Quick prompt tiles === */
.quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 580px; margin-top: 8px; }
.quick-btn { position: relative; overflow: hidden; background: rgba(255,255,255,.9); backdrop-filter: blur(10px); border: 1.5px solid var(--border); border-radius: 16px; padding: 14px 16px; text-align: left; cursor: pointer; transition: all .25s cubic-bezier(.4,0,.2,1); font-family: 'Inter', sans-serif; display: flex; align-items: center; gap: 12px; }
.quick-btn::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(26,86,219,.06), transparent); opacity: 0; transition: opacity .3s; }
.quick-btn:hover { border-color: var(--blue); box-shadow: 0 10px 28px var(--blue-glow); transform: translateY(-3px); }
.quick-btn:hover::before { opacity: 1; }
.quick-btn .q-icon-wrap { position: relative; z-index: 1; width: 38px; height: 38px; flex-shrink: 0; border-radius: 11px; background: linear-gradient(135deg, var(--blue-lt), #fff); border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--blue); transition: all .25s; }
.quick-btn:hover .q-icon-wrap { background: var(--blue); color: #fff; border-color: var(--blue); transform: rotate(-6deg) scale(1.05); }
.quick-btn .q-body { position: relative; z-index: 1; min-width: 0; }
.quick-btn .q-text { font-size: 13px; font-weight: 700; color: var(--text); }
.quick-btn .q-sub { font-size: 10.5px; color: var(--muted); margin-top: 2px; font-weight: 500; }

/* === Message bubbles === */
.msg { display: flex; gap: 10px; align-items: flex-end; animation: msgIn .35s cubic-bezier(.4,0,.2,1); }
@keyframes msgIn { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
.msg.user { flex-direction: row-reverse; }
.msg-avatar { width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.msg.ai .msg-avatar { background: linear-gradient(135deg, var(--blue), var(--blue2)); color: #fff; box-shadow: 0 4px 12px rgba(26,86,219,.3); }
.msg.user .msg-avatar { background: linear-gradient(135deg, #f1f5f9, #e2e8f0); color: #475569; }
.msg-bubble { max-width: 74%; padding: 13px 17px; border-radius: 20px; font-size: 14px; line-height: 1.65; position: relative; }
.msg.ai .msg-bubble { background: rgba(255,255,255,.95); backdrop-filter: blur(10px); border: 1.5px solid var(--border); border-bottom-left-radius: 6px; color: var(--text); box-shadow: 0 4px 16px rgba(26,86,219,.06); }
.msg.user .msg-bubble { background: linear-gradient(135deg, var(--blue), var(--blue2)); color: #fff; border-bottom-right-radius: 6px; box-shadow: 0 6px 20px rgba(26,86,219,.35); }
.msg-time { font-size: 10px; color: var(--muted); margin-top: 5px; text-align: right; font-family: 'JetBrains Mono', monospace; font-weight: 500; opacity: .8; }
.msg.ai .msg-time { text-align: left; }

/* === Typing === */
.typing-indicator { display: none; align-items: flex-end; gap: 10px; animation: msgIn .35s ease; }
.typing-indicator.show { display: flex; }
.typing-bubble { background: rgba(255,255,255,.95); backdrop-filter: blur(10px); border: 1.5px solid var(--border); border-radius: 20px; border-bottom-left-radius: 6px; padding: 15px 20px; display: flex; gap: 6px; align-items: center; box-shadow: 0 4px 16px rgba(26,86,219,.06); }
.dot { width: 7px; height: 7px; background: var(--blue3); border-radius: 50%; animation: bounce 1.3s ease-in-out infinite; }
.dot:nth-child(2) { animation-delay: .18s; }
.dot:nth-child(3) { animation-delay: .36s; }
@keyframes bounce { 0%,80%,100% { transform: scale(.7); opacity: .4; } 40% { transform: scale(1.15); opacity: 1; } }

/* === Input bar === */
.input-bar { padding: 12px 0 18px; flex-shrink: 0; }
.input-wrap { display: flex; align-items: flex-end; gap: 10px; background: rgba(255,255,255,.95); backdrop-filter: blur(20px); border: 2px solid var(--border); border-radius: 20px; padding: 10px 10px 10px 20px; transition: all .25s; box-shadow: 0 10px 32px rgba(26,86,219,.10), 0 1px 0 rgba(255,255,255,.9) inset; }
.input-wrap:focus-within { border-color: var(--blue); box-shadow: 0 12px 36px rgba(26,86,219,.22), 0 0 0 4px rgba(26,86,219,.08); }
#userInput { flex: 1; background: none; border: none; outline: none; font-family: 'Inter', sans-serif; font-size: 15px; color: var(--text); resize: none; min-height: 24px; max-height: 120px; line-height: 1.5; padding: 6px 0; }
#userInput::placeholder { color: #b0c0d8; font-weight: 500; }
.btn-send { width: 46px; height: 46px; border-radius: 14px; background: linear-gradient(135deg, var(--blue), var(--blue2)); border: none; color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s; flex-shrink: 0; box-shadow: 0 6px 18px rgba(26,86,219,.4); }
.btn-send:hover:not(:disabled) { transform: translateY(-2px) scale(1.03); box-shadow: 0 10px 26px rgba(26,86,219,.5); }
.btn-send:active:not(:disabled) { transform: scale(.96); }
.btn-send:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.input-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding: 0 6px; gap: 8px; }
.input-hint { font-size: 10.5px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 5px; }
.input-hint i { font-size: 9px; }
.powered { font-size: 10.5px; color: var(--muted); display: flex; align-items: center; gap: 5px; font-weight: 500; }
.powered-dot { width: 6px; height: 6px; background: #22c55e; border-radius: 50%; animation: blink 2s ease-in-out infinite; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

@media (max-width: 640px) {
    .quick-grid { grid-template-columns: 1fr; }
    .pill-badge { display: none; }
    .msg-bubble { max-width: 84%; }
    .welcome h2 { font-size: 24px; }
    .hero-orb { width: 100px; height: 100px; }
    .hero-orb .core { width: 58px; height: 58px; font-size: 22px; border-radius: 18px; }
    header { padding: 10px 14px; }
    .header-info h1 { font-size: 14px; }
    .header-info p { font-size: 10px; }
    .hex-avatar { width: 40px; height: 40px; }
    .icon-btn { width: 32px; height: 32px; font-size: 12px; }
    .input-hint { display: none; }
}
</style>
</head>
<body>

<!-- Ambient background -->
<div class="ambient"></div>
<div class="dots-grid"></div>

<!-- Hidden SVG gradient defs -->
<svg width="0" height="0" style="position:absolute;">
    <defs>
        <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1a56db"/>
            <stop offset="100%" stop-color="#3b82f6"/>
        </linearGradient>
    </defs>
</svg>

<div class="layout">

    <!-- HEADER -->
    <header>
        <div class="header-left">
            <div class="hex-avatar">
                <svg viewBox="0 0 100 100">
                    <polygon points="50,5 90,27 90,73 50,95 10,73 10,27"/>
                </svg>
                <i class="fas fa-brain hex-icon"></i>
            </div>
            <div class="header-info">
                <h1>Wallet Assistant <span class="live-dot"></span></h1>
                <p>Powered by Universal Wallet AI</p>
            </div>
        </div>
        <div class="header-right">
            <div class="pill-badge" id="modelBadge"><i class="fas fa-microchip"></i> Llama 3.3 · 70B</div>
            <a href="/dashboard" class="icon-btn" title="Back to Dashboard"><i class="fas fa-arrow-left"></i></a>
        </div>
    </header>

    <!-- CHAT AREA -->
    <div class="chat-area" id="chatArea">

        <div class="welcome" id="welcome">
            <div class="hero-orb">
                <div class="ring ring-1"></div>
                <div class="ring ring-2"></div>
                <div class="ring ring-3"></div>
                <div class="core"><i class="fas fa-comment-dots"></i></div>
            </div>
            <div>
                <h2>How can I help you today?</h2>
                <p>Ask me anything about Universal Wallet — payments, transfers, Lifafa, deposits, or account security.</p>
            </div>
            <div class="quick-grid">
                <button class="quick-btn" onclick="quickAsk('What are the features of Universal Wallet?')">
                    <span class="q-icon-wrap"><i class="fas fa-wallet"></i></span>
                    <div class="q-body">
                        <div class="q-text">Explore Features</div>
                        <div class="q-sub">Discover what's inside</div>
                    </div>
                </button>
                <button class="quick-btn" onclick="quickAsk('How does the Lifafa system work?')">
                    <span class="q-icon-wrap"><i class="fas fa-envelope-open-text"></i></span>
                    <div class="q-body">
                        <div class="q-text">Send a Lifafa</div>
                        <div class="q-sub">Learn the envelope system</div>
                    </div>
                </button>
                <button class="quick-btn" onclick="quickAsk('How do I deposit money in Universal Wallet?')">
                    <span class="q-icon-wrap"><i class="fas fa-circle-plus"></i></span>
                    <div class="q-body">
                        <div class="q-text">Add Funds</div>
                        <div class="q-sub">Step-by-step deposit guide</div>
                    </div>
                </button>
                <button class="quick-btn" onclick="quickAsk('What should I do if a transfer fails?')">
                    <span class="q-icon-wrap"><i class="fas fa-circle-question"></i></span>
                    <div class="q-body">
                        <div class="q-text">Troubleshoot</div>
                        <div class="q-sub">Fix transfer problems</div>
                    </div>
                </button>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <div class="msg-avatar"><i class="fas fa-brain"></i></div>
            <div class="typing-bubble">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

    </div>

    <!-- INPUT BAR -->
    <div class="input-bar">
        <div class="input-wrap">
            <textarea id="userInput" placeholder="Type your question here..." rows="1" oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
            <button class="btn-send" id="sendBtn" onclick="sendMessage()"><i class="fas fa-arrow-up"></i></button>
        </div>
        <div class="input-footer">
            <span class="input-hint"><i class="fas fa-lightbulb"></i> Tip: Be specific for better answers</span>
            <span class="powered"><span class="powered-dot"></span>Universal Wallet · Secure & Fast</span>
        </div>
    </div>

</div>

<script>
const API = 'https://universe-wallet.vercel.app';
let chatHistory = [];
let isLoading = false;
let welcomeHidden = false;

const MODEL_LABELS = {
    'Meta-Llama-3.3-70B-Instruct': 'Llama 3.3 · 70B',
    'Meta-Llama-3.1-8B-Instruct': 'Llama 3.1 · 8B',
    'Qwen2.5-72B-Instruct': 'Qwen 2.5 · 72B',
    'Qwen2.5-Coder-32B-Instruct': 'Qwen Coder · 32B',
    'DeepSeek-R1-Distill-Llama-70B': 'DeepSeek R1 · 70B',
    'DeepSeek-V3-0324': 'DeepSeek V3'
};

function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
}

function quickAsk(text) {
    document.getElementById('userInput').value = text;
    sendMessage();
}

function getTime() {
    return new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
}

function appendMsg(role, text) {
    if (!welcomeHidden) {
        document.getElementById('welcome').style.display = 'none';
        welcomeHidden = true;
    }
    const chatArea = document.getElementById('chatArea');
    const typingEl = document.getElementById('typingIndicator');
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    const avatarIcon = role === 'ai'
        ? '<i class="fas fa-brain"></i>'
        : '<i class="fas fa-user"></i>';
    const timeStr = getTime();
    const formatted = text.replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
    div.innerHTML = `
        <div class="msg-avatar">${avatarIcon}</div>
        <div>
            <div class="msg-bubble">${formatted}</div>
            <div class="msg-time">${timeStr}</div>
        </div>
    `;
    chatArea.insertBefore(div, typingEl);
    scrollBottom();
}

function scrollBottom() {
    const chatArea = document.getElementById('chatArea');
    chatArea.scrollTop = chatArea.scrollHeight;
}

function showTyping(show) {
    const el = document.getElementById('typingIndicator');
    el.classList.toggle('show', show);
    if (show) scrollBottom();
}

async function sendMessage() {
    if (isLoading) return;
    const input = document.getElementById('userInput');
    const msg = input.value.trim();
    if (!msg) return;

    isLoading = true;
    input.value = '';
    input.style.height = 'auto';
    document.getElementById('sendBtn').disabled = true;

    appendMsg('user', msg);
    showTyping(true);

    try {
        const res = await fetch(`${API}/ai/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg, history: chatHistory.slice(-10) })
        });

        const data = await res.json();
        showTyping(false);

        if (data.status === 'success') {
            appendMsg('ai', data.reply);
            chatHistory.push({ role: 'user', content: msg });
            chatHistory.push({ role: 'assistant', content: data.reply });
            if (data.model && MODEL_LABELS[data.model]) {
                document.getElementById('modelBadge').innerHTML = '<i class="fas fa-microchip"></i> ' + MODEL_LABELS[data.model];
            }
        } else {
            appendMsg('ai', '<i class="fas fa-circle-exclamation" style="color:#dc2626;margin-right:6px;"></i> ' + (data.message || 'Something went wrong. Please try again.'));
            chatHistory.push({ role: 'user', content: msg });
        }
    } catch (e) {
        showTyping(false);
        appendMsg('ai', '<i class="fas fa-wifi" style="color:#dc2626;margin-right:6px;"></i> Network error. Please check your connection and try again.');
        chatHistory.push({ role: 'user', content: msg });
    }

    isLoading = false;
    document.getElementById('sendBtn').disabled = false;
    input.focus();
}
</script>
</body>
</html>
